<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档记忆卡 · 记忆 + 刷题一体化</title>
<style>
  :root{
    --primary:#3b82f6; --primary-light:#dbeafe; --primary-dark:#2563eb;
    --green:#22c55e; --green-light:#dcfce7; --green-dark:#16a34a;
    --orange:#f59e0b; --orange-light:#fef3c7;
    --red:#ef4444; --red-light:#fee2e2;
    --text:#1e293b; --text-2:#475569; --text-3:#94a3b8;
    --border:#e2e8f0; --bg:#f1f5f9; --card:#ffffff;
    --radius:12px; --radius-s:8px;
    --shadow:0 1px 3px rgba(15,23,42,.08);
    --shadow-md:0 4px 16px rgba(15,23,42,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--bg);
       display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.05)}
  /* top bar */
  .topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--border);
          display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
  .topbar .brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
  .topbar .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#8b5cf6);
          color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
  .tabs{display:flex;gap:6px}
  .tab{padding:7px 14px;border-radius:20px;font-size:14px;font-weight:600;color:var(--text-3);cursor:pointer}
  .tab.active{background:var(--primary-light);color:var(--primary)}
  .main{flex:1;overflow-y:auto;padding:18px}
  .view{display:none} .view.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* generic */
  .card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .rules-box{border:1px dashed var(--border);border-radius:var(--radius-s);padding:10px 12px;background:rgba(99,102,241,.05);margin-top:12px}
  .rules-box .rb-h{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:7px;display:flex;align-items:center;gap:5px}
  .rules-box ul{margin:0;padding:0;list-style:none;font-size:12px;line-height:1.8;color:var(--text-2)}
  .rules-box li{display:flex;gap:7px;align-items:baseline}
  .rules-box li b{color:var(--text);white-space:nowrap;font-weight:700}
  .rules-box .mo{color:var(--text-3);font-size:11px;margin-top:7px}
  .muted{color:var(--text-3);font-size:13px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .btn{border:none;border-radius:var(--radius-s);padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;
       display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;font-family:inherit}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-green{background:var(--green);color:#fff}
  .btn-green:hover{background:var(--green-dark)}
  .btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary)}
  .btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border)}
  .btn-block{width:100%}
  .btn-sm{padding:7px 12px;font-size:13px}
  .btn-danger{background:var(--red-light);color:var(--red);border:1px solid #fecaca}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .stat{background:#fff;border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);text-align:center}
  .stat .n{font-size:30px;font-weight:800;color:var(--primary);line-height:1.1}
  .stat .n.g{color:var(--green)} .stat .n.o{color:var(--orange)} .stat .n.r{color:var(--red)}
  .stat .l{font-size:12px;color:var(--text-3);margin-top:2px}

  .deck{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--radius);padding:14px;
        box-shadow:var(--shadow);cursor:pointer;transition:.15s;margin-bottom:12px}
  .deck:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .deck .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .deck .info{flex:1;min-width:0}
  .deck .info .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .deck .info .mt{font-size:12px;color:var(--text-3)}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .tag-q{background:var(--green-light);color:var(--green-dark)}
  .tag-c{background:var(--primary-light);color:var(--primary-dark)}
  .tag-b{background:#ede9fe;color:#7c3aed}

  .section-title{font-size:13px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin:6px 2px 10px}

  /* import */
  .dropzone{border:2px dashed var(--border);border-radius:var(--radius);padding:30px;text-align:center;
            color:var(--text-3);cursor:pointer;transition:.15s;background:#fff}
  .dropzone:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
  .seg{display:flex;gap:8px}
  .seg .opt{flex:1;border:2px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;transition:.15s;font-weight:600}
  .seg .opt.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark)}
  .seg .opt .em{font-size:26px;display:block;margin-bottom:4px}
  textarea,input[type=text],input[type=date],select{font-family:inherit;font-size:14px;border:1px solid var(--border);
        border-radius:var(--radius-s);padding:9px 11px;width:100%;background:#fff;color:var(--text)}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--primary)}
  textarea{resize:vertical;min-height:120px}

  /* preview editable list */
  .pv{border:1px solid var(--border);border-radius:var(--radius-s);padding:12px;margin-bottom:10px;background:#fff}
  .pv .pv-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .pv .pv-field{margin-bottom:7px}
  .pv .pv-field label{display:block;font-size:11px;color:var(--text-3);margin-bottom:2px;font-weight:600}

  /* deck detail */
  .mode-cards{display:flex;gap:12px;margin:14px 0}
  .mode-card{flex:1;border:2px solid var(--border);border-radius:var(--radius);padding:20px 14px;text-align:center;cursor:pointer;transition:.15s;font-weight:700;font-size:15px}
  .mode-card:hover{border-color:var(--primary)}
  .mode-card.m1{background:var(--primary-light)} .mode-card.m2{background:var(--green-light)}
  .mode-card .em{font-size:32px;display:block;margin-bottom:6px}
  .tabs2{display:flex;gap:4px;background:#eef2f7;border-radius:10px;padding:4px;margin-bottom:12px}
  .tabs2 .t{flex:1;text-align:center;padding:8px;font-size:13px;font-weight:600;color:var(--text-3);border-radius:7px;cursor:pointer}
  .tabs2 .t.active{background:#fff;color:var(--text);box-shadow:var(--shadow)}

  .li{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fff;border-radius:var(--radius-s);
      box-shadow:var(--shadow);margin-bottom:8px;gap:10px}
  .li .lt{flex:1;min-width:0}
  .li .lt .a{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .lt .b{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* study flashcard */
  .flashcard{background:#fff;border-radius:18px;min-height:240px;box-shadow:var(--shadow-md);
             display:flex;align-items:center;justify-content:center;padding:34px 26px;text-align:center;cursor:pointer;
             user-select:none;transition:transform .3s;position:relative}
  .flashcard .face{font-size:19px;font-weight:700;line-height:1.6;word-break:break-word}
  .flashcard .hint{position:absolute;bottom:14px;left:0;right:0;font-size:12px;color:var(--text-3)}
  .flashcard.flipped{background:linear-gradient(135deg,#eff6ff,#faf5ff)}
  .feedback{display:flex;gap:10px;margin-top:14px}
  .feedback .fb{flex:1;border:none;border-radius:var(--radius-s);padding:13px;font-size:14px;font-weight:700;cursor:pointer;color:#fff}
  .fb-forgot{background:var(--red)} .fb-hard{background:var(--orange)} .fb-easy{background:var(--green)}

  /* quiz */
  .q-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .q-bar{flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden}
  .q-bar>div{height:100%;background:var(--primary);transition:.3s}
  .opt{display:flex;align-items:center;gap:12px;padding:13px 15px;border:2px solid var(--border);border-radius:var(--radius-s);
       cursor:pointer;margin-bottom:10px;font-size:15px;transition:.12s;background:#fff}
  .opt:hover{border-color:var(--primary)}
  .opt.sel{border-color:var(--primary);background:var(--primary-light)}
  .opt.correct{border-color:var(--green);background:var(--green-light)}
  .opt.wrong{border-color:var(--red);background:var(--red-light)}
  .opt .lt{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
  .opt.sel .lt{background:var(--primary);color:#fff;border-color:var(--primary)}
  .opt.correct .lt{background:var(--green);color:#fff;border-color:var(--green)}
  .opt.wrong .lt{background:var(--red);color:#fff;border-color:var(--red)}
  .analysis{background:#fffbeb;border:1px solid #fde68a;border-radius:var(--radius-s);padding:14px;font-size:14px;line-height:1.7;margin-top:6px}
  .analysis .lb{font-weight:800;color:var(--orange);display:block;margin-bottom:4px}
  .q-result{font-weight:800;padding:12px 14px;border-radius:var(--radius-s);margin-bottom:10px}
  .q-result.ok{background:var(--green-light);color:var(--green-dark)}
  .q-result.no{background:var(--red-light);color:var(--red)}
  .q-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .q-actions .btn{flex:1;min-width:120px}
  .queue-seg{display:flex;gap:6px;background:#eef2f7;border-radius:10px;padding:4px;margin-bottom:14px}
  .queue-seg .q{flex:1;text-align:center;padding:8px;font-size:12px;font-weight:600;color:var(--text-3);border-radius:7px;cursor:pointer}
  .queue-seg .q.active{background:#fff;color:var(--primary);box-shadow:var(--shadow)}

  .empty{text-align:center;padding:50px 20px;color:var(--text-3)}
  .empty .em{font-size:46px;margin-bottom:10px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;
         padding:11px 20px;border-radius:24px;font-size:14px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hidden{display:none!important}
  .chiprow{display:flex;gap:6px;flex-wrap:wrap}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
  .badge-s{background:var(--green-light);color:var(--green-dark)}
  .badge-m{background:var(--orange-light);color:#b45309}
  .badge-j{background:#ede9fe;color:#7c3aed}
  .badge-w{background:var(--red-light);color:var(--red)}
  .bar-row{margin-bottom:10px}
  .bar-row .bl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .bar-row .bb{height:7px;background:var(--border);border-radius:4px;overflow:hidden}
  .bar-row .bb>div{height:100%;border-radius:4px}
  .flips{font-size:12px;color:var(--text-3);margin-top:8px;display:flex;align-items:center;gap:6px}
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:22px;max-height:86vh;overflow-y:auto}
  .modal-title{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px}
  .modal-actions{display:flex;gap:10px;margin-top:16px}
  .modal-actions .btn{flex:1;justify-content:center}
  .modal .pv-field{margin-bottom:12px}
  .modal .pv-field label{display:block;font-size:12px;color:var(--text-3);margin-bottom:4px;font-weight:600}
  .modal .pv-field textarea,.modal .pv-field select,.modal .pv-field input[type=text]{width:100%;box-sizing:border-box}
  .qe-opt{display:block;font-size:14px;margin:5px 0;cursor:pointer}
  .cfg-types{display:flex;flex-direction:column;gap:2px;margin-top:2px;padding-left:4px}
  .li-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
</style>
</head>
<body>
<div class="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand"><div class="logo">🧠</div>文档记忆卡</div>
    <div class="row" style="gap:8px">
      <button class="btn btn-ghost btn-sm" onclick="openSync()">☁ 同步</button>
      <div class="tabs">
        <div class="tab active" data-view="home" onclick="go('home')">首页</div>
        <div class="tab" data-view="stats" onclick="go('stats')">统计</div>
      </div>
    </div>
  </div>

  <div class="main">
    <!-- ============ HOME ============ -->
    <div class="view active" id="view-home">
      <div class="stat-grid" style="margin-bottom:14px">
        <div class="stat"><div class="n" id="hm-due">0</div><div class="l">📝 今日待复习卡片</div></div>
        <div class="stat"><div class="n g" id="hm-quiz">0</div><div class="l">✅ 今日已刷题</div></div>
      </div>
      <button class="btn btn-primary btn-block" style="padding:15px;font-size:16px" onclick="startToday()">🎯 开始今日复习</button>
      <div class="stat-grid" style="margin:14px 0">
        <div class="stat"><div class="n o" id="hm-mem-acc">0%</div><div class="l">记忆正确率</div></div>
        <div class="stat"><div class="n g" id="hm-quiz-acc">0%</div><div class="l">刷题正确率</div></div>
      </div>

      <div class="row between" style="margin:18px 2px 6px">
        <div class="section-title" style="margin:0">我的卡组</div>
        <div class="row" style="gap:8px">
          <button class="btn btn-ghost btn-sm" onclick="openImport()">📥 导入</button>
          <button class="btn btn-ghost btn-sm" onclick="newDeck()">＋ 新建</button>
        </div>
      </div>
      <div id="deck-list"></div>
      <div class="row" style="gap:8px;margin-top:4px">
        <button class="btn btn-ghost btn-sm" onclick="loadSample()">✨ 加载示例卡组（演示）</button>
      </div>
    </div>

    <!-- ============ STATS ============ -->
    <div class="view" id="view-stats">
      <div class="section-title">🧠 记忆背诵统计</div>
      <div class="stat-grid">
        <div class="stat"><div class="n" id="st-mem-total">0</div><div class="l">累计背诵卡片</div></div>
        <div class="stat"><div class="n o" id="st-mem-acc">0%</div><div class="l">记忆正确率</div></div>
        <div class="stat"><div class="n" id="st-streak">0</div><div class="l">连续打卡天数</div></div>
        <div class="stat"><div class="n" id="st-mastered">0</div><div class="l">掌握卡片数</div></div>
      </div>
      <div class="section-title" style="margin-top:20px">📝 刷题统计</div>
      <div class="stat-grid">
        <div class="stat"><div class="n g" id="st-quiz-total">0</div><div class="l">累计刷题数</div></div>
        <div class="stat"><div class="n g" id="st-quiz-acc">0%</div><div class="l">刷题正确率</div></div>
        <div class="stat"><div class="n r" id="st-wrong">0</div><div class="l">错题数量</div></div>
        <div class="stat"><div class="n" id="st-quiz-days">0</div><div class="l">刷题天数</div></div>
      </div>
      <div class="section-title" style="margin-top:20px">各题型正确率</div>
      <div class="card" id="st-types"></div>
    </div>

    <!-- ============ IMPORT ============ -->
    <div class="view" id="view-import"></div>

    <!-- ============ DECK DETAIL ============ -->
    <div class="view" id="view-detail"></div>

    <!-- ============ STUDY ============ -->
    <div class="view" id="view-study"></div>

    <!-- ============ QUIZ ============ -->
    <div class="view" id="view-quiz"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-mask" id="modal" onclick="if(event.target===this)hideModal()"><div class="modal" id="modal-body"></div></div>

<script>
/* =================== DATA LAYER =================== */
const LS_KEY='memoryCardDB_v1';
let DB=loadDB();
function loadDB(){
  try{const s=localStorage.getItem(LS_KEY);if(s){const d=JSON.parse(s);
    // ensure fields
    d.decks=d.decks||[];d.meta=d.meta||{streak:0,lastStudy:null,quizDays:{}};return d;} }catch(e){}
  return {decks:[],meta:{streak:0,lastStudy:null,quizDays:{}}};
}
function save(){DB.meta.savedAt=now();localStorage.setItem(LS_KEY,JSON.stringify(DB));scheduleSync();}
let _syncTimer=null;
function scheduleSync(){const c=syncCfg();if(!c||!c.auto)return;clearTimeout(_syncTimer);_syncTimer=setTimeout(()=>syncPush(true),800);}

/* ---- CLOUD SYNC (GitHub) ---- */
function syncCfg(){try{return JSON.parse(localStorage.getItem('syncCfg'))||null;}catch(e){return null;}}
function setSyncCfg(c){localStorage.setItem('syncCfg',JSON.stringify(c));}
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(s)));}
async function ghGet(owner,repo,path,token){
  const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json'}});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  return {sha:j.sha,text:b64d(j.content.replace(/\s/g,''))};
}
async function ghPut(owner,repo,path,token,text,sha){
  const body={message:'sync: memory-card-data',content:b64e(text)};
  if(sha)body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{method:'PUT',headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();return j.sha;
}
async function syncPush(silent){
  const c=syncCfg();if(!c)return;
  try{
    const remote=await ghGet(c.owner,c.repo,'memory-card-data.json',c.token).catch(()=>null);
    const sha=remote?remote.sha:null;
    await ghPut(c.owner,c.repo,'memory-card-data.json',c.token,JSON.stringify(DB),sha);
    syncStatus('✅ 已上传云端 '+new Date().toLocaleTimeString());
    if(!silent)toast('已上传到云端');
  }catch(e){ if(!silent)toast('上传失败：'+e.message); syncStatus('❌ 上传失败：'+e.message); }
}
async function syncPull(){
  const c=syncCfg();if(!c){toast('请先配置同步');return;}
  try{
    const remote=await ghGet(c.owner,c.repo,'memory-card-data.json',c.token);
    if(!remote){toast('云端还没有数据，先上传');syncStatus('云端暂无数据');return;}
    const data=JSON.parse(remote.text);
    const remoteT=data.meta&&data.meta.savedAt||0;
    const localT=DB.meta&&DB.meta.savedAt||0;
    if(remoteT>=localT){
      DB=data;localStorage.setItem(LS_KEY,remote.text);
      syncStatus('✅ 已从云端拉取 '+new Date().toLocaleTimeString());
      toast('已从云端同步');renderHome();
    }else{
      syncStatus('本地更新更新时间更新，跳过拉取（可点上传覆盖云端）');
    }
  }catch(e){ toast('拉取失败：'+e.message); syncStatus('❌ '+e.message); }
}
function openSync(){
  const c=syncCfg()||{owner:'2384714466-collab',repo:'memory-card-app',token:'',auto:false};
  document.getElementById('modal-body').innerHTML=`
    <h3 style="margin-bottom:10px">☁ 云同步（GitHub）</h3>
    <div class="muted" style="margin-bottom:12px">数据存到你仓库的 <code>memory-card-data.json</code>。每台设备首次填一次 Token，即可跨设备同步。Token 仅存本机浏览器。</div>
    <div class="pv-field"><label>GitHub 用户名</label><input type="text" id="sy-owner" value="${esc(c.owner)}"></div>
    <div class="pv-field"><label>仓库名</label><input type="text" id="sy-repo" value="${esc(c.repo)}"></div>

function exportData(){
  const data=JSON.stringify(DB,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  const d=new Date().toISOString().slice(0,10);
  a.href=URL.createObjectURL(blob);
  a.download='memory-card-backup-'+d+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('已导出备份文件');
}
function onImportFile(input){
  if(!input.files||!input.files[0])return;
  const f=input.files[0];
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data||!Array.isArray(data.decks))throw new Error('文件格式不正确（缺少 decks）');
      const overwrite=confirm('导入将【覆盖】当前全部数据。\n\n点「确定」=覆盖；点「取消」=合并（按卡组ID）');
      if(overwrite){
        DB=data;
      }else{
        DB.decks=DB.decks||[];
        data.decks.forEach(nd=>{
          const ex=DB.decks.find(d=>d.id===nd.id);
          if(ex)Object.assign(ex,nd); else DB.decks.push(nd);
        });
        if(data.meta&&(data.meta.savedAt||0)>(DB.meta.savedAt||0))DB.meta.savedAt=data.meta.savedAt;
      }
      save();renderHome();
      toast('导入成功（'+(overwrite?'覆盖':'合并')+'）');
    }catch(e){ alert('导入失败：'+e.message); }
    input.value='';
  };
  r.readAsText(f);
}

/* ---- HEURISTIC PARSERS ---- */
function parseQuiz(text){
  const blocks=splitQuizBlocks(text);
  const out=[];
  blocks.forEach(b=>{
    const q=parseOneQuestion(b);
    if(q)out.push(q);
  });
  return out;
}
// split into blocks: each starts with a question number or a new "题干" line
function splitQuizBlocks(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l);
  // join option lines that are on one line (A.x B.x ...)
  const blocks=[];let cur=[];let inOpts=false;
  for(let i=0;i<lines.length;i++){
    let l=lines[i];
    // new question starts with number OR a judge pattern and previous block already has options/answer
    if(/^\d+[\.、)）]/.test(l) && cur.length){blocks.push(cur);cur=[];inOpts=false;}
    if(/^(答案|正确答案|answer)[:：]/i.test(l)&&cur.length){cur.push(l);blocks.push(cur);cur=[];inOpts=false;continue;}
    cur.push(l);
    if(/^[A-D][\.、)）]/.test(l))inOpts=true;
  }
  if(cur.length)blocks.push(cur);
  // Merge: if a block only has question + answer (options on same line), handle
  return blocks;
}
function parseOneQuestion(block){
  if(block.length<2)return null;
  // find answer line
  let answerLine=block.find(l=>/^(答案|正确答案|answer)[:：]/i.test(l));
  let analysisLine=block.find(l=>/^(解析|答案解析|analysis|解析[:：])[:：]/.test(l));
  if(!answerLine && !/[A-D]/.test(block[0]))return null;
  // determine question text = first line(s) until option
  let qText='';let optLines=[];
  for(let i=0;i<block.length;i++){
    const l=block[i];
    if(/^[A-D][\.、)）]/.test(l)){optLines.push(l);}
    else if(/^(答案|正确答案|answer)[:：]/i.test(l))break;
    else if(/^(解析|答案解析|analysis)[:：]/i.test(l))break;
    else qText+=(qText?' ':'')+l;
  }
  if(!qText)return null;
  // parse options: could be one merged line "A.x B.y C.z D.w" or multiple lines
  let options=[];
  if(optLines.length===1){
    const parts=optLines[0].split(/(?=[A-D][\.、)）])/).filter(s=>/^[A-D][\.、)）]/.test(s));
    parts.forEach(p=>options.push(p.replace(/^[A-D][\.、)）]/,'').trim()));
  }else{
    optLines.forEach(p=>options.push(p.replace(/^[A-D][\.、)）]/,'').trim()));
  }
  // judge detection
  const judgeWords=['正确','错误','对','错','是','否','true','false','✓','✗','√','×'];
  let type='single';
  if(answerLine){
    const aRaw=answerLine.replace(/^(答案|正确答案|answer)[:：]/i,'').trim();
    const multi=/[A-D].*[A-D]/i.test(aRaw)||/[,，]/.test(aRaw);
    if(multi)type='multiple';
  }
  if(options.length===2 && options.every(o=>judgeWords.some(w=>o.includes(w)))){
    type='judge';
    // normalize options to 正确/错误
    options=['正确','错误'];
  }
  // answer normalize
  let answer='';
  if(answerLine){
    let a=answerLine.replace(/^(答案|正确答案|answer)[:：]/i,'').trim();
    if(type==='judge'){
      answer=/对|正确|是|true|✓|√/i.test(a)?'正确':'错误';
    }else if(type==='multiple'){
      answer=a.replace(/[^A-D]/gi,'').toUpperCase().split('').sort().join('');
    }else{
      answer=(a.match(/[A-D]/i)||['A'])[0].toUpperCase();
    }
  }
  let analysis='';
  if(analysisLine)analysis=analysisLine.replace(/^(解析|答案解析|analysis)[:：]/i,'').trim();
  return {id:uid(),type,question:qText,options,answer,analysis,inWrongBook:false,wrongCount:0,done:false};
}
function parseCards(text){
  // 卡片 AI 识别：自动判定以下三种格式之一（整篇按同一种格式解析）
  // ① # 标题模式：行以「# 」开头 → 正面；直到下一条 # 之前（含 ##/###/列表/文字）均为背面
  // ② 词条+列表模式：非 -、非 # 的独立单行 = 正面；往下全部「-」开头内容合并为背面
  // ③ 双行换行模式：无任何标记、连续两行非空文本 = 正面 / 背面
  const lines=text.split(/\r?\n/);
  // 兼容：含制表符按「Tab 分隔」解析（一行一条卡片，低冲突风险）
  if(lines.some(l=>l.includes('\t'))){
    const out=[];
    lines.map(l=>l.trim()).filter(l=>l).forEach(l=>{
      const p=l.split('\t');
      if(p.length>=2)out.push(mkCard(p[0].trim(),p.slice(1).join('\t').trim()));
    });
    return out;
  }
  const hasHeading=lines.some(l=>/^\s*#\s/.test(l));
  const hasTermList=(()=>{
    for(let i=0;i<lines.length-1;i++){
      if(lines[i].trim() && !/^\s*[-*#]\s/.test(lines[i]) && /^\s*[-*]\s/.test(lines[i+1]))return true;
    }
    return false;
  })();
  if(hasHeading)   return parseCardsHeading(lines);
  if(hasTermList)  return parseCardsTermList(lines);
  return parseCardsTwoLine(lines);
}
// 模式①：# 标题
function parseCardsHeading(lines){
  const out=[];let front=null;let back=[];
  const flush=()=>{
    if(front!==null){
      const f=front.trim();
      const b=back.join('\n').replace(/^\n+|\n+$/g,'').trim();
      if(f)out.push(mkCard(f,b));
    }
    front=null;back=[];
  };
  for(const raw of lines){
    if(/^\s*#\s/.test(raw)){flush();front=raw.replace(/^\s*#\s*/,'').trim();}
    else{if(front===null)continue;back.push(raw.replace(/^\s*#+\s?/,'').trim());} // 剔除 ##/###，保留空行换行
  }
  flush();
  return out;
}
// 模式②：词条 + 多条短横线
function parseCardsTermList(lines){
  const out=[];let i=0;
  while(i<lines.length){
    const raw=lines[i];
    if(!raw.trim()){i++;continue;}
    if(/^\s*[-*]\s/.test(raw)){
      // 孤立列表行：并入上一张卡片背面，避免丢失
      if(out.length){const p=out[out.length-1];p.back=(p.back?p.back+'\n':'')+raw.trim();}
      i++;continue;
    }
    // 非 -、非 # 的独立单行 = 正面；往下全部 - 开头内容合并为背面
    const front=raw.trim();
    const back=[];let k=i+1;
    while(k<lines.length && /^\s*[-*]\s/.test(lines[k])){back.push(lines[k].trim());k++;}
    out.push(mkCard(front,back.join('\n')));
    i=k;
  }
  return out;
}
// 模式③：双行换行
function parseCardsTwoLine(lines){
  const trimmed=lines.map(l=>l.trim()).filter(l=>l);
  const out=[];let i=0;
  while(i<trimmed.length){
    const front=trimmed[i];
    const back=(i+1<trimmed.length)?trimmed[i+1]:'';
    out.push(mkCard(front,back));
    i+=2;
  }
  return out;
}
function mkCard(front,back){return {id:uid(),front,back,box:1,nextReview:now(),lastReviewed:null,reviews:0,correct:0,hard:false,forgot:false};}

/* =================== STUDY (Ebbinghaus) =================== */
const INTERVALS=[0,1,2,4,7,15,30]; // days by box level (1..7)
let studyState={deckId:null,queue:[],idx:0,flipped:false,mode:'sequential'};
function dueCardQueue(deck){
  const due=(deck.cards||[]).filter(c=>(c.nextReview||0)<=now());
  // sort by nextReview asc
  due.sort((a,b)=>(a.nextReview||0)-(b.nextReview||0));
  return due;
}
function startStudy(id,mode){
  mode=mode||'sequential';
  const d=getDeck(id);if(!d.cards||!d.cards.length){toast('没有卡片可背');return;}
  const q=buildStudyQueue(d,mode);
  if(!q.length){toast(mode==='hard'?'还没有标记为「困难」的卡片':mode==='forgot'?'还没有标记为「忘记」的卡片':'今天没有待复习卡片 🎉');return;}
  studyState={deckId:id,queue:q,idx:0,flipped:false,mode};
  updateStreak();
  go('study');renderStudy();
}
function buildStudyQueue(d,mode){
  let cs;
  if(mode==='all'){cs=d.cards.slice();}            // 全部背诵：整副卡牌，不按到期筛选
  else if(mode==='hard'){cs=d.cards.filter(c=>c.hard);}
  else if(mode==='forgot'){cs=d.cards.filter(c=>c.forgot);}
  else{cs=dueCardQueue(d);}                         // 顺序/乱序：仅到期卡片（复习任务）
  if(mode==='random'||mode==='hard'||mode==='forgot'||mode==='all'){for(let i=cs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cs[i],cs[j]]=[cs[j],cs[i]];}}
  return cs;
}
function updateStreak(){
  const tk=todayKey();const m=DB.meta;
  if(m.lastStudy!==tk){m.streak=(m.lastStudy===new Date(Date.now()-86400000).toISOString().slice(0,10))?m.streak+1:1;m.lastStudy=tk;save();}
}
function renderStudy(){
  const v=document.getElementById('view-study');
  const isGlobal=!!studyState.global;
  const d=isGlobal?{id:'__all__',name:'今日复习 · 全部卡组'}:getDeck(cur.deckId=studyState.deckId);
  const q=studyState.queue;
  if(studyState.idx>=q.length){
    if(isGlobal && studyState.afterWrong && studyState.afterWrong.length){
      v.innerHTML=`<div class="empty" style="padding:80px 20px"><div class="em">🃏</div>
        <div style="font-size:18px;font-weight:800;margin-bottom:6px">卡片复习完成！</div>
        <div class="muted">接下来进入错题刷题（${studyState.afterWrong.length} 题）</div>
        <button class="btn btn-primary" style="margin-top:18px" onclick="startGlobalQuiz()">继续刷题 →</button></div>`;return;
    }
    v.innerHTML=`<div class="empty" style="padding:80px 20px"><div class="em">🎉</div>
      <div style="font-size:18px;font-weight:800;margin-bottom:6px">本轮复习完成！</div>
      <div class="muted">复习了 ${q.length} 张卡片</div>
      <button class="btn btn-primary" style="margin-top:18px" onclick="${isGlobal?'go(\'home\')':'openDeck(\''+d.id+'\')'}">${isGlobal?'返回首页':'返回卡组'}</button></div>`;return;
  }
  const card=q[studyState.idx];const total=q.length;
  const seg=isGlobal?'':`
    <div class="queue-seg" style="margin-bottom:12px">
      <div class="q ${studyState.mode==='all'?'active':''}" onclick="startStudy('${d.id}','all')">全部</div>
      <div class="q ${studyState.mode==='sequential'?'active':''}" onclick="startStudy('${d.id}','sequential')">顺序</div>
      <div class="q ${studyState.mode==='random'?'active':''}" onclick="startStudy('${d.id}','random')">乱序</div>
      <div class="q ${studyState.mode==='hard'?'active':''}" onclick="startStudy('${d.id}','hard')">困难</div>
      <div class="q ${studyState.mode==='forgot'?'active':''}" onclick="startStudy('${d.id}','forgot')">忘记</div>
    </div>`;
  v.innerHTML=`
    <div class="row between" style="margin-bottom:12px">
      <button class="btn btn-ghost btn-sm" onclick="${isGlobal?'go(\'home\')':'openDeck(\''+d.id+'\')'}">← 退出</button>
      <span class="muted">${studyState.idx+1} / ${total}</span>
    </div>
    ${seg}
    <div class="flashcard ${studyState.flipped?'flipped':''}" id="flash" onclick="flipCard()">
      <div class="face">${studyState.flipped?esc(back(card)):esc(face(card))}</div>
      <div class="hint">${studyState.flipped?'👆 点击翻回正面':'👆 点击查看背面'}</div>
    </div>
    ${studyState.flipped?`
    <div class="feedback">
      <button class="fb fb-forgot" onclick="grade(0)">🔴 忘记</button>
      <button class="fb fb-hard" onclick="grade(1)">🟡 困难</button>
      <button class="fb fb-easy" onclick="grade(2)">🟢 简单</button>
    </div>
    <div class="flips"><span>记忆档位：第 ${card.box||1} 级${card.hard?' · 🟡困难':''}${card.forgot?' · 🔴忘记':''}</span></div>`:''}`;
}
function flipCard(){studyState.flipped=!studyState.flipped;renderStudy();}
function grade(level){
  const d=getDeck(studyState.deckId);const card=studyState.queue[studyState.idx];
  card.reviews=(card.reviews||0)+1;
  if(level===2)card.correct=(card.correct||0)+1;
  let box=card.box||1;
  if(level===0){box=1;}
  else if(level===1){box=Math.max(1,box);}
  else{box=Math.min(7,box+1);}
  card.box=box;
  card.hard=(level===1);   // 🟡困难 → 标记困难
  card.forgot=(level===0); // 🔴忘记 → 标记忘记；🟢简单 → 两者清除
  const days=INTERVALS[box-1];
  card.nextReview=now()+days*86400000;
  card.lastReviewed=now();
  save();
  studyState.idx++;studyState.flipped=false;renderStudy();
}

/* =================== QUIZ =================== */
let quiz={deckId:null,queue:[],idx:0,mode:'sequential',range:'all',types:null,sel:[],submitted:false};
function startQuiz(id,cfg){
  cfg=cfg||{range:'all',types:null,order:'sequential'};
  const d=getDeck(id);if(!d.questions||!d.questions.length){toast('没有题目');return;}
  const qs=buildQuizQueue(d,cfg);
  if(!qs.length){toast(rangeEmptyMsg(cfg.range));return;}
  quiz={deckId:id,queue:qs,idx:0,mode:cfg.order,range:cfg.range,types:cfg.types,sel:[],submitted:false};
  go('quiz');renderQuiz();
}
function buildQuizQueue(d,cfg){
  let qs=d.questions.slice();
  if(cfg.range==='undone')qs=qs.filter(q=>!q.done);
  else if(cfg.range==='wrong')qs=qs.filter(q=>q.inWrongBook);
  if(cfg.types&&cfg.types.length)qs=qs.filter(q=>cfg.types.includes(q.type));
  if(cfg.order==='random'){for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}}
  return qs;
}
function rangeEmptyMsg(range){
  if(range==='undone')return '没有未做题目，去「全部题目」里刷吧';
  if(range==='wrong')return '本卡组还没有错题';
  return '没有题目';
}
/* ---- 刷题配置面板 ---- */
function openQuizConfig(id){
  const d=getDeck(id);if(!d.questions||!d.questions.length){toast('没有题目');return;}
  window.__qc={id,range:'all',types:null,order:'sequential'};
  renderQuizConfig();showModal();
}
function qcTypesArr(){const c=window.__qc;return c.types===null?['single','multiple','judge']:c.types;}
function renderQuizConfig(){
  const c=window.__qc;const d=getDeck(c.id);
  const total=d.questions.length;
  const undone=d.questions.filter(q=>!q.done).length;
  const wrong=d.questions.filter(q=>q.inWrongBook).length;
  const allChecked=qcTypesArr().length===3;
  const rangeChip=(val,label,n)=>`<div class="q ${c.range===val?'active':''}" onclick="qcSet('range','${val}')">${label} <span class="muted">${n}</span></div>`;
  const typeChip=(val,label)=>`<label class="qe-opt"><input type="checkbox" ${qcTypesArr().includes(val)?'checked':''} onchange="qcType('${val}',this.checked)"> ${label}</label>`;
  document.getElementById('modal-body').innerHTML=`
    <div class="modal-title">📝 刷题设置</div>
    <div class="pv-field"><label>范围</label>
      <div class="queue-seg">${rangeChip('all','全部题目',total)}${rangeChip('undone','未做题目',undone)}${rangeChip('wrong','错题专项',wrong)}</div></div>
    <div class="pv-field"><label>题型（可多选）</label>
      <label class="qe-opt"><input type="checkbox" ${allChecked?'checked':''} onchange="qcAll(this.checked)"> 全部</label>
      <div class="cfg-types">${typeChip('single','单选')}${typeChip('multiple','多选')}${typeChip('judge','判断')}</div></div>
    <div class="pv-field"><label>顺序</label>
      <div class="queue-seg">
        <div class="q ${c.order==='sequential'?'active':''}" onclick="qcSet('order','sequential')">顺序</div>
        <div class="q ${c.order==='random'?'active':''}" onclick="qcSet('order','random')">乱序</div>
      </div></div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="qcStart()">开始刷题</button>
      <button class="btn btn-ghost" onclick="hideModal()">取消</button>
    </div>`;
}
function qcSet(k,v){window.__qc[k]=v;renderQuizConfig();}
function qcAll(checked){window.__qc.types=checked?['single','multiple','judge']:[];renderQuizConfig();}
function qcType(t,checked){
  const c=window.__qc;
  let arr=c.types===null?[]:c.types.slice();
  if(checked){if(!arr.includes(t))arr.push(t);}else{arr=arr.filter(x=>x!==t);}
  c.types=arr;renderQuizConfig();
}
function qcStart(){
  const c=window.__qc;
  const types=c.types===null?null:c.types;
  if(types&&types.length===0){toast('请至少选择一种题型');return;}
  hideModal();startQuiz(c.id,{range:c.range,types,order:c.order});
}
function qcReorder(order){
  if(quiz.global){
    if(order==='random'){const a=quiz.queue.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}quiz.queue=a;}
    quiz.mode=order;quiz.idx=0;quiz.sel=[];quiz.submitted=false;renderQuiz();return;
  }
  const d=getDeck(quiz.deckId);
  const qs=buildQuizQueue(d,{range:quiz.range,types:quiz.types,order});
  quiz.queue=qs;quiz.idx=0;quiz.mode=order;quiz.sel=[];quiz.submitted=false;renderQuiz();
}
function renderQuiz(){
  const v=document.getElementById('view-quiz');
  const isGlobal=!!quiz.global;
  const d=isGlobal?{id:'__all__'}:getDeck(quiz.deckId);
  const qs=quiz.queue;
  if(!qs.length){v.innerHTML=`<div class="empty" style="padding:80px 20px"><div class="em">📭</div>
    <div class="muted">${quiz.range==='wrong'?'本卡组还没有错题':quiz.range==='undone'?'没有未做题目':'没有题目'}</div>
    <button class="btn btn-primary" style="margin-top:16px" onclick="${isGlobal?'go(\'home\')':'openDeck(\''+d.id+'\')'}">${isGlobal?'返回首页':'返回卡组'}</button></div>`;return;}
  if(quiz.idx>=qs.length){
    v.innerHTML=`<div class="empty" style="padding:80px 20px"><div class="em">✅</div>
      <div style="font-size:18px;font-weight:800;margin-bottom:6px">刷题完成！</div>
      <div class="muted">本轮共 ${qs.length} 题</div>
      <button class="btn btn-primary" style="margin-top:18px" onclick="${isGlobal?'go(\'home\')':'openDeck(\''+d.id+'\')'}">${isGlobal?'返回首页':'返回卡组'}</button></div>`;return;
  }
  const q=qs[quiz.idx];const total=qs.length;const pct=Math.round((quiz.idx)/total*100);
  const isMulti=q.type==='multiple';const isJudge=q.type==='judge';
  let optHtml;
  if(isJudge){
    optHtml=['正确','错误'].map((o,i)=>optRow(q,o,i)).join('');
  }else{
    optHtml=q.options.map((o,i)=>optRow(q,o,i)).join('');
  }
  const seg=isGlobal?'':`
    <div class="queue-seg">
      <div class="q ${quiz.mode==='sequential'?'active':''}" onclick="qcReorder('sequential')">顺序</div>
      <div class="q ${quiz.mode==='random'?'active':''}" onclick="qcReorder('random')">乱序</div>
    </div>`;
  v.innerHTML=`
    <div class="row between" style="margin-bottom:10px">
      <button class="btn btn-ghost btn-sm" onclick="${isGlobal?'go(\'home\')':'openDeck(\''+d.id+'\')'}">← 退出</button>
      <span class="badge ${TYPE_BADGE[q.type]}">${TYPE_LABEL[q.type]}</span>
    </div>
    <div class="q-top"><span class="muted" style="font-size:13px;font-weight:600">${quiz.idx+1}/${total}</span>
      <div class="q-bar"><div style="width:${pct}%"></div></div></div>
    ${seg}
    <div style="font-size:16px;font-weight:700;line-height:1.6;margin-bottom:14px">${esc(q.question)}</div>
    <div id="optWrap">${optHtml}</div>
    <div id="quizFeedbackArea"></div>
    ${!quiz.submitted?`<button class="btn btn-primary btn-block" style="margin-top:8px" onclick="submitAnswer()">提交答案</button>`:''}`;
}
function optRow(q,text,i){
  const letter=String.fromCharCode(65+i);
  const sel=quiz.sel.includes(letter)||quiz.sel.includes(text);
  let cls='opt';if(quiz.submitted)cls+=optState(q,text,letter);else if(sel&&!isVal(q,text)){} if(sel&&!quiz.submitted)cls+=' sel';
  const clickable=quiz.submitted?'':`onclick="toggleOpt('${q.id}','${isVal(q,text)?text:letter}',${i})"`;
  const shown=isVal(q,text)?text:letter+' . '+esc(text);
  return `<div class="${cls}" ${clickable}><span class="lt">${isVal(q,text)?(text==='正确'?'✔':'✖'):letter}</span><span>${esc(text)}</span></div>`;
}
function isVal(q,text){return q.type==='judge';}
function toggleOpt(qid,val,i){
  const q=quiz.queue[quiz.idx];
  if(q.type==='multiple'){
    if(quiz.sel.includes(val))quiz.sel=quiz.sel.filter(x=>x!==val);
    else quiz.sel.push(val);
  }else{
    if(quiz.sel.includes(val))quiz.sel=[]; // 再次点击取消选择
    else quiz.sel=[val];
  }
  renderQuiz();
}
function optState(q,text,letter){
  const correctSet=correctSetOf(q);
  const chosen=quiz.sel.includes(letter)||quiz.sel.includes(text);
  if(correctSet.has(letter)||correctSet.has(text))return' correct';
  if(chosen)return' wrong';
  return'';
}
function correctSetOf(q){
  if(q.type==='judge')return new Set([q.answer]);
  if(q.type==='multiple')return new Set(q.answer.split(''));
  return new Set([q.answer]);
}
function submitAnswer(){
  const q=quiz.queue[quiz.idx];const d=quiz.global?findDeckOfQuestion(q.id):getDeck(quiz.deckId);
  const correctSet=correctSetOf(q);
  const chosen=new Set(quiz.sel);
  let correct;
  if(q.type==='multiple'){correct=correctSet.size===chosen.size&&[...correctSet].every(x=>chosen.has(x));}
  else{correct=[...chosen].length===1&&correctSet.has([...chosen][0]);}
  quiz.submitted=true;
  // stats
  d.quiz.total=(d.quiz.total||0)+1;
  if(correct)d.quiz.correct=(d.quiz.correct||0)+1;
  const bt=d.quiz.byType||(d.quiz.byType={});
  bt[q.type]=bt[q.type]||{t:0,c:0};bt[q.type].t++; if(correct)bt[q.type].c++;
  // quiz days
  const tk=todayKey();DB.meta.quizDays[tk]=(DB.meta.quizDays[tk]||0)+1;
  // wrong book
  q.done=true;
  if(!correct){q.wrongCount=(q.wrongCount||0)+1;q.inWrongBook=true;}
  save();
  // render feedback
  renderQuiz();
  const area=document.getElementById('quizFeedbackArea');
  const correctStr=q.type==='judge'?q.answer:q.type==='multiple'?q.answer.split('').join('、'):q.answer;
  area.innerHTML=`
    <div class="q-result ${correct?'ok':'no'}">${correct?'✅ 回答正确！':'❌ 回答错误 · 正确答案：'+esc(correctStr)}</div>
    ${q.analysis?`<div class="analysis"><span class="lb">📖 解析</span>${esc(q.analysis)}</div>`:''}
    <div class="q-actions">
      <button class="btn btn-ghost" onclick="addToWrong('${q.id}')">❗ 加入错题本</button>
      <button class="btn btn-ghost" style="background:var(--primary-light);color:var(--primary-dark)" onclick="toCard('${q.id}')">🃏 转为记忆卡片</button>
      <button class="btn btn-primary" onclick="nextQ()">下一题 →</button>
    </div>`;
  // remove submit button area already hidden via quiz.submitted
  const sb=document.querySelector('#view-quiz .btn-primary.btn-block');
}
function addToWrong(qid){const d=findDeckOfQuestion(qid);const q=d&&d.questions.find(x=>x.id===qid);if(q){q.inWrongBook=true;save();toast('已加入错题本');}}
function toCard(qid){
  const d=findDeckOfQuestion(qid);const q=d&&d.questions.find(x=>x.id===qid);if(!q)return;
  const ans=q.type==='judge'?q.answer:q.type==='multiple'?q.answer.split('').join('、'):q.answer;
  const back=`答案：${ans}\n解析：${q.analysis||'（无）'}`;
  d.cards.push(mkCard(q.question,back));save();
  toast('已转为记忆卡片，进入艾宾浩斯复习');
}
function nextQ(){quiz.idx++;quiz.sel=[];quiz.submitted=false;renderQuiz();}

/* =================== STATS =================== */
function renderStats(){
  let memTotal=0,memCorrect=0,mastered=0;
  let quizTotal=0,quizCorrect=0;const typeAgg={single:{t:0,c:0},multiple:{t:0,c:0},judge:{t:0,c:0}};
  let wrongTotal=0,cardTotal=0,quizDaysCount=Object.keys(DB.meta.quizDays).length;
  DB.decks.forEach(d=>{
    (d.cards||[]).forEach(c=>{memTotal+=c.reviews||0;memCorrect+=c.correct||0;cardTotal++;if((c.box||1)>=5)mastered++;});
    const q=d.quiz||{};quizTotal+=q.total||0;quizCorrect+=q.correct||0;
    const bt=q.byType||{};Object.keys(typeAgg).forEach(t=>{typeAgg[t].t+=bt[t]?bt[t].t:0;typeAgg[t].c+=bt[t]?bt[t].c:0;});
    (d.questions||[]).forEach(qq=>{if(qq.inWrongBook)wrongTotal++;});
  });
  document.getElementById('st-mem-total').textContent=memTotal;
  document.getElementById('st-mem-acc').textContent=(memTotal?Math.round(memCorrect/memTotal*100):0)+'%';
  document.getElementById('st-streak').textContent=DB.meta.streak||0;
  document.getElementById('st-mastered').textContent=mastered;
  document.getElementById('st-quiz-total').textContent=quizTotal;
  document.getElementById('st-quiz-acc').textContent=(quizTotal?Math.round(quizCorrect/quizTotal*100):0)+'%';
  document.getElementById('st-wrong').textContent=wrongTotal;
  document.getElementById('st-quiz-days').textContent=quizDaysCount;
  const colors={single:'var(--green)',multiple:'var(--orange)',judge:'var(--primary)'};
  document.getElementById('st-types').innerHTML=Object.keys(typeAgg).map(t=>{
    const a=typeAgg[t];const acc=a.t?Math.round(a.c/a.t*100):0;
    return `<div class="bar-row"><div class="bl"><span>${TYPE_LABEL[t]}</span><span>${acc}% （${a.c}/${a.t}）</span></div>
      <div class="bb"><div style="width:${acc}%;background:${colors[t]}"></div></div></div>`;
  }).join('')||'<div class="muted">暂无刷题数据</div>';
}

(function(){

  if(c&&c.auto){ syncPull().finally(()=>renderHome()); } else { renderHome(); }
