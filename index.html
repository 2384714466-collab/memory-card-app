/* ---- HEURISTIC PARSERS ---- */
function parseQuiz(text){
  const blocks=splitQuizBlocks(text);
  const out=[];
  blocks.forEach(b=>{
    const q=parseOneQuestion(b);
    if(q)out.push(q);
  });
  return out;
}
// split into blocks: each starts with a question number or a new "题干" line
function splitQuizBlocks(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l);
  // join option lines that are on one line (A.x B.x ...)
  const blocks=[];let cur=[];let inOpts=false;
  for(let i=0;i<lines.length;i++){
    let l=lines[i];
    // new question starts with number OR a judge pattern and previous block already has options/answer
    if(/^\d+[\.、)）]/.test(l) && cur.length){blocks.push(cur);cur=[];inOpts=false;}
    if(/^(答案|正确答案|answer)[:：]/i.test(l)&&cur.length){cur.push(l);blocks.push(cur);cur=[];inOpts=false;continue;}
    cur.push(l);
    if(/^[A-D][\.、)）]/.test(l))inOpts=true;
  }
  if(cur.length)blocks.push(cur);
  // Merge: if a block only has question + answer (options on same line), handle
  return blocks;
}
function parseOneQuestion(block){
  if(block.length<2)return null;
  // find answer line
  let answerLine=block.find(l=>/^(答案|正确答案|answer)[:：]/i.test(l));
  let analysisLine=block.find(l=>/^(解析|答案解析|analysis|解析[:：])[:：]/.test(l));
  if(!answerLine && !/[A-D]/.test(block[0]))return null;
  // determine question text = first line(s) until option
  let qText='';let optLines=[];
  for(let i=0;i<block.length;i++){
    const l=block[i];
    if(/^[A-D][\.、)）]/.test(l)){optLines.push(l);}
    else if(/^(答案|正确答案|answer)[:：]/i.test(l))break;
    else if(/^(解析|答案解析|analysis)[:：]/i.test(l))break;
    else qText+=(qText?' ':'')+l;
  }
  if(!qText)return null;
  // parse options: could be one merged line "A.x B.y C.z D.w" or multiple lines
  let options=[];
  if(optLines.length===1){
    const parts=optLines[0].split(/(?=[A-D][\.、)）])/).filter(s=>/^[A-D][\.、)）]/.test(s));
    parts.forEach(p=>options.push(p.replace(/^[A-D][\.、)）]/,'').trim()));
  }else{
    optLines.forEach(p=>options.push(p.replace(/^[A-D][\.、)）]/,'').trim()));
  }
  // judge detection
  const judgeWords=['正确','错误','对','错','是','否','true','false','✓','✗','√','×'];
  let type='single';
  if(answerLine){
    const aRaw=answerLine.replace(/^(答案|正确答案|answer)[:：]/i,'').trim();
    const multi=/[A-D].*[A-D]/i.test(aRaw)||/[,，]/.test(aRaw);
    if(multi)type='multiple';
  }
  if(options.length===2 && options.every(o=>judgeWords.some(w=>o.includes(w)))){
    type='judge';
    // normalize options to 正确/错误
    options=['正确','错误'];
  }
  // answer normalize
  let answer='';
  if(answerLine){
    let a=answerLine.replace(/^(答案|正确答案|answer)[:：]/i,'').trim();
    if(type==='judge'){
      answer=/对|正确|是|true|✓|√/i.test(a)?'正确':'错误';
    }else if(type==='multiple'){
      answer=a.replace(/[^A-D]/gi,'').toUpperCase().split('').sort().join('');
    }else{
      answer=(a.match(/[A-D]/i)||['A'])[0].toUpperCase();
    }
  }
  let analysis='';
  if(analysisLine)analysis=analysisLine.replace(/^(解析|答案解析|analysis)[:：]/i,'').trim();
  return {id:uid(),type,question:qText,options,answer,analysis,inWrongBook:false,wrongCount:0,done:false,fav:false,
          guess:false,guessCount:0,guessRight:0};
}
function parseCards(text){
  // 卡片 AI 识别：自动判定以下三种格式之一（整篇按同一种格式解析）
  // ① # 标题模式：行以「# 」开头 → 正面；直到下一条 # 之前（含 ##/###/列表/文字）均为背面
  // ② 词条+列表模式：非 -、非 # 的独立单行 = 正面；往下全部「-」开头内容合并为背面
  // ③ 双行换行模式：无任何标记、连续两行非空文本 = 正面 / 背面
  const lines=text.split(/\r?\n/);
  // 兼容：含制表符按「Tab 分隔」解析（一行一条卡片，低冲突风险）
  if(lines.some(l=>l.includes('\t'))){
    const out=[];
    lines.map(l=>l.trim()).filter(l=>l).forEach(l=>{
      const p=l.split('\t');
      if(p.length>=2)out.push(mkCard(p[0].trim(),p.slice(1).join('\t').trim()));
    });
    return out;
  }
  const hasHeading=lines.some(l=>/^\s*#\s/.test(l));
  const hasTermList=(()=>{
    for(let i=0;i<lines.length-1;i++){
      if(lines[i].trim() && !/^\s*[-*#]\s/.test(lines[i]) && /^\s*[-*]\s/.test(lines[i+1]))return true;
    }
    return false;
  })();
  if(hasHeading)   return parseCardsHeading(lines);
  if(hasTermList)  return parseCardsTermList(lines);
  return parseCardsTwoLine(lines);
}
// 模式①：# 标题
function parseCardsHeading(lines){
  const out=[];let front=null;let back=[];
  const flush=()=>{
    if(front!==null){
      const f=front.trim();
      const b=back.join('\n').replace(/^\n+|\n+$/g,'').trim();
      if(f)out.push(mkCard(f,b));
    }
    front=null;back=[];
  };
  for(const raw of lines){
    if(/^\s*#\s/.test(raw)){flush();front=raw.replace(/^\s*#\s*/,'').trim();}
    else{if(front===null)continue;back.push(raw.replace(/^\s*#+\s?/,'').trim());} // 剔除 ##/###，保留空行换行
  }
  flush();
  return out;
}
// 模式②：词条 + 多条短横线
function parseCardsTermList(lines){
  const out=[];let i=0;
  while(i<lines.length){
    const raw=lines[i];
    if(!raw.trim()){i++;continue;}
    if(/^\s*[-*]\s/.test(raw)){
      // 孤立列表行：并入上一张卡片背面，避免丢失
      if(out.length){const p=out[out.length-1];p.back=(p.back?p.back+'\n':'')+raw.trim();}
      i++;continue;
    }
    // 非 -、非 # 的独立单行 = 正面；往下全部 - 开头内容合并为背面
    const front=raw.trim();
    const back=[];let k=i+1;
    while(k<lines.length && /^\s*[-*]\s/.test(lines[k])){back.push(lines[k].trim());k++;}
    out.push(mkCard(front,back.join('\n')));
    i=k;
  }
  return out;
}
// 模式③：双行换行
function parseCardsTwoLine(lines){
  const trimmed=lines.map(l=>l.trim()).filter(l=>l);
  const out=[];let i=0;
  while(i<trimmed.length){
    const front=trimmed[i];
    const back=(i+1<trimmed.length)?trimmed[i+1]:'';
    out.push(mkCard(front,back));
    i+=2;
  }
  return out;
}
function mkCard(front,back){return {id:uid(),front,back,box:1,nextReview:now(),lastReviewed:null,reviews:0,correct:0,easy:false,hard:false,forgot:false,fav:false,tags:[],links:[],note:'',ext:''};}

// 文件夹拖拽排序：桌面 HTML5 drag + 移动端长按拖动，↑↓ 按钮保留为兜底
const folderDnd={mode:null,dragFid:null,overFid:null,after:false,active:false,
  suppressClick:false,lpTimer:null,startX:0,startY:0,ghost:null};
function reorderFolder(fromId,toId,after){
  if(!fromId||!toId||fromId===toId)return;
  const from=DB.folders.findIndex(f=>f.id===fromId);if(from<0)return;
  const item=DB.folders.splice(from,1)[0];
  const to=DB.folders.findIndex(f=>f.id===toId);
  if(to<0)DB.folders.push(item);
  else DB.folders.splice(after?to+1:to,0,item);
  save();renderHome();
}
function clearDropInd(){document.querySelectorAll('.folder-sec.drop-before,.folder-sec.drop-after').forEach(s=>s.classList.remove('drop-before','drop-after'));}
function cleanupFolderDnd(){
  clearDropInd();
  const d=document.querySelector('.folder-sec.dragging');if(d)d.classList.remove('dragging');
  if(folderDnd.ghost){folderDnd.ghost.remove();folderDnd.ghost=null;}
  folderDnd.dragFid=null;folderDnd.overFid=null;folderDnd.active=false;folderDnd.mode=null;
}
function folderSecUnder(x,y){
  let el=document.elementFromPoint(x,y);
  while(el&&el!==document.body){ if(el.classList&&el.classList.contains('folder-sec'))return el; el=el.parentNode; }
  return null;
}
function folderIndicate(sec,after){ clearDropInd(); if(sec)sec.classList.add(after?'drop-after':'drop-before'); }
function wireFolderDnd(){
  const list=document.getElementById('deck-list');if(!list)return;
  // ---- 桌面 HTML5 拖拽 ----
  list.addEventListener('dragstart',e=>{
    const sec=e.target.closest&&e.target.closest('.folder-sec[data-fid]');if(!sec)return;
    folderDnd.mode='html5';folderDnd.dragFid=sec.dataset.fid;folderDnd.overFid=null;
    sec.classList.add('dragging');e.dataTransfer.effectAllowed='move';
    try{e.dataTransfer.setData('text/plain',sec.dataset.fid);}catch(_){}
  });
  list.addEventListener('dragover',e=>{
    if(folderDnd.mode!=='html5'||!folderDnd.dragFid)return;
    const sec=e.target.closest&&e.target.closest('.folder-sec[data-fid]');
    if(!sec||sec.dataset.fid===folderDnd.dragFid){folderIndicate(null);return;}
    e.preventDefault();
    const r=sec.getBoundingClientRect();
    folderDnd.overFid=sec.dataset.fid;folderDnd.after=(e.clientY-r.top)>r.height/2;
    folderIndicate(sec,folderDnd.after);
  });
  list.addEventListener('drop',e=>{
    if(folderDnd.mode!=='html5'||!folderDnd.dragFid||!folderDnd.overFid)return;
    e.preventDefault();
    const f=folderDnd.dragFid,t=folderDnd.overFid,a=folderDnd.after;
    folderDnd.suppressClick=true;cleanupFolderDnd();reorderFolder(f,t,a);
  });
  list.addEventListener('dragend',cleanupFolderDnd);
  // ---- 移动端长按拖动 ----
  list.addEventListener('touchstart',e=>{
    if(folderDnd.mode==='html5')return;
    const hd=e.target.closest&&e.target.closest('.folder-hd[data-fid]');if(!hd)return;
    const sec=hd.closest('.folder-sec');if(!sec||!sec.dataset.fid)return;
    folderDnd.mode='touch';folderDnd.dragFid=sec.dataset.fid;
    folderDnd.startX=e.touches[0].clientX;folderDnd.startY=e.touches[0].clientY;
    folderDnd.lpTimer=setTimeout(()=>startTouchDrag(e.touches[0]),420);
  },{passive:true});
  list.addEventListener('touchmove',e=>{
    if(folderDnd.mode!=='touch')return;
    if(!folderDnd.active){
      const dx=e.touches[0].clientX-folderDnd.startX,dy=e.touches[0].clientY-folderDnd.startY;
      if(Math.hypot(dx,dy)>10){clearTimeout(folderDnd.lpTimer);folderDnd.mode=null;}
      return;
    }
    e.preventDefault();moveTouchDrag(e.touches[0]);
  },{passive:false});
  function endTouch(){
    clearTimeout(folderDnd.lpTimer);
    if(folderDnd.active){const f=folderDnd.dragFid,t=folderDnd.overFid,a=folderDnd.after;
      if(t&&f){folderDnd.suppressClick=true;reorderFolder(f,t,a);} cleanupFolderDnd();}
    folderDnd.mode=null;
  }
  list.addEventListener('touchend',endTouch);
  list.addEventListener('touchcancel',()=>{clearTimeout(folderDnd.lpTimer);if(folderDnd.active)cleanupFolderDnd();folderDnd.mode=null;});
}
function startTouchDrag(t){
  folderDnd.active=true;
  const src=document.querySelector('.folder-sec[data-fid="'+folderDnd.dragFid+'"]');if(!src)return;
  src.classList.add('dragging');
  const g=src.cloneNode(true);g.classList.add('dnd-ghost');g.classList.remove('dragging');
  g.style.width=src.getBoundingClientRect().width+'px';
  document.body.appendChild(g);folderDnd.ghost=g;
  moveGhost(t.clientX,t.clientY);
  if(navigator.vibrate)try{navigator.vibrate(15);}catch(_){}
}
function moveTouchDrag(t){
  moveGhost(t.clientX,t.clientY);
  if(folderDnd.ghost)folderDnd.ghost.style.visibility='hidden';
  const sec=folderSecUnder(t.clientX,t.clientY);
  if(folderDnd.ghost)folderDnd.ghost.style.visibility='';
  folderDnd.overFid=null;folderIndicate(null);
  if(sec&&sec.dataset.fid&&sec.dataset.fid!==folderDnd.dragFid){
    folderDnd.overFid=sec.dataset.fid;
    const r=sec.getBoundingClientRect();folderDnd.after=(t.clientY-r.top)>r.height/2;
    folderIndicate(sec,folderDnd.after);
  }
}
function moveGhost(x,y){if(folderDnd.ghost){folderDnd.ghost.style.left=(x-24)+'px';folderDnd.ghost.style.top=(y-20)+'px';}}
function toggleFolder(id,e){
  if(folderDnd.suppressClick){folderDnd.suppressClick=false;return;}

function clearGuess(id,qid){
  const d=getDeck(id);const q=d&&d.questions.find(x=>x.id===qid);if(!q)return;
  q.guess=false;save();renderDetail();toast('已移出蒙题本');
}
/* 列表项（卡片 / 题目 / 错题 / 蒙题）操作收进统一「⋯ 更多」菜单 */
function openItemMenu(kind, deckId, itemId){
  const d=getDeck(deckId);
  const it = kind==='card' ? (d.cards||[]).find(c=>c.id===itemId) : (d.questions||[]).find(q=>q.id===itemId);
  if(!it)return;
  const acts=[];
  if(kind==='card'){
    acts.push({icon: it.fav?'⭐':'☆', label: it.fav?'取消收藏':'收藏', onclick:`toggleFav('card','${itemId}')`});
    acts.push({icon:'🏷', label:'标签', onclick:`openCardTags('${deckId}','${itemId}')`});
    acts.push({icon:'✏️', label:'编辑', onclick:`openEditCard('${deckId}','${itemId}')`});
    acts.push({icon:'🗑', label:'删除', danger:true, onclick:`delCard('${deckId}','${itemId}')`});
  }else{
    acts.push({icon: it.fav?'⭐':'☆', label: it.fav?'取消收藏':'收藏', onclick:`toggleFav('question','${itemId}')`});
    if(kind==='guess'){
      acts.push({icon:'🃏', label:'转为记忆卡', onclick:`toCard('${itemId}')`});
      acts.push({icon:'✅', label:'移出蒙题本', onclick:`clearGuess('${deckId}','${itemId}')`});
    }
    acts.push({icon:'✏️', label:'编辑', onclick:`openEditQuestion('${deckId}','${itemId}')`});
    acts.push({icon:'🗑', label:'删除', danger:true, onclick:`delQuestion('${deckId}','${itemId}')`});
  }
  openSheet(kind==='card'?'卡片操作':(kind==='guess'?'蒙题操作':'题目操作'), acts);
}
function toggleShowEmpty(){cur.showEmpty=!cur.showEmpty;renderDetailSub('cards');}
function clearEmptyCards(id){
  const d=getDeck(id);if(!d)return;const before=JSON.parse(JSON.stringify(d.cards));
  const n=d.cards.filter(isCardEmpty).length;
  if(!n)return;
  if(!confirm('清空该卡组 '+n+' 张空白卡（正反面全空）？'))return;
  d.cards=d.cards.filter(c=>!isCardEmpty(c));save();pushDeckUndo(id,'清空'+n+'张空白卡','cards',before);
  cur.showEmpty=false;renderDetail();toast('已清空 '+n+' 张空白卡');
}
function startGuessQuiz(id){
  const d=getDeck(id);const qs=(d.questions||[]).filter(q=>q.guess);
  if(!qs.length){toast('没有蒙题');return;}
  startQuiz(id,{range:'guess',types:null,order:'random'});
}
function guessAllToCards(id){
  const d=getDeck(id);const g=(d.questions||[]).filter(q=>q.guess);
  if(!g.length){toast('没有蒙题');return;}
  if(!confirm('把 '+g.length+' 道蒙题转成记忆卡片，加入艾宾浩斯复习？'))return;
  let n=0;g.forEach(q=>{if(qToCard(d,q))n++;});
  save();renderDetail();toast('已转出 '+n+' 张记忆卡片');
}
function face(c){if(studyState.global)return c.front;const d=getDeck(cur.deckId);return d&&d.flipped?c.back:c.front;}
function back(c){if(studyState.global)return c.back;const d=getDeck(cur.deckId);return d&&d.flipped?c.front:c.back;}
function flipAll(id){const d=getDeck(id);const before=JSON.parse(JSON.stringify(d.cards||[]));(d.cards||[]).forEach(c=>{const t=c.front;c.front=c.back;c.back=t;});d.flipped=false;save();pushDeckUndo(id,'整组互换正反','cards',before);renderDetail();toast('已整组互换正反面');}
function delCard(id,cid){const d=getDeck(id);if(!d)return;const before=JSON.parse(JSON.stringify(d.cards));d.cards=d.cards.filter(c=>c.id!==cid);save();pushDeckUndo(id,'删除卡片','cards',before);renderDetail();}
function delQuestion(id,qid){const d=getDeck(id);if(!d)return;const before=JSON.parse(JSON.stringify(d.questions));d.questions=d.questions.filter(q=>q.id!==qid);save();pushDeckUndo(id,'删除题目','questions',before);renderDetail();}
function delDeck(id){const idx=DB.decks.findIndex(d=>d.id===id);if(idx<0)return;if(!confirm('确定删除该卡组？'))return;const removed=JSON.parse(JSON.stringify(DB.decks[idx]));DB.decks.splice(idx,1);save();pushUndo('删除卡组',()=>{DB.decks.splice(Math.min(idx,DB.decks.length),0,JSON.parse(JSON.stringify(removed)));save();renderHome();});go('home');}
function resetDone(id){
  if(!confirm('重置该卡组所有题目的「已做」状态？重置后可重新刷一遍。'))return;
  const d=getDeck(id);const before=JSON.parse(JSON.stringify(d.questions||[]));(d.questions||[]).forEach(q=>q.done=false);save();pushDeckUndo(id,'重置已做','questions',before);renderDetail();toast('已重置已做状态');
}
function tagBadges(c){
  const ts=c.tags||[];

function batchTag(){

  window.__bt={op:'add',tags:[]};renderBatchTagModal();showModal();
}
function renderBatchTagModal(){
  const ops=[['add','添加标签'],['replace','替换为'],['remove','移除标签']];
  const opHtml=ops.map(([v,l])=>`<label class="qe-opt"><input type="radio" name="btop" ${window.__bt.op===v?'checked':''} onchange="btOp('${v}')"> ${l}</label>`).join('');
  const tagHtml=CARD_TAGS.map(t=>`<label class="qe-opt"><input type="checkbox" ${window.__bt.tags.includes(t.key)?'checked':''} onchange="btTag('${t.key}',this.checked)"> ${t.icon} ${t.label}</label>`).join('');
  document.getElementById('modal-body').innerHTML=`<div class="modal-title">🏷 批量修改标签</div>
    <p class="muted" style="margin:4px 0 10px">对选中的 ${sel.ids.size} 张卡片执行：</p>
    <div style="margin-bottom:10px">${opHtml}</div>
    <div style="margin-bottom:14px">${tagHtml}</div>
    <button class="btn btn-ghost btn-sm" type="button" onclick="openTagManager()" style="margin-bottom:12px">🏷 管理标签</button>
    <div class="row" style="gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="hideModal()">取消</button>
      <button class="btn btn-primary" onclick="btApply()">应用</button>
    </div>`;
}
function btOp(v){window.__bt.op=v;renderBatchTagModal();}
function btTag(k,checked){const t=window.__bt;if(checked){if(!t.tags.includes(k))t.tags.push(k);}else t.tags=t.tags.filter(x=>x!==k);renderBatchTagModal();}
function btApply(){
  const t=window.__bt;const d=getDeck(cur.deckId);if(!d){hideModal();return;}const before=JSON.parse(JSON.stringify(d.cards));
  selectedCards().forEach(c=>{
    if(t.op==='replace')c.tags=(t.tags||[]).slice();
    else if(t.op==='add')c.tags=Array.from(new Set((c.tags||[]).concat(t.tags||[])));
    else if(t.op==='remove')c.tags=(c.tags||[]).filter(x=>!(t.tags||[]).includes(x));
  });
  save();hideModal();pushDeckUndo(cur.deckId,'批量改标签','cards',before);renderDetailSub('cards');toast('已更新 '+sel.ids.size+' 张卡片标签');
}
function batchReset(){
  if(!sel.ids.size){toast('请先选择');return;}
  const d=getDeck(cur.deckId);if(!d)return;
  if(isQSub()){
    if(!confirm('重置选中 '+sel.ids.size+' 道题目的「已做」状态？（重新计入未做）'))return;
    const before=JSON.parse(JSON.stringify(d.questions));
    selectedQuestions().forEach(q=>{q.done=false;});
    save();pushDeckUndo(cur.deckId,'重置已做','questions',before);renderDetail();toast('已重置 '+sel.ids.size+' 道题目');
  }else{
    if(!confirm('重置选中 '+sel.ids.size+' 张卡片的复习进度？（遗忘曲线清零，立即待复习）'))return;
    const before=JSON.parse(JSON.stringify(d.cards));
    selectedCards().forEach(c=>{c.box=1;c.nextReview=now();c.lastReviewed=null;c.reviews=0;c.correct=0;c.easy=false;c.hard=false;c.forgot=false;});
    save();pushDeckUndo(cur.deckId,'重置进度','cards',before);renderDetail();toast('已重置 '+sel.ids.size+' 张卡片进度');
  }
}
function batchSwap(){
  if(!sel.ids.size){toast('请先选择卡片');return;}
  if(!confirm('互换选中 '+sel.ids.size+' 张卡片的正反面？'))return;
  const d=getDeck(cur.deckId);if(!d)return;const before=JSON.parse(JSON.stringify(d.cards));
  selectedCards().forEach(c=>{const t=c.front;c.front=c.back;c.back=t;});
  d.flipped=false;
  save();pushDeckUndo(cur.deckId,'互换正反','cards',before);renderDetail();toast('已互换 '+sel.ids.size+' 张卡片正反面');

function batchWrong(){

  const d=getDeck(cur.deckId);const before=JSON.parse(JSON.stringify(d.questions));
  qs.forEach(q=>{q.inWrongBook=!anyWrong;});
  save();pushDeckUndo(cur.deckId,'切换错题本','questions',before);renderDetail();toast(anyWrong?'已移出错题本 '+qs.length+' 道':'已加入错题本 '+qs.length+' 道');

function batchGuess(){

  const qs=selectedQuestions();if(!qs.length)return;
  const anyGuess=qs.some(q=>q.guess);
  const d=getDeck(cur.deckId);const before=JSON.parse(JSON.stringify(d.questions));
  qs.forEach(q=>{q.guess=!anyGuess;});
  save();pushDeckUndo(cur.deckId,'切换蒙题本','questions',before);renderDetail();toast(anyGuess?'已移出蒙题本 '+qs.length+' 道':'已标记为蒙题 '+qs.length+' 道');

function batchToCards(){
  if(!sel.ids.size){toast('请先选择题目');return;}
  const qs=selectedQuestions();if(!qs.length)return;
  const d=getDeck(cur.deckId);const beforeIds=new Set((d.cards||[]).map(c=>c.id));let n=0;
  qs.forEach(q=>{if(qToCard(d,q))n++;});
  save();
  const newIds=(d.cards||[]).filter(c=>!beforeIds.has(c.id)).map(c=>c.id);
  pushUndo('转出'+n+'张记忆卡',()=>{const dd=getDeck(cur.deckId);if(dd){dd.cards=dd.cards.filter(c=>!newIds.includes(c.id));save();renderDetail();}});

function batchDelete(){

function batchExport(){

  if(isQSub()){
    const qs=selectedQuestions().map(q=>({type:q.type,question:q.question,options:(q.options||[]).slice(),answer:q.answer,analysis:q.analysis||'',
      inWrongBook:!!q.inWrongBook,wrongCount:q.wrongCount||0,guess:!!q.guess,guessCount:q.guessCount||0,guessRight:q.guessRight||0}));
    window.__be={cards:qs,deckName:d.name,json:JSON.stringify({deck:d.name,kind:'questions',exportedAt:new Date().toISOString(),questions:qs},null,2),

  }else{
    const cards=selectedCards().map(c=>({front:c.front,back:c.back,tags:(c.tags||[]).slice(),box:c.box,nextReview:c.nextReview,links:(c.links||[]).slice(),note:c.note||'',ext:c.ext||''}));
    window.__be={cards,deckName:d.name,json:JSON.stringify({deck:d.name,exportedAt:new Date().toISOString(),cards},null,2),txt:cards.map(c=>stripHtml(c.front)+'\n'+stripHtml(c.back)).join('\n\n')};

function beDownload(){
  const blob=new Blob([window.__be.json],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='cards-'+(window.__be.deckName||'export')+'-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已导出 JSON');
}
function beCopy(){
  const t=window.__be.txt;
  if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('已复制纯文本')).catch(()=>fallbackCopy(t));}
  else fallbackCopy(t);

function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('已复制纯文本');}catch(e){toast('复制失败，请手动复制');}document.body.removeChild(ta);}

function qeRefresh(id,qid){
  const prev=document.getElementById('qe-answer');
  if(prev){
    if(document.getElementById('qe-answer-sel'))window.__qe_ans=document.getElementById('qe-answer-sel').value;
    else{const sel=Array.from(document.querySelectorAll('#qe-answer input[name="qe-ans"]:checked')).map(e=>e.value);window.__qe_ans=sel.sort().join('');}
  }
  const type=document.getElementById('qe-type').value;
  const optLines=document.getElementById('qe-options').value.split('\n').map(s=>s.trim()).filter(s=>s);
  const ans=window.__qe_ans||'';
  let html='';
  if(type==='judge'){
    html=`<select id="qe-answer-sel"><option value="正确" ${ans==='正确'?'selected':''}>正确</option><option value="错误" ${ans==='错误'?'selected':''}>错误</option></select>`;
  }else if(!optLines.length){
    html='<span class="muted">请先在上方填写选项</span>';
  }else if(type==='single'){
    html=optLines.map((o,i)=>{const L=String.fromCharCode(65+i);return `<label class="qe-opt"><input type="radio" name="qe-ans" value="${L}" ${ans===L?'checked':''}> ${L}. ${esc(o)}</label>`;}).join('');
  }else{
    html=optLines.map((o,i)=>{const L=String.fromCharCode(65+i);return `<label class="qe-opt"><input type="checkbox" name="qe-ans" value="${L}" ${(ans||'').includes(L)?'checked':''}> ${L}. ${esc(o)}</label>`;}).join('');
  }
  document.getElementById('qe-answer').innerHTML=html;
}
function saveQuestionEdit(id,qid){
  const d=getDeck(id);const q=d.questions.find(x=>x.id===qid);if(!q)return;
  const type=document.getElementById('qe-type').value;
  const question=document.getElementById('qe-question').value.trim();
  const optLines=document.getElementById('qe-options').value.split('\n').map(s=>s.trim()).filter(s=>s);
  const analysis=document.getElementById('qe-analysis').value.trim();
  let answer;
  if(type==='judge'){answer=document.getElementById('qe-answer-sel')?document.getElementById('qe-answer-sel').value:'正确';}
  else{
    const sel=Array.from(document.querySelectorAll('#qe-answer input[name="qe-ans"]:checked')).map(e=>e.value);
    answer=type==='multiple'?sel.sort().join(''):(sel[0]||'');
  }
  if(!question){toast('题干不能为空');return;}
  if(type!=='judge' && (!optLines.length||!answer)){toast('请填写选项并选择答案');return;}
  q.type=type;q.question=question;q.options=optLines;q.analysis=analysis;q.answer=answer;
  save();hideModal();renderDetailSub(cur.sub||'questions');renderDetail();toast('题目已更新');
}

// 背诵周期模板（按记忆档位 1..n 对应的间隔天数）
const CYCLES={
  standard:{name:'标准',   days:[0,1,2,4,7,15,30]},
  sprint:  {name:'期末冲刺', days:[1,2,3,5]},
  long:    {name:'考研长线', days:[1,3,7,15,30,60,90]}
};
const INTERVALS=CYCLES.standard.days; // 兼容旧引用
function cycleDays(deck){const k=(deck&&deck.cycle&&CYCLES[deck.cycle])?deck.cycle:'standard';return CYCLES[k].days;}
function cycleForCard(card){const d=DB.decks.find(d=>(d.cards||[]).some(c=>c.id===card.id));return cycleDays(d);}
let studyState={deckId:null,queue:[],idx:0,flipped:false,mode:'sequential',tags:null,display:'flip',reveal:0,selfAns:'',selfRes:null,noteOpen:false};
function dueCardQueue(deck){
  const due=(deck.cards||[]).filter(c=>(c.nextReview||0)<=now() && !isCardEmpty(c));
  // sort by nextReview asc
  due.sort((a,b)=>(a.nextReview||0)-(b.nextReview||0));
  return due;
}
function startStudy(id,cfg){
  cfg=cfg||{scope:'all',tags:null,order:'shuffle',display:'flip'};
  const d=getDeck(id);if(!d.cards||!d.cards.length){toast('没有卡片可背');return;}
  const q=buildStudyQueue(d,cfg);

    const total=(d.cards||[]).length, empties=(d.cards||[]).filter(isCardEmpty).length;
    if(empties&&empties===total){toast('已自动隐藏 '+empties+' 张空白卡，暂无可背卡片');return;}
    toast(studyEmptyMsg(cfg));return;
  }
  studyState={deckId:id,queue:q,idx:0,flipped:false,mode:cfg.scope||'all',scope:cfg.scope||'all',order:cfg.order||'shuffle',tags:cfg.tags,display:cfg.display||'flip',global:false,reveal:0,selfAns:'',selfRes:null,noteOpen:false};
  updateStreak();
  go('study');renderStudy();
}

function buildStudyQueue(d,cfg){
  const scope=cfg.scope||'all';
  let cs;
  if(scope==='all')cs=d.cards.slice();                                  // 全部
  else if(scope==='unstudied')cs=d.cards.filter(c=>(c.reviews||0)===0); // 未背（从未评分）
  else if(scope==='easy')cs=d.cards.filter(c=>c.easy);                  // 简单
  else if(scope==='hard')cs=d.cards.filter(c=>c.hard);                 // 困难
  else if(scope==='forgot')cs=d.cards.filter(c=>c.forgot);             // 忘记
  else cs=d.cards.slice();
  if(cfg.tags&&cfg.tags.length)cs=cs.filter(c=>(c.tags||[]).some(t=>cfg.tags.includes(t)));
  cs=cs.filter(c=>!isCardEmpty(c));                  // 自动隐藏空白卡，不占复习队列
  if(cfg.order==='shuffle'){for(let i=cs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cs[i],cs[j]]=[cs[j],cs[i]];}}
  return cs;
}
function updateStreak(){
  const tk=todayKey();const m=DB.meta;
  if(m.lastStudy!==tk){m.streak=(m.lastStudy===new Date(Date.now()-86400000).toISOString().slice(0,10))?m.streak+1:1;m.lastStudy=tk;save();}
}
/* 记录当日学习行为（card=背卡 / quiz=刷题），同时维护连续打卡与每日目标达成提示 */
function recordDaily(kind){
  const tk=todayKey();const m=DB.meta;
  m.cardDays=m.cardDays||{};m.quizDays=m.quizDays||{};
  const isCard=kind==='card';
  const prev=isCard?(m.cardDays[tk]||0):(m.quizDays[tk]||0);
  if(isCard)m.cardDays[tk]=prev+1;else m.quizDays[tk]=prev+1;
  // 消费配额缓冲：每完成 1 个，对应积压 -1（先补旧债，再冲基础目标）
  const b=m.backlog||{cards:0,quiz:0};
  const key=isCard?'cards':'quiz';
  if(b[key]>0)b[key]=Math.max(0,b[key]-1);
  const base=todayBase(kind),buf=todayBuffer(kind),tgt=base+buf;
  const yk=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(m.lastStudy!==tk){m.streak=(m.lastStudy===yk)?(m.streak||0)+1:1;m.lastStudy=tk;}
  save();
  // 基础目标达成提示
  if(base>0&&prev<base&&prev+1>=base){toast(isCard?'🎉 今日基础背卡目标达成！':'🎉 今日基础刷题目标达成！');}
  // 积压全部清空提示
  if(buf>0&&prev+1>=tgt&&b[key]===0){toast(isCard?'✅ 昨日积压已清空，节奏稳了！':'✅ 昨日积压已清空，节奏稳了！');}
}

/* 关键词归一化（去标点空白，转小写） */
function normKw(s){return (s==null?'':String(s)).toLowerCase().replace(/[\s，。、；：！？,.!?;:()（）""''「」《》<>—\-_/]+/g,'').trim();}
function fallbackKeywords(text){
  return (text||'').split(/[\s，。、；：！？,.!?;:\n（）()""''「」《》<>—\-_]+/).map(normKw).filter(s=>s.length>=2);
}
/* 从背面提取判分关键词：优先「黄色荧光」高亮，兜底按标点切分 */
function extractKeywords(html){
  let kws=[];
  const re=/<span[^>]*class\s*=\s*["'][^"']*(hl-key|hl-y)[^"']*["'][^>]*>([\s\S]*?)<\/span>/gi;
  let m;while((m=re.exec(html||''))){const t=normKw(stripHtml(m[2]));if(t)kws.push(t);}
  if(!kws.length)kws=fallbackKeywords(stripHtml(html));
  const seen=new Set(),out=[];
  kws.forEach(k=>{if(!seen.has(k)){seen.add(k);out.push(k);}});
  return out.slice(0,12);
}
function scoreSelf(ans,kws){
  const normAns=normKw(ans);
  const matched=kws.filter(k=>normAns.indexOf(k)>=0);
  const total=kws.length;
  const ratio=total?matched.length/total:1;
  const pass= total===0?true:(ratio>=0.6);
  return {matched:matched.slice(),total,ratio,pass,kws:kws.slice()};
}
function selfCheck(cardId){

  const ta=document.getElementById('selfAns');const ans=ta?ta.value:'';

function selfResultHtml(card,r){

  if(r.total===0)return `<div class="self-res"><div class="self-verdict">未从答案中提取到关键词，请自行对照完整答案</div>
    <div class="self-full"><b>完整答案：</b>${fmtAnswer(back(card))}</div></div>`;
  const matchedSet=new Set(r.matched);

  return `<div class="self-res ${r.pass?'pass':'fail'}">

    <div class="kw-list">${chips}</div>

  </div>`;
}
function grade(level){
  const d=getDeck(studyState.deckId);const card=studyState.queue[studyState.idx];
  const wasWeak=!!card.forgot||!!card.hard||(card.reviews||0)>0; // 曾经记不熟 = 再错即「反复出错」
  card.reviews=(card.reviews||0)+1;
  recordDaily('card');
  if(level===2)card.correct=(card.correct||0)+1;
  let box=card.box||1;
  if(level===0){box=1;}
  else if(level===1){box=Math.max(1,box);}
  else{box=Math.min(7,box+1);}
  card.box=box;
  card.hard=(level===1);   // 🟡困难 → 标记困难
  card.forgot=(level===0); // 🔴忘记 → 标记忘记
  card.easy=(level===2);   // 🟢简单 → 标记简单（三态互斥）
  if(level===0&&wasWeak)pinSprint(card.id,'card');   // 反复出错：自动钉入考前冲刺清单（复习次数自动增加）
  else if(level>=1)unpinSprint(card.id,'card');        // 记住了：自动移出冲刺清单
  const cd=cycleForCard(card);const days=cd[Math.min(box-1,cd.length-1)];
  card.nextReview=now()+days*86400000;
  card.lastReviewed=now();

  studyState.idx++;studyState.flipped=false;studyState.reveal=0;studyState.selfAns='';studyState.selfRes=null;renderStudy();
}

function buildQuizQueue(d,cfg){

  if(cfg.order==='random'){for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}}

/* ---- 选项乱序：每道题在当次刷题里生成一份固定的展示顺序，按原始下标判分 ---- */
function defaultShuffle(){return DB.meta.shuffleOptions!==false;}
/* 返回当前题目选项的展示顺序（原始下标数组）；同一次刷题内同一题固定，避免每次重选就变 */
function dispOrder(q){
  quiz.orders=quiz.orders||{};
  if(quiz.orders[q.id])return quiz.orders[q.id];
  let arr;
  if(q.type==='judge'){arr=[0,1];}
  else{
    const n=(q.options||[]).length;
    arr=[...Array(n).keys()];
    if(quiz.shuffle){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}}
  }
  quiz.orders[q.id]=arr;
  return arr;
}
/* 正确答案对应的「原始选项下标」集合（单选/多选），判分以此为基准，与展示顺序无关 */
function correctOrigSet(q){
  if(q.type==='multiple')return new Set(q.answer.split('').map(c=>c.charCodeAt(0)-65));
  return new Set([q.answer.charCodeAt(0)-65]);
}
/* 正确答案在当前展示顺序下显示成的字母（如 A、B、A、C），用于解析提示 */
function dispLetterOfAnswer(q){
  const order=dispOrder(q);
  const idxs=q.answer.split('').map(c=>c.charCodeAt(0)-65);
  return idxs.map(oi=>String.fromCharCode(65+order.indexOf(oi))).join('、');
}
function renderOptions(q){
  if(q.type==='judge')return ['正确','错误'].map((o,i)=>optRow(q,o,i,true,-1)).join('');
  const order=dispOrder(q);
  return order.map((oi,i)=>optRow(q,q.options[oi],i,false,oi)).join('');
}
function optRow(q,text,dispIdx,isJudge,origIdx){
  const letter=String.fromCharCode(65+dispIdx);
  const isCorrect=isJudge?(text===q.answer):correctOrigSet(q).has(origIdx);
  const sel=isJudge?quiz.sel.includes(text):quiz.sel.includes(origIdx);
  let cls='opt';
  if(quiz.submitted){if(isCorrect)cls+=' correct';else if(sel)cls+=' wrong';}
  else if(sel)cls+=' sel';
  const badge=isJudge?(text==='正确'?'✔':'✖'):letter;
  const clickable=quiz.submitted?'':`onclick="toggleOpt('${q.id}',${isJudge?`'${text}'`:origIdx},${isJudge})"`;
  const shown=isJudge?text:(letter+' . '+esc(text));
  return `<div class="${cls}" ${clickable}><span class="lt">${badge}</span><span>${md(text)}</span></div>`;
}
function toggleOpt(qid,val,isJudge){
  const q=quiz.queue[quiz.idx];
  if(isJudge){
    if(quiz.sel.includes(val))quiz.sel=quiz.sel.filter(x=>x!==val);
    else quiz.sel=[val];
  }else if(q.type==='multiple'){
    if(quiz.sel.includes(val))quiz.sel=quiz.sel.filter(x=>x!==val);
    else quiz.sel.push(val);
  }else{
    if(quiz.sel.includes(val))quiz.sel=[]; // 再次点击取消选择
    else quiz.sel=[val];
  }
  renderQuiz();
}
function submitAnswer(){
  const q=quiz.queue[quiz.idx];const d=quiz.global?findDeckOfQuestion(q.id):getDeck(quiz.deckId);
  const cs=correctOrigSet(q);
  let correct;
  if(q.type==='multiple'){correct=cs.size===quiz.sel.length&&quiz.sel.every(x=>cs.has(x));}
  else if(q.type==='single'){correct=quiz.sel.length===1&&cs.has(quiz.sel[0]);}
  else{correct=quiz.sel.length===1&&quiz.sel[0]===q.answer;}
  quiz.submitted=true;
  const guessed=!!quiz.guess;
  // stats
  d.quiz.total=(d.quiz.total||0)+1;
  if(correct)d.quiz.correct=(d.quiz.correct||0)+1;
  const bt=d.quiz.byType||(d.quiz.byType={});
  bt[q.type]=bt[q.type]||{t:0,c:0};bt[q.type].t++; if(correct)bt[q.type].c++;
  // quiz days
  recordDaily('quiz');
  // wrong book
  q.done=true;
  const wasWrongBefore=(q.wrongCount||0)>=1;   // 之前已错过 = 本次再错即「反复出错」
  if(!correct){
    q.wrongCount=(q.wrongCount||0)+1;q.inWrongBook=true;
    if(wasWrongBefore)pinSprint(q.id,'q');      // 反复出错：自动钉入考前冲刺清单（复习次数自动增加）
  }else{
    unpinSprint(q.id,'q');                        // 答对：掌握后自动移出冲刺清单
  }
  // 🎲 蒙题：蒙对 = 隐形盲区，收进蒙题本 + 错题本
  let lucky=false;
  if(guessed){
    q.guessCount=(q.guessCount||0)+1;
    q.guess=true;
    d.quiz.guessTotal=(d.quiz.guessTotal||0)+1;
    quiz.rGuess=(quiz.rGuess||0)+1;
    if(correct){
      q.guessRight=(q.guessRight||0)+1;
      d.quiz.guessRight=(d.quiz.guessRight||0)+1;
      quiz.rLucky=(quiz.rLucky||0)+1;
      q.inWrongBook=true;
      lucky=true;
    }
  }else if(correct&&q.guess){
    q.guess=false;   // 没蒙且答对 = 真会了，自动移出蒙题本
  }
  save();
  // render feedback
  renderQuiz();
  const area=document.getElementById('quizFeedbackArea');
  const correctStr=q.type==='judge'?q.answer:dispLetterOfAnswer(q);
  const head=lucky
    ? `<div class="q-result lucky">🎲 蒙对了 —— 这不算掌握<div class="lk-sub">已收进「蒙题本 + 错题本」，第 ${q.guessRight} 次蒙对本题</div></div>`
    : `<div class="q-result ${correct?'ok':'no'}">${correct?'✅ 回答正确！':'❌ 回答错误 · 正确答案：'+esc(correctStr)}</div>`;
  const luckyAns=lucky?`<div class="muted" style="margin:-4px 0 8px">正确答案：<b>${esc(correctStr)}</b></div>`:'';
  const undoBtn=guessed?`<button class="btn btn-ghost" onclick="unguess('${q.id}')">🙋 其实我会（撤销蒙标）</button>`:'';
  area.innerHTML=`
    ${head}${luckyAns}
    ${q.analysis?`<div class="analysis"><span class="lb">📖 解析</span><div class="selectable" data-store data-store-kind="question" data-store-id="${q.id}" data-store-field="analysis">${toRich(q.analysis)}</div></div>`:''}
    <div class="q-actions">
      ${undoBtn}
      <button class="btn btn-ghost" onclick="addToWrong('${q.id}')">❗ 加入错题本</button>
      <button class="btn btn-ghost" style="background:var(--primary-light);color:var(--primary-dark)" onclick="toCard('${q.id}')">🃏 转为记忆卡片</button>
      <button class="btn btn-primary" onclick="nextQ()">下一题 →</button>
    </div>`;
  // remove submit button area already hidden via quiz.submitted
  const sb=document.querySelector('#view-quiz .btn-primary.btn-block');
}
function unguess(qid){
  const d=findDeckOfQuestion(qid);const q=d&&d.questions.find(x=>x.id===qid);if(!q)return;
  q.guess=false;
  if(q.guessCount)q.guessCount--;
  if(q.guessRight){q.guessRight--;if(d.quiz.guessRight)d.quiz.guessRight--;}
  if(d.quiz.guessTotal)d.quiz.guessTotal--;
  save();toast('已撤销蒙题标记');
}
function addToWrong(qid){const d=findDeckOfQuestion(qid);const q=d&&d.questions.find(x=>x.id===qid);if(q){q.inWrongBook=true;save();toast('已加入错题本');}}
/* 题目 -> 记忆卡；已转过的不重复转，返回是否新增 */
function qToCard(d,q){
  const ans=q.type==='judge'?q.answer:q.type==='multiple'?q.answer.split('').join('、'):q.answer;
  const back=`答案：${ans}\n解析：${q.analysis||'（无）'}`;
  d.cards=d.cards||[];
  if(d.cards.some(c=>stripHtml(c.front)===stripHtml(q.question)))return false;
  d.cards.push(mkCard(q.question,back));return true;
}
function toCard(qid){
  const d=findDeckOfQuestion(qid);const q=d&&d.questions.find(x=>x.id===qid);if(!q)return;
  if(!qToCard(d,q)){toast('该题已转过记忆卡片');return;}
  save();
  // 在卡组详情页内转卡时同步刷新计数（刷题页不刷新）
  const dv=document.getElementById('view-detail');
  if(cur.deckId===d.id&&dv&&dv.classList&&dv.classList.contains('active'))renderDetail();
  toast('已转为记忆卡片，进入艾宾浩斯复习');
}
function nextQ(){quiz.idx++;quiz.sel=[];quiz.submitted=false;quiz.guess=false;renderQuiz();}
function quizPrev(){if(quiz.idx>0){quiz.idx--;quiz.sel=[];quiz.submitted=false;quiz.guess=false;renderQuiz();}}
function toggleGuess(){if(quiz.submitted)return;quiz.guess=!quiz.guess;renderQuiz();}

/* =================== PLAN（规划看板：倒计时 / 目标 / 日历） =================== */
let planCursor=new Date();      // 日历当前显示的月份（按 UTC 与今日基准一致）
let planSelDate=null;           // 日历中选中的日期
function ymd(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function daysUntil(s){          // s:'YYYY-MM-DD'，与 todayKey() 同用 UTC 基准
  if(!s)return NaN;
  const [y,m,d]=s.split('-').map(Number);
  const target=Date.UTC(y,m-1,d);
  const n=new Date();const todayUtc=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate());
  return Math.round((target-todayUtc)/86400000);
}
/* —— 多备考计划：每日目标 = 所有计划 cards / quiz 之和 —— */
function planSum(kind){let s=0;(DB.meta.plans||[]).forEach(p=>{s+=((p&&p[kind])||0);});return s;} // kind:'cards'|'quiz'
function todayBase(kind){return planSum(kind);}
function todayBuffer(kind){const b=DB.meta.backlog||{cards:0,quiz:0};return Math.max(0,b[kind]||0);}
function todayTarget(kind){return todayBase(kind)+todayBuffer(kind);}
function yesterdayKey(){const d=new Date();d.setUTCDate(d.getUTCDate()-1);return ymd(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());}
/* 配额缓冲结算：把「有学习记录但未达标」的历史日短欠分摊进 backlog（空白日不计债务，避免崩盘）。
   封顶：积压不超过基础目标的 3 倍（至少 30），防止任务无限堆积。 */
function settleBuffer(){
  const m=DB.meta;m.backlog=m.backlog||{cards:0,quiz:0};
  const baseC=todayBase('cards'),baseQ=todayBase('quiz');
  const capC=Math.max(30,baseC*3),capQ=Math.max(30,baseQ*3);
  const today=new Date();const tk=ymd(today.getUTCFullYear(),today.getUTCMonth(),today.getUTCDate());
  let cursor=new Date(today);cursor.setUTCDate(cursor.getUTCDate()-7);      // 最多回看 7 天
  if(m.lastSettle){cursor=new Date(m.lastSettle+'T00:00:00Z');cursor.setUTCDate(cursor.getUTCDate()+1);}
  let changed=false;
  while(true){
    const ck=ymd(cursor.getUTCFullYear(),cursor.getUTCMonth(),cursor.getUTCDate());
    if(ck>=tk)break;
    const c=m.cardDays[ck]||0,qz=m.quizDays[ck]||0;
    if(c+qz>0){                                                       // 仅结算「有学习记录」的日子
      m.backlog.cards=Math.min(capC,m.backlog.cards+Math.max(0,baseC-c));
      m.backlog.quiz =Math.min(capQ,m.backlog.quiz +Math.max(0,baseQ-qz));
      changed=true;
    }
    cursor.setUTCDate(cursor.getUTCDate()+1);
  }
  m.lastSettle=yesterdayKey();                                        // 已结算到昨天（今天不参与）
  m.backlog.cards=Math.max(0,Math.round(m.backlog.cards));m.backlog.quiz=Math.max(0,Math.round(m.backlog.quiz));
  if(baseC===0&&m.backlog.cards){m.backlog.cards=0;changed=true;}     // 目标未设置 → 清掉历史积压，不再催
  if(baseQ===0&&m.backlog.quiz){m.backlog.quiz=0;changed=true;}
  if(changed)save();
}
/* 计划的每日目标文案：两项都没填就显示「仅倒计时」 */
function planGoalLabel(p){
  const a=p&&p.cards?`背${p.cards}`:'', b=p&&p.quiz?`刷${p.quiz}`:'';
  if(!a&&!b)return '未设每日目标';
  return '每日 '+[a,b].filter(Boolean).join('/');
}
/* 计划按日期升序（无日期排最后） */
function planListSorted(){return (DB.meta.plans||[]).slice().sort((a,b)=>{
  if(!a.date&&!b.date)return 0;if(!a.date)return 1;if(!b.date)return -1;return a.date<b.date?-1:1;});}
/* 当前连续打卡覆盖到的日期集合（从最近活跃日向前连续） */
function streakDates(){
  const set=new Set();let key=DB.meta.lastStudy;
  while(key){
    const c=DB.meta.cardDays[key]||0, qz=DB.meta.quizDays[key]||0;
    if(c+qz===0)break;
    set.add(key);
    const d=new Date(key+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-1);
    key=ymd(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
  }
  return set;
}
/* 今日目标进度条（首页与规划页共用，含配额缓冲结转） */
function goalBarsHtml(){
  const tk=todayKey();
  const c=DB.meta.cardDays[tk]||0, qz=DB.meta.quizDays[tk]||0;
  const baseC=todayBase('cards'),baseQ=todayBase('quiz');
  const bufC=baseC?todayBuffer('cards'):0, bufQ=baseQ?todayBuffer('quiz'):0;   // 未设目标的那项不结转
  const tgtC=baseC+bufC, tgtQ=baseQ+bufQ;
  const hasPlan=(DB.meta.plans||[]).length>0;
  if(tgtC===0&&tgtQ===0)return hasPlan
    ? `<div class="gr-empty">当前计划只做考试倒计时，没设每日目标 🎯 这样也完全可以；想看进度条，就在「规划」页编辑计划补上每日背卡 / 刷题数量。<br><span class="muted sm">今日已背 ${c} 张 · 已刷 ${qz} 题（不设目标也照常记录）</span></div>`
    : `<div class="gr-empty">还没有设定备考计划 📝 去「规划」页添加考研 / 期末等目标，这里会显示每日进度。</div>`;
  const pc=c===0?0:Math.min(100,Math.round(c/Math.max(1,tgtC)*100));
  const pq=qz===0?0:Math.min(100,Math.round(qz/Math.max(1,tgtQ)*100));
  const cSub=c>=baseC?`<div class="gr-sub ok">🎉 基础背卡目标已达成（${c}/${baseC}）${bufC?` · 积压剩 ${Math.max(0,bufC-(c-baseC))}`:''}</div>`:`<div class="gr-sub">还差 ${Math.max(0,baseC-c)} 张卡达成基础目标</div>`;
  const qSub=qz>=baseQ?`<div class="gr-sub ok">🎉 基础刷题目标已达成（${qz}/${baseQ}）${bufQ?` · 积压剩 ${Math.max(0,bufQ-(qz-baseQ))}`:''}</div>`:`<div class="gr-sub">还差 ${Math.max(0,baseQ-qz)} 题达成基础目标</div>`;
  const bufHint=(bufC||bufQ)?`<div class="gr-buf">📦 含未完成结转：${bufC?`背卡 +${bufC}`:''}${(bufC&&bufQ)?' · ':''}${bufQ?`刷题 +${bufQ}`:''}（已自动分摊到今天，多学即还债）</div>`:'';
  const rowC=tgtC>0
    ? `<div class="goal-row"><div class="gr-h"><span>🃏 每日背卡</span><b>${c}/${tgtC}</b>${bufC?`<i class="gr-tag">含结转 ${bufC}</i>`:''}</div>
      <div class="q-bar"><div style="width:${pc}%"></div></div>${cSub}</div>`
    : `<div class="goal-row gr-off"><div class="gr-h"><span>🃏 每日背卡</span><b>未设目标</b></div><div class="gr-sub">今日已背 ${c} 张 · 不设目标就只记录、不催进度</div></div>`;
  const rowQ=tgtQ>0
    ? `<div class="goal-row"><div class="gr-h"><span>📝 每日刷题</span><b>${qz}/${tgtQ}</b>${bufQ?`<i class="gr-tag">含结转 ${bufQ}</i>`:''}</div>
      <div class="q-bar"><div style="width:${pq}%"></div></div>${qSub}</div>`
    : `<div class="goal-row gr-off"><div class="gr-h"><span>📝 每日刷题</span><b>未设目标</b></div><div class="gr-sub">今日已刷 ${qz} 题 · 不设目标就只记录、不催进度</div></div>`;
  return bufHint+rowC+rowQ;
}

/* 学习日历 */
function calendarHtml(){
  const y=planCursor.getUTCFullYear(),m=planCursor.getUTCMonth();
  const mNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const dows=['一','二','三','四','五','六','日'];
  const first=new Date(Date.UTC(y,m,1));
  const firstDow=(first.getUTCDay()+6)%7;
  const base=new Date(Date.UTC(y,m,1));base.setUTCDate(1-firstDow);
  const streak=streakDates();const tk=todayKey();
  let cells='',sumC=0,sumQ=0,active=0;
  for(let i=0;i<42;i++){
    const dt=new Date(base);dt.setUTCDate(base.getUTCDate()+i);
    const key=ymd(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate());
    const inMonth=dt.getUTCMonth()===m;
    const c=DB.meta.cardDays[key]||0,qz=DB.meta.quizDays[key]||0,total=c+qz;
    if(inMonth){sumC+=c;sumQ+=qz;if(total)active++;}
    let lv=0;if(total>0)lv=total<=2?1:total<=5?2:total<=10?3:4;
    const isToday=key===tk,isStreak=streak.has(key),isSel=planSelDate===key;
    const cls='cal-cell'+(inMonth?'':' out')+(isToday?' today':'')+(isStreak?' streak':'')+(lv?' lv'+lv:'')+(isSel?' sel':'');
    const cnt=total?`<span class="cal-cnt">${total}</span>`:'';
    cells+=`<div class="${cls}" title="${dt.getUTCMonth()+1}月${dt.getUTCDate()}日 · 背卡${c}/刷题${qz}" ${inMonth?`onclick="planSelectDate('${key}')"`:''}>${dt.getUTCDate()}${cnt}</div>`;
  }
  const detail=planSelDate?planDetailHtml(planSelDate):'';
  const legend=`<div class="cal-legend"><span>少</span><span class="sw" style="background:#dcfce7"></span><span class="sw" style="background:#86efac"></span><span class="sw" style="background:#4ade80"></span><span class="sw" style="background:#16a34a"></span><span>多</span><span style="margin-left:8px">🟠 连续打卡</span></div>`;
  const sum=`<div class="cal-sum"><div class="s"><div class="n">${sumC}</div><div class="l">本月背卡</div></div>
    <div class="s"><div class="n">${sumQ}</div><div class="l">本月刷题</div></div>
    <div class="s"><div class="n">${active}</div><div class="l">活跃天数</div></div></div>`;
  return `<div class="cal-hd"><button class="btn btn-ghost btn-sm" onclick="planShiftMonth(-1)">‹ 上月</button>
      <span class="m">${y} 年 ${mNames[m]}</span>
      <button class="btn btn-ghost btn-sm" onclick="planShiftMonth(1)">下月 ›</button></div>
    <div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    ${legend}${sum}${detail}`;
}

/* 考前冲刺清单：筛近 SPRINT_DAYS 天内复习过、但仍记不熟的卡片（只看最近状态，避免陈年旧卡混进来）；
   再加上用户手动复习钉住、或反复出错自动入列的卡片 / 题目（持久保留，不受近 5 天限制） */
const SPRINT_DAYS=5;
function sprintCards(){
  const out=[];const cut=now()-SPRINT_DAYS*86400000;
  const seen=new Set();
  activeDecks().forEach(d=>{(d.cards||[]).forEach(c=>{
    if(c.lastReviewed&&c.lastReviewed>=cut){
      const s=cardScore(c);
      if(s<70||c.forgot||c.hard){out.push({kind:'card',deck:d.name,deckId:d.id,id:c.id,title:c.front,score:s,extra:cardExtra(c),forgot:!!c.forgot,hard:!!c.hard,pinned:false,acc:c.reviews?Math.round((c.correct||0)/c.reviews*100):null});seen.add('card:'+c.id);}
    }
  });});
  const pin=DB.meta.sprintPinned||{cards:[],questions:[]};
  (pin.cards||[]).forEach(id=>{ if(seen.has('card:'+id))return; let fc=null,fd=null;
    activeDecks().forEach(d=>{ if(!fc){const c=(d.cards||[]).find(x=>x.id===id); if(c){fc=c;fd=d;}} });
    if(fc){const s=cardScore(fc);out.push({kind:'card',deck:fd.name,deckId:fd.id,id:fc.id,title:fc.front,score:s,extra:cardExtra(fc),forgot:!!fc.forgot,hard:!!fc.hard,pinned:true,acc:fc.reviews?Math.round((fc.correct||0)/fc.reviews*100):null});seen.add('card:'+id);} });
  (pin.questions||[]).forEach(id=>{ if(seen.has('q:'+id))return; let fq=null,fd=null;
    activeDecks().forEach(d=>{ if(!fq){const q=(d.questions||[]).find(x=>x.id===id); if(q){fq=q;fd=d;}} });
    if(fq){const s=questionScore(fq);out.push({kind:'q',deck:fd.name,deckId:fd.id,id:fq.id,title:fq.question,score:s,extra:qExtra(fq),forgot:false,hard:false,pinned:true,acc:fq.answered?Math.round((fq.answered-(fq.wrongCount||0))/fq.answered*100):null});seen.add('q:'+id);} });
  return out.sort((a,b)=>a.score-b.score);
}

/* 冲刺清单对应的题目（所属卡组里有冲刺弱卡的那些题；无题则退回全局错题） */
function sprintQuizQs(){
  const sp=sprintCards();
  const deckIds=new Set(sp.map(x=>x.deckId));
  const qs=[],seen=new Set();
  // 直接钉住的题目优先纳入
  (DB.meta.sprintPinned?.questions||[]).forEach(id=>{ activeDecks().forEach(d=>{ const q=(d.questions||[]).find(x=>x.id===id); if(q&&!seen.has(q.id)){seen.add(q.id);qs.push(q);} }); });
  activeDecks().forEach(d=>{ if(deckIds.has(d.id))(d.questions||[]).forEach(q=>{if(!seen.has(q.id)){seen.add(q.id);qs.push(q);}}); });
  if(!qs.length)activeDecks().forEach(d=>(d.questions||[]).forEach(q=>{if(q.inWrongBook&&!seen.has(q.id)){seen.add(q.id);qs.push(q);}}));
  return qs;
}

/* =================== 薄弱知识点诊断 =================== */
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function starOf(score){return score>=85?5:score>=70?4:score>=55?3:score>=40?2:1;}
function stars(n){return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n);}
function starColor(n){return n>=4?'var(--green)':n>=3?'var(--orange)':'var(--red)';}
function findCard(cid){for(const d of activeDecks()){const c=(d.cards||[]).find(x=>x.id===cid);if(c)return c;}return null;}
function findQuestion(qid){for(const d of activeDecks()){const q=(d.questions||[]).find(x=>x.id===qid);if(q)return q;}return null;}
/* 单卡掌握度 0-100：多次背诵正确率 + 间隔箱 + 遗忘/困难标记 */
function cardScore(c){
  const rev=c.reviews||0;
  if(!rev){const base=(c.box||1)<=2?55:65;return clamp(base-(c.forgot?15:0)-(c.hard?8:0),1,100);}
  const acc=(c.correct||0)/rev;
  const boxAdj=(c.box||1)<=1?-10:(c.box||1)===2?-5:(c.box||1)===3?0:(c.box||1)===4?5:10;
  return clamp(Math.round(acc*100+boxAdj-(c.forgot?15:0)-(c.hard?8:0)),1,100);
}
/* 单题掌握度 0-100：错题次数 + 蒙题/蒙对最危险 */
function questionScore(q){
  let s=100;
  s-=(q.wrongCount||0)*18;
  if(q.inWrongBook)s-=12;
  if(q.guessCount)s-=Math.min(20,q.guessCount*6);
  if(q.guessRight)s-=Math.min(15,q.guessRight*5);
  return clamp(Math.round(s),1,100);
}
/* 章节（卡组）综合掌握度 */
function deckScore(d){
  const cards=d.cards||[],qs=d.questions||[];
  let memT=0,memC=0,qT=0,qC=0,wrongN=0;
  cards.forEach(c=>{memT+=c.reviews||0;memC+=c.correct||0;});
  const qz=d.quiz||{};qT=qz.total||0;qC=qz.correct||0;
  qs.forEach(q=>{wrongN+=q.wrongCount||0;});
  const hasMem=memT>0,hasQuiz=qT>0;
  let score;
  if(hasMem&&hasQuiz)score=(memC/memT)*0.5*100+(qC/qT)*0.5*100;
  else if(hasMem)score=(memC/memT)*100;
  else if(hasQuiz)score=(qC/qT)*100;
  else score=wrongN>0?Math.max(45,100-wrongN*12):72;
  score-=wrongN*4;
  return {score:clamp(Math.round(score),1,100),memAcc:hasMem?Math.round(memC/memT*100):null,
    quizAcc:hasQuiz?Math.round(qC/qT*100):null,wrongN,cardN:cards.length,qN:qs.length,rev:memT};
}
function cardExtra(c){
  const p=[];
  if((c.reviews||0)>0)p.push('正确率 '+Math.round((c.correct||0)/(c.reviews||0)*100)+'%（'+(c.correct||0)+'/'+(c.reviews||0)+'）');
  if((c.box||1)<=2)p.push('间隔箱低');
  if(c.forgot)p.push('标记遗忘');
  if(c.hard)p.push('标记困难');
  return p.join(' · ')||'新卡未复习';
}
function qExtra(q){
  const p=[];
  if(q.wrongCount)p.push('错 '+q.wrongCount+' 次');
  if(q.inWrongBook)p.push('错题本');
  if(q.guessCount)p.push('蒙 '+q.guessCount+' 次');
  return p.join(' · ')||'暂无薄弱信号';
}
/* 汇总诊断：最低3章节 / 反复记不住知识点 / 平均星级 */
function diagnosis(){
  const chapters=DB.decks
    .filter(d=>!d.archived && ((d.cards&&d.cards.length)||(d.questions&&d.questions.length)||(d.quiz&&d.quiz.total)))
    .map(d=>{const s=deckScore(d);return {d,name:d.name,score:s.score,memAcc:s.memAcc,quizAcc:s.quizAcc,wrongN:s.wrongN,cardN:s.cardN,qN:s.qN,rev:s.rev};})
    .filter(c=>c.cardN>0||c.qN>0||c.rev>0)
    .sort((a,b)=>a.score-b.score);
  const weakest=chapters.slice(0,3);
  const items=[];
  activeDecks().forEach(d=>{
    const dq=d.quiz||{};const qAcc=(dq.total||0)>0?Math.round((dq.correct||0)/(dq.total||0)*100):null;
    (d.cards||[]).forEach(c=>items.push({kind:'card',deck:d.name,deckId:d.id,id:c.id,title:c.front,
      score:cardScore(c),extra:cardExtra(c),forgot:!!c.forgot,
      acc:(c.reviews||0)>0?Math.round((c.correct||0)/(c.reviews||0)*100):null}));
    (d.questions||[]).forEach(q=>items.push({kind:'q',deck:d.name,deckId:d.id,id:q.id,title:q.question,
      score:questionScore(q),extra:qExtra(q),wrongCount:q.wrongCount||0,inWrongBook:!!q.inWrongBook,acc:qAcc}));
  });
  const weakItems=items.filter(it=>it.score<70||it.wrongCount>0||it.forgot||it.inWrongBook)
    .sort((a,b)=>a.score-b.score).slice(0,12);
  const avgStar=chapters.length?Math.round(chapters.reduce((s,c)=>s+starOf(c.score),0)/chapters.length*10)/10:0;
  const plan=DB.meta.planTomorrow||{cards:[],questions:[]};
  return {weakest,weakItems,avgStar,totalChapters:chapters.length,planCount:plan.cards.length+plan.questions.length,allChapters:chapters};
}

      <div class="q-bar thin"><div style="width:${c.score}%;background:${starColor(sc)}"></div></div>

  }).join(''):'<div class="muted">暂无章节数据，去刷题或背卡后这里会显示最薄弱的章节</div>';

/* =================== GLOBAL SEARCH（全局搜索） =================== */
/* 组合一个卡片/题目可搜索的纯文本字段：卡片=正/反/笔记/拓展；题目=题干/选项/答案/解析 */
function searchFieldsOf(kind, obj){
  if(kind==='card'){
    return [obj.front, obj.back, obj.note, obj.ext].filter(Boolean).join(' / ');
  }
  const opts=(obj.options||[]).join(' / ');
  return [obj.question, opts, obj.answer, obj.analysis].filter(Boolean).join(' / ');
}
/* AND 多关键词：所有词都出现才命中，分越高越靠前 */
function matchScore(text, terms){
  if(!text)return 0;
  const t=text.toLowerCase();
  let s=0;
  for(const term of terms){
    if(t.indexOf(term)<0)return 0;
    s+=term.length*2;
  }
  return s+terms.length;
}
/* 取首个命中词附近的片段 */
function bestSnippet(text, terms){
  if(!text)return '';
  const t=text.toLowerCase();
  let pos=-1;
  for(const term of terms){const i=t.indexOf(term);if(i>=0&&(pos<0||i<pos))pos=i;}
  if(pos<0)return text.slice(0,64);
  const start=Math.max(0,pos-18);
  let snip=text.slice(start,start+72);
  if(start>0)snip='…'+snip;
  if(start+72<text.length)snip=snip+'…';
  return snip;
}
/* 高亮命中的关键词（先转义，再按词加 <mark>） */
function hl(text, terms){
  const s=esc(text||'');
  if(!terms||!terms.length)return s;
  const re=new RegExp('('+terms.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  return s.replace(re,m=>'<mark>'+m+'</mark>');
}
function globalSearch(raw){
  const q=(raw||'').trim().toLowerCase();
  const box=document.getElementById('search-results');
  const clearBtn=document.getElementById('search-clear');
  if(clearBtn)clearBtn.style.display=q?'block':'none';
  if(!q){box.style.display='none';box.innerHTML='';return;}
  const terms=q.split(/\s+/).filter(Boolean);
  const res=[];
  DB.decks.forEach(d=>{
    const nameHit=matchScore(d.name,terms);
    if(nameHit){
      res.push({deck:d.name,deckId:d.id,kind:'deck',id:d.id,title:d.name,
        snippet:`${d.cards?d.cards.length:0} 张卡片 · ${d.questions?d.questions.length:0} 道题目${d.archived?' · 📦 已归档':''}`,
        score:nameHit+20});
    }
    (d.cards||[]).forEach(c=>{
      const fields=searchFieldsOf('card',c);
      const hit=matchScore(fields,terms);
      if(hit){
        const title=c.front||'';
        res.push({deck:d.name,deckId:d.id,kind:'card',id:c.id,title,
          snippet:bestSnippet(fields,terms),score:hit+(title.toLowerCase().includes(q)?6:0)});
      }
    });
    (d.questions||[]).forEach(qq=>{
      const fields=searchFieldsOf('question',qq);
      const hit=matchScore(fields,terms);
      if(hit){
        const title=qq.question||'';
        res.push({deck:d.name,deckId:d.id,kind:'question',id:qq.id,title,
          snippet:bestSnippet(fields,terms),score:hit+(title.toLowerCase().includes(q)?6:0)});
      }
    });
  });
  res.sort((a,b)=>b.score-a.score);
  const top=res.slice(0,30);
  if(!top.length){box.innerHTML=`<div class="search-empty">没有匹配「${esc(raw)}」的内容，换个关键词试试</div>`;box.style.display='block';return;}
  box.innerHTML=top.map(r=>`<div class="search-item" onclick="jumpSearch('${r.kind}','${r.deckId}','${r.id}')">
      <span class="search-kind ${r.kind}">${r.kind==='card'?'🃏 卡片':r.kind==='question'?'📝 题目':'📁 卡组'}</span>
      <div class="search-body">
        <div class="search-title">${hl(r.title,terms)}</div>
        <div class="search-snip">${hl(r.snippet,terms)}</div>
        <div class="search-deck">📁 ${esc(r.deck)}</div>
      </div></div>`).join('')
    + (res.length>top.length?`<div class="search-more">仅显示前 ${top.length} 条 / 共 ${res.length} 条匹配，请缩小关键词</div>`:'');
  box.style.display='block';
}
function closeSearch(){const box=document.getElementById('search-results');if(box)box.style.display='none';}
function clearSearch(){const inp=document.getElementById('global-search');if(inp)inp.value='';const box=document.getElementById('search-results');if(box){box.style.display='none';box.innerHTML='';}const cb=document.getElementById('search-clear');if(cb)cb.style.display='none';if(inp)inp.focus();}
function searchKey(e){
  if(e.key==='Escape'){closeSearch();if(e.target&&e.target.blur)e.target.blur();}
  else if(e.key==='Enter'){

  }
}

/* ---------- 导出 / 打印中心 ---------- */
let __expRange='all';
function openExportCenter(){

    <div class="muted" style="margin-bottom:10px">导出整套卡组、错题本或冲刺清单，生成 <b>Word / TXT</b> 或打印纸质清单（适合图书馆无设备复习）。</div>
    <div class="pv-field"><label>导出范围</label>
      <div class="seg" id="exp-range">
        <div class="opt active" data-v="all" onclick="expRange('all')">🗂 全部卡组</div>
        <div class="opt" data-v="wrong" onclick="expRange('wrong')">✅ 错题本</div>
        <div class="opt" data-v="sprint" onclick="expRange('sprint')">🔥 冲刺清单</div>
      </div>
    </div>
    <div class="pv-field"><label>格式 / 动作</label>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="doExport('word')">📄 导出 Word</button>
        <button class="btn" onclick="doExport('txt')">📄 导出 TXT</button>
        <button class="btn btn-outline" onclick="doExport('print')">🖨 打印清单</button>
      </div>
    </div>
    <div class="pv-field"><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="exp-ans" checked> 包含答案（取消勾选＝留白，适合纸质默写自测）</label></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="hideModal()">关闭</button></div>`;
  showModal();
}
function expRange(v){__expRange=v;document.querySelectorAll('#exp-range .opt').forEach(o=>o.classList.toggle('active',o.dataset.v===v));}
function rangeTitle(r){return {all:'全部卡组',wrong:'错题本',sprint:'考前冲刺清单'}[r]||r;}
function fileNameFor(r,ext){return rangeTitle(r).replace(/[\\/:*?"<>|]/g,'')+'_'+todayKey()+'.'+ext;}
function exportCollect(range){
  const out=[];const spIds=new Set(range==='sprint'?sprintCards().map(it=>it.id):[]);
  DB.decks.forEach(d=>{
    let cards=[],questions=[];
    if(range==='all'){cards=(d.cards||[]).slice();questions=(d.questions||[]).slice();}
    else if(range==='wrong'){questions=(d.questions||[]).filter(q=>q.inWrongBook);}
    else if(range==='sprint'){cards=(d.cards||[]).filter(c=>spIds.has(c.id));}
    if(cards.length||questions.length)out.push({name:d.name,cards,questions});
  });
  return out;
}
function doExport(fmt){
  const range=__expRange;
  const withAns=document.getElementById('exp-ans')?(document.getElementById('exp-ans').checked):true;
  const data=exportCollect(range);
  if(!data.length){toast('该范围没有可导出的内容');return;}
  if(fmt==='txt')downloadText(fileNameFor(range,'txt'),buildDecksText(range,data,withAns));
  else if(fmt==='word')downloadWord(fileNameFor(range,'doc'),buildDecksHtml(range,data,withAns));
  else printHtml(buildDecksHtml(range,data,withAns));
}
function buildDecksText(range,data,withAns,title){
  const t=title||rangeTitle(range);
  const L=[];
  L.push('🧠 文档记忆卡 · 导出');
  let cardN=0,quizN=0;data.forEach(s=>{cardN+=s.cards.length;quizN+=s.questions.length;});
  L.push('范围：'+t+'　生成时间：'+todayKey());
  L.push('共 '+data.length+' 个卡组 · '+cardN+' 张卡片 · '+quizN+' 道题目');
  L.push('');
  data.forEach(s=>{
    L.push('==================== '+s.name+' ====================');
    if(s.cards.length){
      L.push('');L.push('【记忆卡片】('+s.cards.length+')');
      s.cards.forEach((c,i)=>{
        L.push('');L.push('Q'+(i+1)+'：'+stripHtml(c.front));
        if(withAns)L.push('A：'+stripHtml(c.back));
        else L.push('A：________________________________________');
        if(c.note)L.push('📝 口诀：'+stripHtml(c.note));
        if(c.ext)L.push('🔗 拓展：'+stripHtml(c.ext));
      });
    }
    if(s.questions.length){
      L.push('');L.push('【题目】('+s.questions.length+')');
      s.questions.forEach((q,i)=>{
        L.push('');L.push('Q'+(i+1)+'：['+TYPE_LABEL[q.type]+'] '+stripHtml(q.question));
        (q.options||[]).forEach((o,j)=>L.push('  '+String.fromCharCode(65+j)+'. '+stripHtml(o)));
        if(withAns){L.push('答案：'+q.answer);if(q.analysis)L.push('解析：'+stripHtml(q.analysis));}
        else L.push('答案：__________');
      });
    }
    L.push('');
  });
  return L.join('\n');
}
function msoHead(){return '<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8">';}
function wordCss(){return '<style>'
  +'@page{size:A4;margin:16mm;}'
  +'body{font-family:"Microsoft YaHei","SimSun",sans-serif;color:#1f2937;line-height:1.7;font-size:14px}'
  +'h1{font-size:21px;text-align:center;margin:0 0 2px}'
  +'.meta{text-align:center;color:#6b7280;font-size:12px;margin-bottom:14px}'
  +'.deck{border-top:2px solid #6366f1;margin-top:18px;padding-top:6px}'
  +'.deck h2{font-size:16px;color:#4f46e5;margin:6px 0 8px}'
  +'.item{margin:9px 0;padding-bottom:7px;border-bottom:1px dashed #e5e7eb}'
  +'.q{font-weight:700;white-space:pre-wrap}'
  +'.a{white-space:pre-wrap;color:#0f766e}'
  +'.blank{border-bottom:1px solid #94a3b8;min-height:24px;display:block;margin:3px 0}'
  +'.opt{margin-left:16px}'
  +'.note{color:#b45309;font-size:13px;white-space:pre-wrap}'
  +'.ans-box{border:1px solid #16a34a;border-radius:6px;padding:3px 9px;color:#15803d;display:inline-block;background:#f0fdf4;font-weight:700}'
  +'</style>';}
/* 导出时去掉高亮 span，但保留换行与富文本格式 */
function stripMarks(html){return (html||'').replace(/<span class="(mark|anno)[^"]*"[^>]*>([\s\S]*?)<\/span>/gi,'$2');}
function buildDecksHtml(range,data,withAns,title){
  const t=title||rangeTitle(range);
  let h=msoHead()+wordCss()+'</head><body>';
  h+='<h1>🧠 文档记忆卡 · '+esc(t)+'</h1>';
  h+='<div class="meta">生成时间：'+todayKey()+'　·　共 '+data.length+' 个卡组</div>';
  data.forEach(s=>{
    h+='<div class="deck"><h2>'+esc(s.name)+'</h2>';
    s.cards.forEach((c,i)=>{
      h+='<div class="item"><div class="q">Q'+(i+1)+'：'+stripMarks(toRich(c.front))+'</div>';
      if(withAns)h+='<div class="a">A：'+stripMarks(toRich(c.back))+'</div>';else h+='<div class="blank"></div>';
      if(c.note)h+='<div class="note">📝 '+toRich(c.note)+'</div>';
      if(c.ext)h+='<div class="note">🔗 '+toRich(c.ext)+'</div>';
      h+='</div>';
    });
    s.questions.forEach((q,i)=>{
      h+='<div class="item"><div class="q">Q'+(i+1)+'：['+TYPE_LABEL[q.type]+'] '+esc(stripHtml(q.question))+'</div>';
      (q.options||[]).forEach((o,j)=>h+='<div class="opt">'+String.fromCharCode(65+j)+'. '+esc(o)+'</div>');
      if(withAns){h+='<div class="ans-box">答案：'+esc(q.answer)+'</div>';if(q.analysis)h+='<div class="a">解析：'+esc(stripHtml(q.analysis))+'</div>';}
      else h+='<div class="blank"></div>';
      h+='</div>';
    });
    h+='</div>';
  });
  h+='</body></html>';
  return h;
}
function downloadText(name,text){const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);toast('已下载 '+name);}
function downloadWord(name,html){const blob=new Blob(['﻿'+html],{type:'application/msword;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);toast('已下载 '+name);}
function printHtml(html){
  const w=window.open('','_blank');
  if(!w){toast('浏览器拦截了打印窗口，请允许弹窗，或改用「导出 Word」');return;}
  w.document.open();w.document.write(html);w.document.close();w.focus();
  setTimeout(()=>{try{w.print();}catch(e){}},300);
}

  if(!data||data.kind!=='deck'||!data.deck||!Array.isArray(data.deck.cards)){toast('这不是「文档记忆卡」导出的卡组文件');return false;}
  const nd=JSON.parse(JSON.stringify(data.deck));
  nd.id=uid();
  (nd.cards||[]).forEach(c=>{c.id=uid();c.fav=false;});
  (nd.questions||[]).forEach(q=>{q.id=uid();q.fav=false;});

/* =================== 长按选中 / 标记 / 高亮 =================== */
let _txtRange=null,_txtStore=null,_ttTimer=null;
function isToolsOpen(){const el=document.getElementById('text-tools');return el&&el.classList.contains('show');}
function hideTextTools(){const el=document.getElementById('text-tools');if(el)el.classList.remove('show');}
function storeEl(range){
  let n=range.commonAncestorContainer;
  const el=n.nodeType===3?n.parentElement:n;
  if(!el||!el.closest)return null;
  return el.closest('[data-store],.ce-edit')||null;   // 兼顾查看态(data-store)与编辑态(contenteditable)
}
function positionTextTools(r){
  const el=document.getElementById('text-tools');if(!el)return;
  el.classList.add('show');                       // 先显示以测量尺寸
  const w=el.offsetWidth,h=el.offsetHeight;const rect=r.getBoundingClientRect();
  const touch=document.body.classList.contains('is-touch');
  let x=rect.left+rect.width/2-w/2, y;
  if(touch){
    // 触屏设备原生「拷贝 / 粘贴」菜单浮在选区上方，工具条改放选区下方以避免重叠
    y=rect.bottom+10;
    if(y+h>window.innerHeight-8) y=rect.top-h-10;  // 下方放不下再退回上方
  }else{
    y=rect.top-h-10;
    if(y<8) y=rect.bottom+10;
  }
  x=Math.max(8,Math.min(x,window.innerWidth-w-8));
  y=Math.max(8,Math.min(y,window.innerHeight-h-8));
  el.style.left=x+'px';el.style.top=y+'px';
}
function showTextTools(){
  const el=document.getElementById('text-tools');if(!el)return;
  const sel=window.getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount){hideTextTools();return;}
  const r=sel.getRangeAt(0);const store=storeEl(r);const txt=sel.toString().trim();
  if(!store||!txt){hideTextTools();return;}
  _txtRange=r.cloneRange();_txtStore=store;
  positionTextTools(r);
}
function initTextTools(){
  if(typeof window.getSelection!=='function')return;
  document.addEventListener('mouseup',()=>{setTimeout(showTextTools,10);});
  document.addEventListener('selectionchange',()=>{
    const sel=window.getSelection();
    if(!sel||sel.isCollapsed){if(isToolsOpen()&&!_txtRange)hideTextTools();return;}
    clearTimeout(_ttTimer);_ttTimer=setTimeout(showTextTools,120);
  });
  document.addEventListener('click',e=>{if(e.target.closest&&!e.target.closest('#text-tools')){if(isToolsOpen()&&!_txtRange)hideTextTools();}},true);
  document.addEventListener('scroll',()=>{if(isToolsOpen())hideTextTools();},true);
  document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.selectable'))e.preventDefault();});
}
function persistStore(store){
  if(!store)return;
  const kind=store.dataset.storeKind,id=store.dataset.storeId,field=store.dataset.storeField;
  if(kind==='card'){const c=findCard(id);if(!c)return;c[field]=store.innerHTML;save();}
  else{const q=findQuestion(id);if(!q)return;q[field]=store.innerHTML;save();}
}
function wrapRange(range,cls,aid,tag){
  let el=null;
  try{el=document.createElement(tag||'span');if(cls)el.className=cls;if(aid)el.dataset.aid=aid;range.surroundContents(el);return el;}
  catch(e){try{const frag=range.extractContents();el=document.createElement(tag||'span');if(cls)el.className=cls;if(aid)el.dataset.aid=aid;el.appendChild(frag);range.insertNode(el);return el;}catch(e2){return null;}}
}
/* 高亮配色（半透明，便于多色分层叠加） */
const HL_COLORS={'hl-y':'rgba(253,230,138,.6)','hl-g':'rgba(187,247,208,.6)','hl-b':'rgba(191,219,254,.6)','hl-p':'rgba(251,207,232,.6)'};
/* 把 mark 上所有 hl-* 颜色渲染为“真正叠加”的半透明分层背景：
   每种颜色铺满整段文字、按透明度混合，所有颜色同时可见、互相叠加（最新色在最上层）。
   关键：仅用「单值」background-size / background-position（对全部图层生效），
   不依赖逗号分隔的多值简写——后者在微信 WebView / 旧 Chromium / 部分 Safari 会被整条丢弃，
   导致多色叠加退化成单色“替换”（即只能四选一）。 */
function paintMark(el){
  let cols=(el.dataset.cols||'').split(',').map(s=>s.trim()).filter(Boolean);
  el.classList.forEach(c=>{ if(HL_COLORS[c]&&cols.indexOf(c)<0)cols.push(c); });
  el.dataset.cols=cols.join(',');
  // 清掉 background 简写与底色，改用 longhand，避免旧引擎整条丢弃多层简写
  el.style.background='';
  el.style.backgroundColor='transparent';
  el.style.backgroundImage='none';
  if(!cols.length){ return; }
  // 最新添加的颜色排在最前（addCol 用 unshift），反转后它成为最后一层、叠在最上方
  const layers=cols.slice().reverse().map(c=>'linear-gradient('+HL_COLORS[c]+','+HL_COLORS[c]+')');
  el.style.backgroundImage=layers.join(',');
  el.style.backgroundSize='100% 100%';
  el.style.backgroundPosition='0% 0%';
  el.style.backgroundRepeat='no-repeat';
}
function addCol(el,cls){let c=(el.dataset.cols||'').split(',').filter(Boolean);if(c.indexOf(cls)<0)c.unshift(cls);el.dataset.cols=c.join(',');}
/* 收集选区来源处已有的高亮颜色（包裹前调用，用于继承到新 mark） */
function collectColorsAt(range){
  const set=new Set();
  let root=range.commonAncestorContainer;
  if(root&&root.nodeType===3)root=root.parentElement;
  if(root&&root.closest){
    if(root.matches&&root.matches('.mark')&&range.intersectsNode(root))root.classList.forEach(c=>{if(HL_COLORS[c])set.add(c);});
    root.querySelectorAll('.mark').forEach(m=>{ if(range.intersectsNode(m))m.classList.forEach(c=>{if(HL_COLORS[c])set.add(c);}); });
  }
  return [...set];
}
/* 把 mark 内被切分下来的旧 mark 拍平：颜色合并到本 mark，删除嵌套 */
function flattenNested(mark){
  const inner=[...mark.querySelectorAll('.mark')].sort((a,b)=>{let da=0,db=0,ta=a,tb=b;while(ta){da++;ta=ta.parentElement;}while(tb){db++;tb=tb.parentElement;}return db-da;});
  inner.forEach(m=>{
    m.classList.forEach(c=>{if(HL_COLORS[c])mark.classList.add(c);});
    const oc=(m.dataset.cols||'').split(',').filter(Boolean),mc=(mark.dataset.cols||'').split(',').filter(Boolean);
    oc.forEach(c=>{if(mc.indexOf(c)<0)mc.push(c);});mark.dataset.cols=mc.join(',');
    while(m.firstChild)mark.insertBefore(m.firstChild,m);m.remove();
  });
  paintMark(mark);
}
function singleMarkAt(range){
  const s=range.startContainer,e=range.endContainer;
  const sm=(s.nodeType===3?s.parentElement:s),em=(e.nodeType===3?e.parentElement:e);
  const a=sm&&sm.closest?sm.closest('.mark'):null,b=em&&em.closest?em.closest('.mark'):null;
  return (a&&a===b)?a:null;
}
function rangeEqualsNode(range,node){
  const r=document.createRange();try{r.selectNodeContents(node);}catch(e){return false;}
  return range.compareBoundaryPoints(Range.START_TO_START,r)===0&&range.compareBoundaryPoints(Range.END_TO_END,r)===0;
}
/* 合并冗余嵌套：若新建 mark 恰好等于其父 mark 的全部内容（即整段重选上色），把颜色并入父 mark，保持单元素 */
function collapseRedundant(mark){
  const parent=mark.parentElement;
  if(parent&&parent.classList&&parent.classList.contains('mark')&&parent.textContent===mark.textContent&&parent.textContent.length){
    mark.classList.forEach(c=>{if(HL_COLORS[c])parent.classList.add(c);});
    const mc=(parent.dataset.cols||'').split(',').filter(Boolean),oc=(mark.dataset.cols||'').split(',').filter(Boolean);
    oc.forEach(c=>{if(mc.indexOf(c)<0)mc.unshift(c);});parent.dataset.cols=mc.join(',');
    while(mark.firstChild)parent.insertBefore(mark.firstChild,mark);parent.removeChild(mark);
    paintMark(parent);return parent;
  }
  return mark;
}
function applyHighlight(cls){
  if(!_txtRange){toast('请先选中文字');return;}
  if(!_txtStore){toast('该处不可高亮');return;}
  // 选区与某标记完全重合：直接在该标记上叠加新颜色（不新增元素）
  const inside=singleMarkAt(_txtRange);
  if(inside&&rangeEqualsNode(_txtRange,inside)){
    inside.classList.add(cls);addCol(inside,cls);paintMark(inside);
    persistStore(_txtStore);hideTextTools();toast('已高亮');return;
  }
  // 否则只包裹选中的子范围，并继承选区原有的颜色，实现多色叠加且不影响其余文字
  const inherit=collectColorsAt(_txtRange);
  let mark=wrapRange(_txtRange,'mark');
  if(!mark){toast('所选内容跨段落，无法高亮');hideTextTools();return;}
  flattenNested(mark);
  inherit.forEach(c=>{if(c!==cls)mark.classList.add(c);});
  mark.classList.add(cls);addCol(mark,cls);
  mark=collapseRedundant(mark);paintMark(mark);
  persistStore(_txtStore);hideTextTools();toast('已高亮');
}
function applyInline(tag){
  if(!_txtRange){toast('请先选中文字');return;}
  if(!_txtStore){toast('该处不可标记');return;}
  const el=wrapRange(_txtRange,'',null,tag);
  if(!el){toast('所选内容跨段落，无法标记');hideTextTools();return;}
  persistStore(_txtStore);hideTextTools();toast('已标记');
}
function clearHighlight(){
  let range=_txtRange;
  const sel=window.getSelection();
  if(sel&&!sel.isCollapsed&&sel.rangeCount) range=sel.getRangeAt(0);   // 优先用当前实时选区
  if(!range){hideTextTools();return;}
  const marks=collectMarks(range);                                        // 收集选区内全部标记（含已叠加的多层）
  if(!marks.length){toast('请先选中要清除的文字');return;}
  const store=storeEl(range);                                             // 解包前先定位所属存储节点
  marks.forEach(unwrap);
  if(store)persistStore(store);
  hideTextTools();toast('已清除标记');
}
/* 收集与选区相交的所有 .mark / b / i / u 标记（含叠加后的多层嵌套） */
function collectMarks(range){
  const out=[];
  let root=range.commonAncestorContainer;
  if(root&&root.nodeType===3)root=root.parentElement;
  if(!root||!root.closest)return out;
  if(root.matches&&root.matches('.mark,b,i,u')&&range.intersectsNode(root))out.push(root);   // root 自身即标记
  root.querySelectorAll('.mark,b,i,u').forEach(m=>{ if(out.indexOf(m)<0&&range.intersectsNode(m))out.push(m); });
  return out;
}
function unwrap(el){const p=el.parentNode;if(!p)return;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);}
function refreshCurrentView(){
  const av=document.querySelector('.view.active');if(!av)return;
  const id=av.id;
  if(id==='view-study')renderStudy();
  else if(id==='view-quiz')renderQuiz();
  else if(id==='view-detail')renderDetail();
  else if(id==='view-home')renderHome();
}
function copyText(){
  const t=_txtRange?_txtRange.toString():'';if(!t){toast('未选中文字');return;}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('已复制')).catch(()=>fallbackCopy(t));
  else fallbackCopy(t);
  hideTextTools();
}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('已复制');}catch(e){toast('复制失败');}ta.remove();}

/* =================== 视口模式（移动/PC + 横屏/竖屏） =================== */
function applyViewportMode(){
  const w=window.innerWidth||document.documentElement.clientWidth;
  const h=window.innerHeight||document.documentElement.clientHeight;
  const b=document.body.classList;
  b.toggle('is-mobile',w<=640);
  b.toggle('is-touch',('ontouchstart' in window)||(navigator.maxTouchPoints>0));
  b.toggle('landscape',w>h);
  b.toggle('portrait',w<=h);
}

/* =================== INIT =================== */
(function(){
  settleBuffer();                                 // 启动即结算历史配额缓冲（无记录/无计划则无影响）
  // 点击搜索框外部时收起结果面板
  document.addEventListener('click',e=>{ if(!e.target.closest||!e.target.closest('.search-wrap'))closeSearch(); });
  // 恢复已锁定的文件句柄（file:// 场景，使自动写回跨刷新生效）
  try{restoreHandle();}catch(_){}
  // 自动备份：每 10 分钟 + 切后台 + 关闭页面时各存一次
  try{const _bs=loadBackups();autoBackup._last=_bs.length?dbSig(_bs[_bs.length-1].data):null;}catch(e){}
  autoBackup();                                   // 首次启动先留一份基线（无变化则自动跳过）
  setInterval(()=>autoBackup(),10*60*1000);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden)autoBackup(); });
  window.addEventListener('beforeunload',()=>{ try{autoBackup();}catch(e){} try{dumpOnExit();}catch(_){} });
  wireGestures();                                 // 键盘导航（←→ / 空格）
  initTextTools();                                // 长按选中 / 标记 / 高亮
  refreshStoreStatus();                           // 探测本地存储是否可用，不可用则提示导出兜底
  applyViewportMode();                            // 视口模式：移动/PC + 横屏/竖屏
  let _vpT=null;
  const onVp=()=>{clearTimeout(_vpT);_vpT=setTimeout(applyViewportMode,120);};
  window.addEventListener('resize',onVp);
  window.addEventListener('orientationchange',onVp);
  const c=syncCfg();
  if(c&&c.auto){ syncPull().finally(()=>renderHome()); } else { renderHome(); }
  wireFolderDnd();                                 // 我的卡组：↑↓ 按钮 + 拖拽排序（桌面 HTML5 / 移动端长按）
})();
/* =================== 键盘 =================== */
function wireGestures(){
  // 键盘：PC 端 ←→ 切换卡片/题目，空格/回车翻转卡片
  document.addEventListener('keydown',e=>{
    const av=document.querySelector('.view.active');if(!av)return;const id=av.id;
    const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'||tg.isContentEditable))return;
    if(id==='view-study'){
      if(e.key==='ArrowLeft'){studyNext();e.preventDefault();}
      else if(e.key==='ArrowRight'){studyPrev();e.preventDefault();}
      else if(e.key===' '||e.key==='Enter'){flipCard();e.preventDefault();}
    }else if(id==='view-quiz'){
      if(e.key==='ArrowLeft'){if(quiz.submitted)nextQ();else submitAnswer();e.preventDefault();}
      else if(e.key==='ArrowRight'){if(quiz.idx>0)quizPrev();e.preventDefault();}
    }
  });
}
