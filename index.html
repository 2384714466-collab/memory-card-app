<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>文档记忆卡 · 记忆 + 刷题一体化</title>
<!-- KaTeX 公式渲染（高数 / 线代 / 概率等）。联网时从 CDN 加载；离线则公式退化为 $...$ 原文 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous" referrerpolicy="no-referrer" onload="window.__katexReady&&window.__katexReady()"></script>
<style>
  :root{
    --primary:#3b82f6; --primary-light:#dbeafe; --primary-dark:#2563eb;
    --green:#22c55e; --green-light:#dcfce7; --green-dark:#16a34a;
    --orange:#f59e0b; --orange-light:#fef3c7;
    --red:#ef4444; --red-light:#fee2e2;
    --text:#1e293b; --text-2:#475569; --text-3:#94a3b8;
    --border:#e2e8f0; --bg:#f1f5f9; --card:#ffffff;
    --radius:12px; --radius-s:8px;
    --shadow:0 1px 3px rgba(15,23,42,.08);
    --shadow-md:0 4px 16px rgba(15,23,42,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--bg);
       display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.05)}
  /* top bar */
  .topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--border);
          display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
  .topbar .brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
  .topbar .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#8b5cf6);
          color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
  .tabs{display:flex;gap:6px}
  .tab{padding:7px 14px;border-radius:20px;font-size:14px;font-weight:600;color:var(--text-3);cursor:pointer}
  .tab.active{background:var(--primary-light);color:var(--primary)}
  .main{flex:1;overflow-y:auto;padding:18px}
  /* ===== 存储状态横幅（localStorage 不可用时提示导出） ===== */
  .store-banner{display:none;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 14px 0;padding:9px 12px;border-radius:10px;
    font-size:12.5px;line-height:1.5;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
  .store-banner.show{display:flex}
  .store-banner b{font-weight:700}
  .store-banner .btn{border:none;background:#ea580c;color:#fff;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .store-banner .btn:hover{background:#c2410c}
  .store-banner .btn.ghost{background:transparent;color:#9a3412;border:1px solid #fed7aa}
  .store-status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px;vertical-align:middle}
  .store-status-dot.ok{background:var(--green)} .store-status-dot.warn{background:#f59e0b}
  .store-status-dot.bad{background:var(--red)}
  .view{display:none} .view.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* generic */
  .card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .rules-box{border:1px dashed var(--border);border-radius:var(--radius-s);padding:10px 12px;background:rgba(99,102,241,.05);margin-top:12px}
  .rules-box .rb-h{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:7px;display:flex;align-items:center;gap:5px}
  .rules-box ul{margin:0;padding:0;list-style:none;font-size:12px;line-height:1.8;color:var(--text-2)}
  .rules-box li{display:flex;gap:7px;align-items:baseline}
  .rules-box li b{color:var(--text);white-space:nowrap;font-weight:700}
  .rules-box .mo{color:var(--text-3);font-size:11px;margin-top:7px}
  .muted{color:var(--text-3);font-size:13px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .btn{border:none;border-radius:var(--radius-s);padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;
       display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;font-family:inherit}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-green{background:var(--green);color:#fff}
  .btn-green:hover{background:var(--green-dark)}
  .btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary)}
  .btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border)}
  .btn-block{width:100%}
  .btn-sm{padding:7px 12px;font-size:13px}
  .btn-danger{background:var(--red-light);color:var(--red);border:1px solid #fecaca}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  /* 卡组详情：翻面 / 批管 / 重置 / 导入 同一行紧凑排列 */
  .deck-tools{display:flex;gap:6px;margin-bottom:12px}
  .deck-tools .btn{flex:1 1 0;min-width:0;justify-content:center;padding:9px 6px;font-size:13px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .stat{background:#fff;border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);text-align:center}
  .stat .n{font-size:30px;font-weight:800;color:var(--primary);line-height:1.1}
  .stat .n.g{color:var(--green)} .stat .n.o{color:var(--orange)} .stat .n.r{color:var(--red)}
  .stat .l{font-size:12px;color:var(--text-3);margin-top:2px}

  .deck{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--radius);padding:14px;
        box-shadow:var(--shadow);cursor:pointer;transition:.15s;margin-bottom:12px}
  .deck:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .deck .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .deck .info{flex:1;min-width:0}
  .deck .info .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .deck .info .mt{font-size:12px;color:var(--text-3)}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .tag-q{background:var(--green-light);color:var(--green-dark)}
  .tag-c{background:var(--primary-light);color:var(--primary-dark)}
  .tag-b{background:#ede9fe;color:#7c3aed}
  .tag-tg{display:inline-flex;align-items:center;gap:2px;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600;background:#fef3c7;color:#b45309;margin:2px 4px 0 0}
  .tag-row{display:flex;flex-wrap:wrap;margin-top:4px}

  /* 富文本编辑：图片 + 考点高亮 */
  .ce-field{border:1px solid var(--border);border-radius:var(--radius-s);overflow:hidden;background:var(--card)}
  .ce-bar{display:flex;flex-wrap:wrap;gap:4px;padding:5px 6px;background:#f8fafc;border-bottom:1px solid var(--border)}
  .ce-bar .btn{padding:3px 8px;font-size:11px;border-radius:6px}
  .ce-edit{min-height:56px;max-height:230px;overflow:auto;padding:9px 11px;font-size:14px;line-height:1.7;
           outline:none;word-break:break-word}
  .ce-edit:focus{background:#fcfdff}
  .ce-edit img,.ce-img{max-width:100%;height:auto;border-radius:8px;display:block;margin:6px auto}
  /* 考点高亮：一级=红色重点，二级=黄色次重点 */
  .hl1{background:linear-gradient(180deg,transparent 52%,#fecaca 52%);color:#b91c1c;font-weight:800;border-radius:2px;padding:0 1px}
  .hl2{background:linear-gradient(180deg,transparent 52%,#fde68a 52%);border-radius:2px;padding:0 1px}
  /* 关键词荧光（黄色，兼作背诵自检判分依据） */
  .hl-key{background:#fef9c3;color:#854d0e;border-bottom:2px solid #eab308;border-radius:3px;padding:0 2px;font-weight:700}
  /* 拓展链接 */
  .link-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
  .link-row .inp{padding:6px 9px}
  .ext-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .ext-link{display:inline-flex;align-items:center;gap:3px;background:var(--primary-light);color:var(--primary-dark);
    text-decoration:none;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid #dbeafe}
  .ext-link:active{transform:scale(.97)}
  /* 便签贴纸 */
  .sticky{margin-top:8px;background:linear-gradient(180deg,#fff7cc,#fff2a8);border:1px solid #f4e07a;
    border-radius:8px;padding:8px 10px;box-shadow:2px 3px 6px rgba(180,150,0,.18);position:relative;transform:rotate(-.6deg)}
  .sticky-t{font-size:11px;font-weight:800;color:#a16207;margin-bottom:3px}
  .sticky-b{font-size:14px;color:#713f12;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  /* 拓展笔记 */
  .ext-note{margin-top:6px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .ext-note-hd,.ext-note-hd-static{font-size:12px;font-weight:700;padding:6px 10px;background:#f0f9ff;color:#0369a1;display:flex;justify-content:space-between;align-items:center}
  .ext-note-hd{cursor:pointer;user-select:none}
  .ext-note-hd-static{cursor:default}
  .ext-note .ext-toggle{font-size:11px;color:var(--text-3)}
  .ext-note-bd{padding:6px 10px;font-size:14px;line-height:1.7;word-break:break-word}
  .ext-note-bd img{max-width:100%;height:auto;border-radius:6px;display:block;margin:4px auto}

  /* folders */
  .folder-sec{margin-bottom:10px}
  .folder-hd{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--primary-light);border-radius:var(--radius-s);cursor:pointer;font-weight:700;user-select:none}
  .folder-hd[draggable]{cursor:grab}
  .folder-hd[draggable]:active{cursor:grabbing}
  .folder-sec.dragging{opacity:.35}
  .folder-sec.drop-before{outline:3px solid var(--primary);outline-offset:-3px;border-radius:var(--radius-s)}
  .folder-sec.drop-after{outline:3px solid var(--primary);outline-offset:-3px;border-radius:var(--radius-s)}
  .dnd-ghost{position:fixed;left:0;top:0;z-index:999;pointer-events:none;opacity:.92;
    box-shadow:0 12px 32px rgba(15,23,42,.28);background:#fff;border-radius:var(--radius-s);overflow:hidden}
  .folder-hd .ar{transition:transform .15s;font-size:12px;color:var(--text-3)}
  .folder-hd .fi{font-size:16px}
  .folder-hd .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .folder-hd .cnt{background:#fff;color:var(--text-2);font-size:12px;font-weight:700;padding:1px 9px;border-radius:20px}
  .folder-hd .f-acts{display:flex;gap:4px}
  .folder-hd .f-acts .btn{padding:2px 7px;font-size:12px}
  .folder-body{padding:4px 0 2px 6px}
  /* batch */
  .btn-xs{padding:2px 8px;font-size:12px}
  .inp{padding:6px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px}
  .card-check{display:flex;align-items:center;flex-shrink:0;margin-right:4px}
  .card-check input{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
  .li.sel{background:var(--primary-light);outline:2px solid var(--primary)}
  .batch-bar{position:sticky;top:0;z-index:5;background:#fff;border:1px solid var(--primary-light);border-radius:var(--radius-s);padding:10px;margin-bottom:10px;box-shadow:var(--shadow)}
  .batch-bar .bb-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .batch-bar .bb-acts{margin-top:8px}
  .batch-bar .bb-cnt{margin-left:auto;font-size:13px;color:var(--text-2);font-weight:600}
  .code{background:#0f172a;color:#e2e8f0;padding:10px;border-radius:8px;font-size:12px;max-height:200px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin-top:8px}

  .section-title{font-size:13px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin:6px 2px 10px}

  /* import */
  .dropzone{border:2px dashed var(--border);border-radius:var(--radius);padding:30px;text-align:center;
            color:var(--text-3);cursor:pointer;transition:.15s;background:#fff}
  .dropzone:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
  .seg{display:flex;gap:8px}
  .seg .opt{flex:1;border:2px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;transition:.15s;font-weight:600}
  .seg .opt.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark)}
  .seg .opt .em{font-size:26px;display:block;margin-bottom:4px}
  textarea,input[type=text],input[type=date],select{font-family:inherit;font-size:14px;border:1px solid var(--border);
        border-radius:var(--radius-s);padding:9px 11px;width:100%;background:#fff;color:var(--text)}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--primary)}
  textarea{resize:vertical;min-height:120px}

  /* preview editable list */
  .pv{border:1px solid var(--border);border-radius:var(--radius-s);padding:12px;margin-bottom:10px;background:#fff}
  .pv .pv-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .pv .pv-field{margin-bottom:7px}
  .pv .pv-field label{display:block;font-size:11px;color:var(--text-3);margin-bottom:2px;font-weight:600}

  /* deck detail */
  .mode-cards{display:flex;gap:12px;margin:14px 0}
  .mode-card{flex:1;border:2px solid var(--border);border-radius:var(--radius);padding:20px 14px;text-align:center;cursor:pointer;transition:.15s;font-weight:700;font-size:15px}
  .mode-card:hover{border-color:var(--primary)}
  .mode-card.m1{background:var(--primary-light)} .mode-card.m2{background:var(--green-light)}
  .mode-card .em{font-size:32px;display:block;margin-bottom:6px}
  .tabs2{display:flex;gap:4px;background:#eef2f7;border-radius:10px;padding:4px;margin-bottom:12px}
  .tabs2 .t{flex:1;text-align:center;padding:8px;font-size:13px;font-weight:600;color:var(--text-3);border-radius:7px;cursor:pointer}
  .tabs2 .t.active{background:#fff;color:var(--text);box-shadow:var(--shadow)}
  .tabs2.t4 .t{padding:8px 4px;font-size:12px;white-space:nowrap}

  /* 🎲 蒙题标记 */
  .guess-bar{display:flex;align-items:center;gap:11px;padding:11px 14px;margin:2px 0 10px;cursor:pointer;
             border:2px dashed #fcd34d;border-radius:var(--radius-s);background:#fffbeb;transition:.12s;user-select:none}
  .guess-bar:hover{border-color:var(--orange)}
  .guess-bar.on{border-style:solid;border-color:var(--orange);background:#fef3c7}
  .guess-bar .gb-box{width:22px;height:22px;flex-shrink:0;border-radius:6px;border:2px solid #fcd34d;background:#fff;
             display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff}
  .guess-bar.on .gb-box{background:var(--orange);border-color:var(--orange)}
  .guess-bar .gb-tx{display:flex;flex-direction:column;line-height:1.45}
  .guess-bar .gb-tx b{font-size:14px;color:#92400e}
  .guess-bar .gb-tx i{font-style:normal;font-size:11px;color:#b45309;opacity:.85}
  .badge.bd-guess{background:#fef3c7;color:#b45309}
  .q-result.lucky{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
  .q-result.lucky .lk-sub{font-weight:600;font-size:12px;opacity:.85;margin-top:3px}
  .guess-tip{background:#fffbeb;border:1px solid #fde68a;border-radius:var(--radius-s);
             padding:11px 13px;font-size:13px;line-height:1.7;color:#92400e;margin-bottom:10px}

  .li{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fff;border-radius:var(--radius-s);
      box-shadow:var(--shadow);margin-bottom:8px;gap:10px;cursor:pointer}
  .li.sel{cursor:default}
  .li .lt{flex:1;min-width:0}
  .li .lt .a{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .lt .b{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .lt .a-line{display:flex;align-items:center;gap:6px}
  .li .lt .a-line .a{flex:1;min-width:0}
  .li-badges{display:inline-flex;align-items:center;gap:4px;flex-shrink:0;flex-wrap:wrap}
  .li .lt img{height:18px;width:auto;vertical-align:-4px;border-radius:3px;margin:0 3px;display:inline-block}
  .li .lt br{display:none}
  /* 定位跳转：卡片闪绿 2 秒凸显 */
  .li.flash-green{animation:flashGreen 2s ease;box-shadow:0 0 0 3px var(--green),var(--shadow)}
  @keyframes flashGreen{0%{background:#fff}25%{background:#dcfce7}50%{background:#bbf7d0}75%{background:#dcfce7}100%{background:#fff}}

  /* study flashcard */
  .flashcard{background:#fff;border-radius:18px;min-height:240px;box-shadow:var(--shadow-md);
             display:flex;align-items:center;justify-content:center;padding:34px 26px;text-align:center;cursor:pointer;
             user-select:none;transition:transform .3s;position:relative}
  .flashcard{overflow:auto}
  .flashcard .face{font-size:19px;font-weight:700;line-height:1.7;white-space:pre-wrap;word-break:break-word;width:100%}
  .flashcard .face img{max-width:100%;max-height:44vh;height:auto;border-radius:10px;display:block;margin:10px auto;box-shadow:var(--shadow)}
  .flashcard .hint{position:absolute;bottom:14px;left:0;right:0;font-size:12px;color:var(--text-3)}
  .flashcard.flipped{background:linear-gradient(135deg,#eff6ff,#faf5ff)}
  /* 正面(问题)与背面(答案)区分字号 / 行高；LaTeX 公式随字体 1em 缩放 */
  .flashcard.flipped .face{font-size:18px;font-weight:600;line-height:1.8}
  .flashcard .face .katex,.split-pane .face .katex{font-size:1em}
  .feedback{display:flex;gap:10px;margin-top:14px}
  .feedback .fb{flex:1;border:none;border-radius:var(--radius-s);padding:13px;font-size:14px;font-weight:700;cursor:pointer;color:#fff}
  .fb-forgot{background:var(--red)} .fb-hard{background:var(--orange)} .fb-easy{background:var(--green)}
  /* 卡面 / 刷题：左右切换按钮 */
  .nav-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
  .nav-row .btn{flex:1;justify-content:center}
  .nav-row .nav-mid{flex:0 0 auto;min-width:72px;text-align:center;font-size:13px;color:var(--text-3);font-weight:700}
  /* 分栏对照模式：PC / 平板大屏左右分屏，手机竖屏上下堆叠 */
  .split-card{display:flex;gap:14px;align-items:stretch;margin-top:4px}
  .split-pane{flex:1;min-width:0;background:#fff;border-radius:14px;padding:20px 16px;box-shadow:var(--shadow-md);display:flex;flex-direction:column}
  .split-pane .split-h{font-size:12px;font-weight:800;color:var(--text-3);letter-spacing:.04em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .split-pane.ans .split-h{color:var(--primary)}
  .split-pane .face{font-size:18px;font-weight:700;line-height:1.6;white-space:pre-wrap;word-break:break-word;width:100%;flex:1}
  .split-pane.ans .face{font-size:16px;font-weight:600;line-height:1.85}
  .split-pane .face img{max-width:100%;max-height:42vh;height:auto;border-radius:10px;display:block;margin:10px auto;box-shadow:var(--shadow)}
  @media (max-width:767px){ .split-card{flex-direction:column} .split-pane{min-height:150px} }
  /* 分栏对照：答案初始关闭（空白），点击翻转为背面答案 */
  .split-pane.closed{cursor:pointer;border:2px dashed var(--border);
    background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 12px,#f1f5f9 12px,#f1f5f9 24px)}
  .split-pane.closed .split-h{color:var(--text-3)}
  .split-pane.ans.open{cursor:default}
  .split-tip{font-weight:700;font-size:11px;color:var(--primary);opacity:.85;margin-left:4px}
  .split-closed{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;flex:1;
    color:var(--text-3);text-align:center;user-select:none;padding:18px 0}
  .split-closed .sc-em{font-size:34px;opacity:.45}
  .split-closed .sc-t{font-size:14px;font-weight:700}

  /* PC（≥768px）：卡片左右等分双栏、宽度自适应并限制最大宽度；按钮横向紧凑排布，清除多余空白 */
  @media (min-width:768px){
    .flashcard{max-width:680px;margin-inline:auto}     /* 自适应带宽 + 限制最大宽度，居中 */
    .split-card{max-width:780px;margin-inline:auto}     /* 与 .app 容器对齐，双栏等宽 */
    .split-pane{min-height:200px}                        /* 单行短文本也保留上下留白 */
    /* 评级 / 切换按钮：横向紧凑排布，不再拉伸占满，去掉多余间隙 */
    .feedback{justify-content:center;flex-wrap:wrap}
    .feedback .fb{flex:0 0 auto;padding:11px 22px}
    .feedback .fb-fav{margin-left:0}
    .nav-row{justify-content:center;flex-wrap:wrap}
    .nav-row .btn{flex:0 0 auto;min-width:132px}
    .nav-row .nav-mid{margin:0 6px}
  }

  /* quiz */
  .q-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .q-bar{flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden}
  .q-bar>div{height:100%;background:var(--primary);transition:.3s}
  .q-done{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .q-bar.thin{height:5px}
  .q-bar.thin>div{background:var(--green)}
  .q-foot{font-size:11px;color:var(--text-3);text-align:center;line-height:1.6;margin-top:8px}
  .opt{display:flex;align-items:center;gap:12px;padding:13px 15px;border:2px solid var(--border);border-radius:var(--radius-s);
       cursor:pointer;margin-bottom:10px;font-size:15px;transition:.12s;background:#fff}
  .opt:hover{border-color:var(--primary)}
  .opt.sel{border-color:var(--primary);background:var(--primary-light)}
  .opt.correct{border-color:var(--green);background:var(--green-light)}
  .opt.wrong{border-color:var(--red);background:var(--red-light)}
  .opt .lt{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
  .opt.sel .lt{background:var(--primary);color:#fff;border-color:var(--primary)}
  .opt.correct .lt{background:var(--green);color:#fff;border-color:var(--green)}
  .opt.wrong .lt{background:var(--red);color:#fff;border-color:var(--red)}
  .analysis{background:#fffbeb;border:1px solid #fde68a;border-radius:var(--radius-s);padding:14px;font-size:14px;line-height:1.7;margin-top:6px}
  .analysis .lb{font-weight:800;color:var(--orange);display:block;margin-bottom:4px}
  /* KaTeX 公式排版微调 */
  .katex{font-size:1.04em}
  .katex-display{margin:.45em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
  .face .katex,.q-text .katex{font-size:1.06em}
  /* 标签管理 */
  .tag-rows{display:flex;flex-direction:column;gap:8px}
  .tag-row{display:flex;gap:8px;align-items:center}
  .tag-row .tag-lb{flex:1}
  .q-result{font-weight:800;padding:12px 14px;border-radius:var(--radius-s);margin-bottom:10px}
  .q-result.ok{background:var(--green-light);color:var(--green-dark)}
  .q-result.no{background:var(--red-light);color:var(--red)}
  .q-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .q-actions .btn{flex:1;min-width:120px}
  .queue-seg{display:flex;gap:6px;background:#eef2f7;border-radius:10px;padding:4px;margin-bottom:14px}
  .queue-seg .q{flex:1;text-align:center;padding:8px;font-size:12px;font-weight:600;color:var(--text-3);border-radius:7px;cursor:pointer}
  .queue-seg .q.active{background:#fff;color:var(--primary);box-shadow:var(--shadow)}

  .empty{text-align:center;padding:50px 20px;color:var(--text-3)}
  .empty .em{font-size:46px;margin-bottom:10px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;
         padding:11px 20px;border-radius:24px;font-size:14px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hidden{display:none!important}
  .chiprow{display:flex;gap:6px;flex-wrap:wrap}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
  .badge-s{background:var(--green-light);color:var(--green-dark)}
  .badge-m{background:var(--orange-light);color:#b45309}
  .badge-j{background:#ede9fe;color:#7c3aed}
  .badge-disp{background:var(--primary-light);color:var(--primary-dark)}
  .badge-w{background:var(--red-light);color:var(--red)}
  .bar-row{margin-bottom:10px}
  .bar-row .bl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .bar-row .bb{height:7px;background:var(--border);border-radius:4px;overflow:hidden}
  .bar-row .bb>div{height:100%;border-radius:4px}
  .flips{font-size:12px;color:var(--text-3);margin-top:8px;display:flex;align-items:center;gap:6px}
  /* 默写展示模式 */
  .disp-seg{display:flex;gap:6px;align-items:center;background:#eef2f7;border-radius:10px;padding:4px;margin-bottom:12px;flex-wrap:wrap}
  .disp-seg .q{flex:0 0 auto;text-align:center;padding:8px 12px;font-size:12px;font-weight:600;color:var(--text-3);border-radius:7px;cursor:pointer}
  .disp-seg .q.active{background:#fff;color:var(--primary);box-shadow:var(--shadow)}
  .occlude-wrap{position:relative;width:100%}
  .occlude-mask{position:absolute;left:0;right:0;bottom:0;background:repeating-linear-gradient(45deg,#e2e8f0,#e2e8f0 12px,#cbd5e1 12px,#cbd5e1 24px);
    border-top:2px dashed #94a3b8;cursor:grab}
  .occlude-handle{position:absolute;right:6px;top:-13px;background:#475569;color:#fff;font-size:9px;font-weight:700;padding:2px 8px;border-radius:12px;user-select:none;touch-action:none;white-space:nowrap}
  .occlude-ctrls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;justify-content:center}
  .self-box{width:100%;margin-top:14px;text-align:left}
  .self-box textarea{width:100%;font-size:15px;line-height:1.6}
  .self-box .btn{margin-top:10px}
  .self-ans{font-size:14px;line-height:1.6;color:var(--text-2);background:#f8fafc;border-radius:8px;padding:8px 10px}
  .self-res{margin-top:10px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px}
  .self-res.pass{border-color:var(--green)}
  .self-res.fail{border-color:var(--orange)}
  .self-verdict{font-weight:800;font-size:14px;margin-bottom:8px;color:var(--text)}
  .self-res.pass .self-verdict{color:var(--green-dark)}
  .self-res.fail .self-verdict{color:#b45309}
  .kw-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .kw{font-size:12px;padding:3px 9px;border-radius:20px;font-weight:600}
  .kw.hit{background:var(--green-light);color:var(--green-dark)}
  .kw.miss{background:#f1f5f9;color:var(--text-3);text-decoration:line-through}
  .self-full{font-size:14px;line-height:1.6;color:var(--text-2)}
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-mask.show{display:flex}
  .modal-mask.lvl2{z-index:95}
  .modal{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:22px;max-height:86vh;overflow-y:auto}
  .modal-title{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px}
  .modal-actions{display:flex;gap:10px;margin-top:16px}
  .modal-actions .btn{flex:1;justify-content:center}
  .modal .pv-field{margin-bottom:12px}
  .modal .pv-field label{display:block;font-size:12px;color:var(--text-3);margin-bottom:4px;font-weight:600}
  .modal .pv-field textarea,.modal .pv-field select,.modal .pv-field input[type=text]{width:100%;box-sizing:border-box}
  .qe-opt{display:block;font-size:14px;margin:5px 0;cursor:pointer}
  .cfg-types{display:flex;flex-direction:column;gap:2px;margin-top:2px;padding-left:4px}
  .li-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
  .li-badge{display:inline-flex;align-items:center;gap:2px;background:var(--primary-light);color:var(--primary-dark);border:none;border-radius:20px;font-size:12px;font-weight:600;padding:2px 9px;cursor:pointer}
  .li-badge:active{transform:scale(.97)}
  .li-note{margin-top:4px;font-size:12px;color:var(--text-2);background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:5px 9px;line-height:1.5;word-break:break-word}

  /* ===== 底部「更多操作」面板（手机友好的统一入口） ===== */
  .sheet-mask{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:120;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
  .sheet-mask.show{opacity:1;visibility:visible}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:121;background:#fff;border-radius:18px 18px 0 0;
    padding:8px 12px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s;max-height:82vh;overflow-y:auto;
    pointer-events:none;visibility:hidden}
  .sheet.show{transform:translateY(0);pointer-events:auto;visibility:visible}
  .sheet-hd{text-align:center;font-size:13px;color:var(--text-3);font-weight:700;padding:14px 0 10px;position:relative}
  .sheet-hd::before{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:2px;background:#cbd5e1}
  .sheet-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:none;
    padding:14px 10px;font-size:15px;font-weight:600;color:var(--text);cursor:pointer;border-radius:12px;font-family:inherit}
  .sheet-item:active{background:#f1f5f9}
  .sheet-item .si-ic{flex-shrink:0;width:24px;text-align:center;font-size:18px}
  .sheet-item .si-lb{flex:1;min-width:0}
  .sheet-item .si-sub{display:block;font-size:12px;font-weight:400;color:var(--text-3);margin-top:1px}
  .sheet-item.danger{color:var(--red)}
  .sheet-divider{height:1px;background:var(--border);margin:4px 2px}
  .sheet-cancel{margin-top:8px;color:var(--text-2)}
  /* PC 端：底部长条菜单改为居中紧凑弹窗，功能选项横向排布（卡片式网格），点弹窗外关闭 */
  @media (min-width:681px){
    .sheet-mask{background:rgba(15,23,42,.35);backdrop-filter:blur(2px)}
    .sheet{left:50%;right:auto;bottom:auto;top:50%;width:auto;max-width:min(560px,92vw);
      max-height:84vh;overflow-y:auto;padding:18px 18px 16px;border-radius:18px;
      box-shadow:0 24px 60px rgba(15,23,42,.28);transform:translate(-50%,-50%) scale(.96);opacity:0;
      visibility:hidden;transition:transform .18s ease,opacity .18s ease,visibility .18s ease}
    .sheet.show{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible}
    .sheet-hd{padding:0 0 12px;margin-bottom:10px;border-bottom:1px solid var(--border);
      text-align:center;font-size:14px}
    .sheet-hd::before{display:none}                 /* 隐藏移动端拖拽条 */
    .sheet-list{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .sheet-item{flex-direction:column;align-items:center;text-align:center;gap:7px;
      width:96px;padding:14px 6px;font-size:13px;border:1px solid var(--border);border-radius:14px;
      background:#fff;transition:background .12s,border-color .12s,transform .08s;flex:0 0 auto}
    .sheet-item:hover{background:#f8fafc;border-color:var(--primary);transform:translateY(-1px)}
    .sheet-item:active{background:#eef2ff;transform:translateY(0)}
    .sheet-item .si-ic{width:auto;font-size:24px;line-height:1}
    .sheet-item .si-lb{flex:none;line-height:1.35}
    .sheet-item .si-sub{margin-top:2px;font-size:11px}
    .sheet-divider{width:100%;height:1px;margin:2px 0}
    .sheet-cancel{display:none}                      /* PC 端依赖点弹窗外关闭，去掉冗余按钮 */
  }
  .topbar .tabs{flex:1;min-width:0}
  .top-actions{flex-shrink:0;gap:6px}

  /* 存储管理 */
  .sg-bar{height:10px;border-radius:20px;background:#e2e8f0;overflow:hidden}
  .sg-bar>div{height:100%;border-radius:20px;transition:width .2s}
  .sg-bar.ok>div{background:var(--green)} .sg-bar.warn>div{background:var(--orange)} .sg-bar.danger>div{background:var(--red)}
  .sg-warn{background:var(--red-light);border:1px solid #fecaca;color:#b91c1c;border-radius:var(--radius-s);
           padding:9px 11px;font-size:12px;line-height:1.6;margin-top:9px}
  .sg-list{max-height:190px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-s);padding:4px 6px}
  .sg-row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dashed var(--border);font-size:13px}
  .sg-row:last-child{border-bottom:none}
  .sg-nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .sg-nm i{font-style:normal;color:var(--text-3);font-weight:400;font-size:11px;margin-left:6px}
  .sg-sz{color:var(--text-2);font-variant-numeric:tabular-nums;font-size:12px;flex-shrink:0}
  .img-gone{display:inline-block;padding:1px 7px;border-radius:5px;background:#f1f5f9;color:var(--text-3);font-size:12px}

  /* ===== 规划看板 ===== */
  .plan-sec{margin-bottom:18px}
  .plan-sec .ph{font-size:13px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin:4px 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .plan-sec .ph .btn-sm{padding:4px 10px;font-size:12px;text-transform:none;letter-spacing:0}
  .plan-empty{color:var(--text-3);font-size:13px;text-align:center;padding:18px 0}
  /* 倒计时 */
  .cd-grid{display:flex;flex-direction:column;gap:10px}
  .cd-card{border-radius:var(--radius-s);padding:12px 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1px solid #e0e7ff}
  .cd-card .cd-num{font-size:28px;font-weight:800;line-height:1;color:var(--primary-dark);min-width:70px;text-align:center}
  .cd-card .cd-num small{font-size:12px;font-weight:600;display:block;color:var(--text-3);margin-top:3px}
  .cd-card .cd-info{flex:1;min-width:0}
  .cd-card .cd-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cd-card .cd-date{font-size:12px;color:var(--text-3);margin-top:2px}
  .cd-card.soon{background:linear-gradient(135deg,#fef2f2,#fff7ed);border-color:#fecaca}
  .cd-card.soon .cd-num{color:var(--red)}
  .cd-card.near{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fde68a}
  .cd-card.near .cd-num{color:#b45309}
  .cd-card .cd-acts{display:flex;gap:4px;flex-shrink:0}
  /* 目标进度 */
  .goal-row{margin-bottom:14px}
  .goal-row:last-child{margin-bottom:0}
  .goal-row .gr-h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .goal-row .gr-h b{font-weight:700}
  .goal-row .gr-sub{font-size:12px;color:var(--text-3);margin-top:5px}
  .goal-row .gr-sub.ok{color:var(--green-dark);font-weight:600}
  .goal-row.gr-off{opacity:.62}
  .goal-row.gr-off .gr-h b{font-weight:600;color:var(--text-3)}
  /* 日历 */
  .cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-hd .m{font-size:15px;font-weight:800}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-dow{text-align:center;font-size:11px;color:var(--text-3);font-weight:700;padding-bottom:2px}
  .cal-cell{position:relative;aspect-ratio:1/1;border-radius:8px;background:#f8fafc;border:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;transition:.12s;overflow:hidden}
  .cal-cell:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .cal-cell.out{color:var(--text-3);opacity:.4;background:transparent;border-color:transparent;cursor:default}
  .cal-cell.today{outline:2px solid var(--primary);outline-offset:-2px}
  .cal-cell.streak{box-shadow:inset 0 0 0 2px var(--orange)}
  .cal-cell.lv1{background:#dcfce7}
  .cal-cell.lv2{background:#86efac;color:#14532d}
  .cal-cell.lv3{background:#4ade80;color:#052e16}
  .cal-cell.lv4{background:#16a34a;color:#fff}
  .cal-cell .cal-cnt{font-size:9px;font-weight:700;line-height:1;margin-top:2px;opacity:.9}
  .cal-cell.sel{outline:2px solid var(--primary-dark);outline-offset:-2px}
  .cal-legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--text-3);margin-top:10px}
  .cal-legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
  .cal-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .cal-sum .s{background:#fff;border-radius:var(--radius-s);padding:10px;text-align:center;box-shadow:var(--shadow)}
  .cal-sum .s .n{font-size:20px;font-weight:800;color:var(--primary)}
  .cal-sum .s .l{font-size:11px;color:var(--text-3);margin-top:2px}
  .cal-detail{margin-top:12px;background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 12px;font-size:13px;line-height:1.7}
  .cal-detail b{color:var(--primary-dark)}
  /* ===== 规划 / 诊断 共用头部 ===== */
  .plan-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 14px;flex-wrap:wrap}
  .plan-head h2{font-size:19px;margin:0}
  .plan-actions{display:flex;gap:8px;flex-wrap:wrap}
  /* ===== 薄弱知识点诊断 ===== */
  .diag-ov{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 16px}
  .diag-ov-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
  .diag-ov-item .n{font-size:22px;font-weight:800}
  .diag-ov-item .l{font-size:12px;color:var(--text-3);margin-top:2px}
  .diag-section{margin:18px 0}
  .sub-addbar{display:flex;gap:8px;margin:0 0 8px}
  .sub-addbar .btn{flex:1;justify-content:center}
  .sprint-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .sprint-actions .btn{flex:1;justify-content:center;padding:9px 18px;font-size:14px}
  .sprint-bottom-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .sprint-bottom-actions .btn{flex:1;justify-content:center;padding:9px 14px;font-size:14px}
  .diag-section h3{font-size:15px;margin:0 0 10px}
  .diag-ch{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .diag-ch-hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .diag-ch-name{font-weight:700;font-size:15px}
  .diag-ch-meta{font-size:12px;color:var(--text-3);margin:6px 0 8px}
  .diag-type{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .diag-type-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
  .diag-type .reco{font-size:12px;color:var(--primary-dark);background:var(--primary-light);border-radius:8px;padding:6px 10px;margin-top:8px;line-height:1.6}
  .weak-list{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .weak-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px}
  .weak-row:last-child{border-bottom:none}
  .weak-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .weak-acc{font-weight:700;color:var(--primary-dark);white-space:nowrap}
  .stars{letter-spacing:1px;font-size:15px}
  .stars.sm{font-size:13px}
  .deck-star{font-size:12px;letter-spacing:0;margin-left:4px;vertical-align:1px}

<!-- 内嵌数据种子：默认空；用「下载含数据文件」生成的副本会在此写入记录，localStorage 失效时也能恢复 -->
<script type="application/json" id="embedded-db"></script>
<div class="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="row" style="gap:8px;width:100%">
      <div class="tabs">
        <div class="tab active" data-view="home" onclick="go('home',false)">首页</div>
        <div class="tab" data-view="fav" onclick="go('fav')">收藏</div>
        <div class="tab" data-view="stats" onclick="go('stats')">统计</div>

        <button class="btn btn-ghost btn-sm" onclick="openSync()" title="云端同步">☁ 同步</button>
        <button class="btn btn-ghost btn-sm" onclick="openMemo()" title="今日备忘录">📝 备忘</button>
      </div>
    </div>
  </div>

  <!-- 存储状态横幅：localStorage 不可用时提示导出数据，避免记录丢失 -->
  <div class="store-banner" id="store-banner">
    <span>⚠️ <b>当前环境无法自动保存</b>：浏览器本地存储被禁用（预览/隐私模式/跨域打开）。你的记录只存在本次会话，<b>关闭即丢失</b>。用「下载含数据文件」存一份到本地，下次双击打开它即可继续。</span>
    ${''}
    <button class="btn" id="bn-dump" onclick="downloadSelfHTML()">⬇ 下载含数据文件</button>

  <!-- GLOBAL SEARCH -->

  <div class="main">

<script>
/* =================== DATA LAYER =================== */
const LS_KEY='memoryCardDB_v1';
/* —— 安全存储层 ——
   浏览器本地存储（localStorage）在「预览/沙箱 iframe、隐私模式、跨域签名链接打开、
   配额超限」等情况下会被禁用或关闭即清，导致记录“没保存”。本层做可用性探测，
   不可用时置 storageAvailable()=false 并显示横幅，引导用户用「导出/导入/下载含数据文件」兜底。 */
let _storageOK=null;          // 探测结果（null=尚未探测）
let _quotaHit=false;          // 是否曾因配额超限写不进去
let _saveWarned=false;        // 是否已提示过「无法自动保存」，避免反复弹
function testStorage(){
  try{const k='__mc_st_test__',v='1';localStorage.setItem(k,v);const ok=localStorage.getItem(k)===v;localStorage.removeItem(k);return ok;}
  catch(e){return false;}
}
function storageAvailable(){
  if(_storageOK===null)_storageOK=testStorage();
  return _storageOK;
}
function rawGet(key){
  if(storageAvailable()){ try{return localStorage.getItem(key);}catch(e){} }
  return null;
}
function rawSet(key,val){
  if(storageAvailable()){
    try{localStorage.setItem(key,val);return true;}
    catch(e){
      if(/quota|quotaexceeded/i.test(e&&(e.name||e.message||'')||'')){_storageOK=false;_quotaHit=true;refreshStoreStatus();}
      else{_storageOK=false;}
      return false;
    }
  }
  return false;
}
function rawRemove(key){ if(storageAvailable()){ try{localStorage.removeItem(key);}catch(e){} } }
/* 尝试从内嵌种子读取（用于「下载含数据 HTML」后重新打开的场景，localStorage 失效也能恢复） */
function embeddedSeed(){
  try{const el=document.getElementById('embedded-db');if(el&&el.textContent&&el.textContent.trim())return JSON.parse(el.textContent);}catch(e){}
  return null;
}
let DB=loadDB();
function loadDB(){
  let d=null;
  try{const s=rawGet(LS_KEY);if(s)d=JSON.parse(s);}catch(e){}
  if(!d){ try{d=embeddedSeed();}catch(e){} }   // localStorage 不可用 / 空时，回退到内嵌种子
  if(d){
    // ensure fields
    d.decks=d.decks||[];d.folders=d.folders||[];d.meta=d.meta||{streak:0,lastStudy:null,quizDays:{}};
    // 规划看板字段兼容旧数据
    d.meta.cardDays=d.meta.cardDays||{};            // {YYYY-MM-DD: 当日背诵卡片数}
    d.meta.exams=d.meta.exams||[];                  // 旧字段：[{id,name,date}]（migratePlans 后清空）
    d.meta.goals=d.meta.goals||null;                // 旧字段：{cards,quiz}（migratePlans 后清空）
    // 多备考计划（取代单一 goals + 多 exams）
    d.meta.plans=d.meta.plans||[];
    d.meta.backlog=d.meta.backlog||{cards:0,quiz:0};
    d.meta.lastSettle=d.meta.lastSettle||null;      // 配额缓冲结算游标（最后结算到的日期）
    d.meta.planTomorrow=d.meta.planTomorrow||{cards:[],questions:[]}; // 次日复习计划：薄弱知识点 id
    d.meta.memos=d.meta.memos||{};                   // 每日学习备忘录：{YYYY-MM-DD: 文本}
    d.meta.tags=d.meta.tags||[];                     // 自定义卡片标签（空则用默认种子）
    migratePlans(d);                                 // 旧 exams/goals → plans 一次性迁移
    // 蒙题字段兼容旧数据
    d.decks.forEach(dk=>{ if(dk.cycle===undefined)dk.cycle='standard'; (dk.questions||[]).forEach(q=>{
      if(q.guess===undefined)q.guess=false;
      if(q.guessCount===undefined)q.guessCount=0;
      if(q.guessRight===undefined)q.guessRight=0;
    });
    (dk.cards||[]).forEach(c=>{ if(c.links===undefined)c.links=[]; if(c.note===undefined)c.note=''; if(c.ext===undefined)c.ext=''; });});
    return d;
  }
  return {decks:[],folders:[],meta:{streak:0,lastStudy:null,quizDays:{},cardDays:{},planTomorrow:{cards:[],questions:[]},sprintPinned:{cards:[],questions:[]},plans:[],backlog:{cards:0,quiz:0},lastSettle:null,memos:{}}};
}
/* 兼容旧数据：把单一 goals + 多 exams 合并成多套独立备考计划 plans。
   每个旧 exam → 一套「只有倒计时、不设每日目标」的计划（目标可不填，避免多套考试把目标累加翻倍）；
   旧 goals 里真实填过的数字 → 单独一套「通用每日目标」（无日期）承载。
   迁移完成后清空旧字段，避免下次加载重复迁移。 */
const PLAN_COLORS=['#6366f1','#0ea5e9','#f59e0b','#10b981','#ef4444','#8b5cf6'];
function migratePlans(d){
  const m=d.meta;
  if(m.plans&&m.plans.length)return;            // 已有计划，跳过
  const plans=[];
  (m.exams||[]).forEach((e,i)=>{
    if(e&&e.name)plans.push({id:e.id||uid(),name:e.name,date:e.date||null,cards:0,quiz:0,color:PLAN_COLORS[i%PLAN_COLORS.length]});
  });
  const g=m.goals||{};
  if(g.cards||g.quiz){                           // 只迁移用户真正设过的那项，另一项留空=不设置
    plans.push({id:uid(),name:'通用每日目标',date:null,cards:g.cards||0,quiz:g.quiz||0,color:'#64748b'});
  }
  if(plans.length)m.plans=plans;
  m.exams=[];m.goals=null;                         // 迁移后清除旧字段
}
function save(){DB.meta.savedAt=now();
  const ok=rawSet(LS_KEY,JSON.stringify(DB));
  if(ok){
    _saveWarned=false; _dirtyForDump=false;
    scheduleSync();
  }else{
    // 写不进本地：可能是配额超限，也可能是当前环境禁用存储（预览 / 隐私模式 / 跨域）
    _dirtyForDump=true;
    refreshStoreStatus();
    if(!_saveWarned){
      if(_quotaHit) toast('⚠️ 本机存储已满，请压缩或清理图片；或点「下载含数据文件」留底');
      else toast('⚠️ 当前环境无法自动保存，已为你准备好「含数据的文件」，关闭前会自动下载，重开该文件即可继续');
      _saveWarned=true;
    }
  }
  // 若已锁定本文件（file:// 场景），把数据写回文件自身，重开文件即恢复
  if(_fileHandle){ rewriteFile().catch(()=>{}); }
  // 受限环境兜底：本地存不进时，自动下载含数据的文件
  if(!storageAvailable()) scheduleDump();
}
/* 本机占用（图片会明显增大体积） */
function storageMB(){try{return (storageBytes()/1048576).toFixed(2);}catch(e){return '0.00';}}
function storageBytes(){try{return (rawGet(LS_KEY)||'').length;}catch(e){return 0;}}
const LS_QUOTA=5*1024*1024;   // 浏览器 localStorage 常见上限 ≈5MB

/* =================== 自动备份 =================== */
/* 每 10 分钟 + 切到后台 + 关闭页面时，把当前数据写入独立的备份键；
   页面崩溃 / 误删数据也能从历史快照一键恢复。仅在数据有变化时才存，避免无谓占用。 */
const BACKUP_KEY='memoryCardDB_v1_backups';
const BACKUP_MAX=30;                               // 循环保留最近 30 个快照
function loadBackups(){try{const s=rawGet(BACKUP_KEY);const a=s?JSON.parse(s):[];return Array.isArray(a)?a:[];}catch(e){return [];}}
function dbSig(obj){
  const o=obj||DB;const c=JSON.parse(JSON.stringify(o));   // 排除每次 save 写入的易变字段，否则“无变化”永远判定为变化
  if(c.meta){delete c.meta.savedAt;delete c.meta.lastBackup;}
  const j=JSON.stringify(c);let h=0;for(let i=0;i<j.length;i++){h=(h*31+j.charCodeAt(i))|0;}return j.length+':'+h;
}
function autoBackup(opts){
  opts=opts||{};
  const sig=dbSig();
  if(sig===autoBackup._last)return;                // 数据无变化，跳过（省空间）
  autoBackup._last=sig;
  const list=loadBackups();
  list.push({t:now(),data:JSON.parse(JSON.stringify(DB))});
  while(list.length>BACKUP_MAX)list.shift();
  try{rawSet(BACKUP_KEY,JSON.stringify(list));}catch(e){}
  DB.meta.lastBackup=now();save();
  const el=document.getElementById('backup-status');
  if(el)el.textContent=backupStatusText();
  if(opts.toast)toast('💾 已自动备份');
}
autoBackup._last=null;
function backupStatusText(){const t=DB.meta.lastBackup;return t?('已自动备份 · '+fmtTime(t)):'尚未备份';}
function fmtTime(ts){const d=new Date(ts);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function fmtDateTime(ts){const d=new Date(ts);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+' '+fmtTime(ts);}
function openBackupCenter(){
  const list=loadBackups().slice().reverse();
  const items=list.map((b,i)=>{
    const realIdx=list.length-1-i;                       // 倒序后的真实下标
    const cardsN=(b.data.decks||[]).reduce((s,d)=>s+(d.cards?d.cards.length:0),0);
    const quizN=(b.data.decks||[]).reduce((s,d)=>s+(d.questions?d.questions.length:0),0);
    return `<div class="li"><div class="lt"><div class="a">${fmtDateTime(b.t)}</div>
      <div class="b">卡组 ${b.data.decks?b.data.decks.length:0} 个 · 卡片 ${cardsN} 张 · 题目 ${quizN} 道</div></div>
      <div class="li-actions"><button class="btn btn-outline btn-sm" onclick="restoreBackup(${realIdx})">↩ 恢复</button></div></div>`;
  }).join('');
  document.getElementById('modal-body').innerHTML=`
    <div class="modal-title">💾 备份与恢复</div>
    <div class="plan-sec-note">本地每 <b>10 分钟</b>自动备份一次，切到后台 / 关闭页面时也会立即备份，最多保留最近 <b>${BACKUP_MAX}</b> 份快照。页面崩溃或误删数据时可从此处一键恢复。</div>
    <div class="row between" style="margin:10px 0">
      <span class="muted"><span class="store-status-dot ${storageAvailable()?'ok':'bad'}"></span>${storageAvailable()?'本地存储正常':'⚠️ 本地存储不可用，请用下方导出留底'}</span>
      <button class="btn btn-primary btn-sm" onclick="autoBackup({toast:true});openBackupCenter()">💾 立即备份</button></div>
    <div class="row" style="gap:8px;margin:0 0 12px;flex-wrap:wrap">
      <button class="btn btn-outline btn-sm" onclick="exportRecords()">⬇ 导出记录(JSON)</button>
      <button class="btn btn-outline btn-sm" onclick="importRecords()">⬆ 导入记录</button>
      <button class="btn btn-outline btn-sm" onclick="downloadSelfHTML()">⬇ 下载含数据文件</button>
      ${fsaAvailable()?`<button class="btn btn-primary btn-sm" onclick="lockToFile()">${_fileHandle?'🔒 已锁定本文件（自动写回）':'🔒 锁定本文件自动保存'}</button>`:''}
    </div>
    <div class="plan-sec-note" style="margin-bottom:10px">若从<b>预览 / 隐私模式 / 跨域链接</b>打开，浏览器可能禁止本地存储——记录只存在本次会话。<b>导出记录</b>或<b>下载含数据文件</b>可把数据带走，换设备 / 重开后导入即可恢复。</div>
    ${list.length?`<div class="li-list">${items}</div>`:'<div class="empty"><div class="em">📭</div>还没有备份快照</div>'}
    <div class="modal-actions"><button class="btn btn-danger btn-sm" onclick="clearBackups()">清空所有备份</button><button class="btn btn-ghost" onclick="hideModal()">关闭</button></div>`;
  showModal();
}
function restoreBackup(idx){
  const list=loadBackups();const b=list[idx];if(!b){toast('备份不存在');return;}
  if(!confirm('恢复到 '+fmtDateTime(b.t)+' 的备份？当前未备份的改动将被覆盖。'))return;
  DB=b.data;save();autoBackup._last=dbSig();
  hideModal();go('home');toast('✅ 已恢复到该备份');
}
function clearBackups(){
  if(!confirm('确定清空全部本地备份？此操作不可撤销。'))return;
  rawRemove(BACKUP_KEY);autoBackup._last=null;
  hideModal();toast('已清空备份');
}

/* ============ 记录兜底：导出 / 导入 / 下载含数据 HTML ============ */
/* 当本地存储不可用时（预览 iframe、隐私模式、跨域打开、配额超限），
   以上三种方式保证「记录永不丢失」：可随时导出，再在任意环境导入恢复。 */
function exportRecords(){
  try{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='记忆卡记录-'+todayKey()+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('✅ 已导出记录文件，请妥善保存');
  }catch(e){ toast('导出失败：'+e.message); }
}
function importRecords(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{
        const d=JSON.parse(r.result);
        if(!d||!Array.isArray(d.decks))throw new Error('文件格式不正确');
        if(!confirm('导入将覆盖当前所有记录，确定继续？'))return;
        DB=d;save();autoBackup._last=dbSig();
        hideModal();go('home');renderHome();refreshStoreStatus();
        toast('✅ 已导入记录');
      }catch(e){ toast('导入失败：'+e.message); } };
    r.onerror=()=>toast('读取失败');
    r.readAsText(f);
  };
  inp.click();
}
/* 把当前数据烘焙进 HTML，生成「自包含」副本：即使 localStorage 失效，双击该文件也能看到记录 */
/* 把当前数据烘焙进当前页面的 HTML，生成「自包含」副本源码（记录内嵌到 embedded-db）。
   downloadSelfHTML() 与 FSA 写回文件共用此函数。 */
function buildSelfHTML(){
  let html=document.documentElement.outerHTML;
  let payload=JSON.stringify(DB).replace(/<\/script>/gi,'<\\/script>');
  const seedTag='<script type="application/json" id="embedded-db">'+payload+'<\/script>';
  if(/<script type="application\/json" id="embedded-db">/.test(html)){
    html=html.replace(/<script type="application\/json" id="embedded-db">[\s\S]*?<\/script>/,seedTag);
  }else{
    html=html.replace('</body>',seedTag+'\n</body>');
  }
  return html;
}
function downloadSelfHTML(){
  try{
    const html=buildSelfHTML();
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='记忆卡-含数据-'+todayKey()+'.html';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('✅ 已下载「含数据的 HTML」，双击即可使用（记录已内嵌）');
  }catch(e){ toast('生成失败：'+e.message); }
}

/* =================== 跨刷新持久化（关键修复） =================== */
/* 退出重进数据被清空的根因：受限环境（预览 iframe / 隐私模式 / 跨域签名链接）下
   localStorage 写入「看似成功」但刷新即被清、或根本被禁用，导致记录无法跨会话保留。
   三重保险：
   1) localStorage —— 普通浏览器/https 下可靠，作为快速缓存（已保留）。
   2) File System Access API 写回文件自身 —— 以 file:// 打开本文件时，把数据写回文件，
      重开该文件即恢复（最稳，适配「把本页当 App 用」的场景）。
   3) 自包含文件兜底 —— 当上述都不可用，每次变更后自动下载「含数据的 HTML」，
      用户双击该文件即可继续用，数据不再因刷新而丢失。 */
let _fileHandle=null;          // FSA 文件句柄（已锁定本文件时有效）
let _dirtyForDump=false;       // 受限环境下是否存在未落盘的改动
let _dumpedThisSession=false;  // 本次会话是否已自动下载过兜底文件（避免重复打扰）
let _dumpTimer=null;

function fsaAvailable(){ return typeof window!=='undefined' && !!(window.showOpenFilePicker||window.showSaveFilePicker); }

/* —— IndexedDB 存取 FSA 句柄（file:// 环境下可用，使句柄跨刷新保留） —— */
function _idb(kind,key,val){
  return new Promise((resolve,reject)=>{
    let r;try{ r=indexedDB.open('mc_fsa',1); }catch(e){ return reject(e); }
    r.onupgradeneeded=()=>{ try{ r.result.createObjectStore('kv'); }catch(_){} };
    r.onsuccess=()=>{
      const db=r.result;
      try{
        const tx=db.transaction('kv',kind==='get'?'readonly':'readwrite');
        const st=tx.objectStore('kv');
        let rq;
        if(kind==='get'){ rq=st.get(key); rq.onsuccess=()=>{ db.close(); resolve(rq.result); }; }
        else { st.put(val,key); tx.oncomplete=()=>{ db.close(); resolve(); }; }
        tx.onerror=()=>{ db.close(); reject(tx.error); };
      }catch(e){ db.close(); reject(e); }
    };
    r.onerror=()=>reject(r.error);
  });
}
async function restoreHandle(){
  if(!fsaAvailable())return;
  try{ const h=await _idb('get','handle'); if(h){ _fileHandle=h; } }catch(_){}
}

/* 锁定本文件：用户主动点击，取得文件句柄并存好，之后每次保存自动写回文件 */
async function lockToFile(){
  if(!fsaAvailable()){ toast('当前环境不支持「锁定文件」自动保存（请以 file:// 打开本文件，或使用支持的浏览器）'); return; }
  try{
    const opts={id:'memoryCard', types:[{description:'HTML 文件',accept:{'text/html':['.html']}}]};
    let h=null;
    if(window.showOpenFilePicker){ try{ const a=await window.showOpenFilePicker(opts); h=a&&a[0]; }catch(e){ if(e&&e.name!=='AbortError')console.warn(e); } }
    if(!h && window.showSaveFilePicker){ try{ h=await window.showSaveFilePicker(opts); }catch(e){ if(e&&e.name!=='AbortError')console.warn(e); } }
    if(!h)return;
    _fileHandle=h;
    try{ await _idb('put','handle',h); }catch(_){}
    const ok=await rewriteFile();
    toast(ok?'🔒 已锁定本文件，今后改动会自动写回，重开即恢复':'已锁定，但写回失败，请检查文件权限');
    refreshStoreStatus();
  }catch(e){ toast('锁定失败：'+(e&&e.message||e)); }
}
async function rewriteFile(){
  if(!_fileHandle)return false;
  try{
    if(_fileHandle.queryPermission){
      const perm=await _fileHandle.queryPermission({mode:'readwrite'});
      if(perm!=='granted'){ const p=await _fileHandle.requestPermission({mode:'readwrite'}); if(p!=='granted')return false; }
    }
    const w=await _fileHandle.createWritable();
    await w.write(buildSelfHTML());
    await w.close();
    _dirtyForDump=false;
    _saveWarned=false;
    return true;
  }catch(e){ return false; }
}

/* ---- 图片存储管理：统计 / 压缩 / 清理 ---- */
const IMG_RE=/data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=]+/g;
function fmtSize(n){
  if(n<1024)return n+' B';
  if(n<1048576)return Math.round(n/1024)+' KB';
  return (n/1048576).toFixed(2)+' MB';
}
function cardImages(c){
  const out=[];
  [c&&c.front,c&&c.back].forEach(s=>{const m=String(s||'').match(IMG_RE);if(m)out.push.apply(out,m);});
  return out;
}
/* 扫描全部卡片内嵌图片：总数、占用、按卡组明细、去重后的图片列表 */
function scanImages(){
  let count=0,bytes=0;const decks=[];const uniq=new Map();
  (DB.decks||[]).forEach(d=>{
    let dc=0,db=0;
    (d.cards||[]).forEach(c=>{
      cardImages(c).forEach(du=>{dc++;db+=du.length;if(!uniq.has(du))uniq.set(du,du.length);});
    });
    if(dc)decks.push({id:d.id,name:d.name,count:dc,bytes:db});
    count+=dc;bytes+=db;
  });
  decks.sort((a,b)=>b.bytes-a.bytes);
  return {count,bytes,decks,uniq:Array.from(uniq.keys())};
}
function splitJoin(s,a,b){return String(s==null?'':s).split(a).join(b);}
/* 把某张图片在所有卡片里换成新的（或删除） */
function replaceImageEverywhere(oldDU,newDU){
  let n=0;
  (DB.decks||[]).forEach(d=>(d.cards||[]).forEach(c=>{
    if(c.front&&c.front.indexOf(oldDU)>-1){c.front=splitJoin(c.front,oldDU,newDU);n++;}
    if(c.back&&c.back.indexOf(oldDU)>-1){c.back=splitJoin(c.back,oldDU,newDU);n++;}
  }));
  return n;
}
function stripImgTags(s){return String(s==null?'':s).replace(/<img[^>]*>/gi,'<span class="img-gone">[图片已清理]</span>');}
/* ---- 存储管理面板 ---- */
const CMP_LEVELS={
  high:{maxW:1000,q:0.8,label:'高清',desc:'宽 1000px · 画质 80%，几乎无损'},
  mid:{maxW:800,q:0.65,label:'标准',desc:'宽 800px · 画质 65%，手机看图足够（推荐）'},
  low:{maxW:600,q:0.5,label:'省空间',desc:'宽 600px · 画质 50%，能省一半以上'}
};
function openStorage(){

  const lvlBtns=Object.keys(CMP_LEVELS).map(k=>{

  }).join('');
  document.getElementById('modal-body').innerHTML=`

    <div class="sg-bar ${lvl}"><div style="width:${pct}%"></div></div>

    ${lvl==='danger'?'<div class="sg-warn">⚠️ 空间快满了，再存图片可能保存失败。建议先「导出备份」，再压缩或清理图片。</div>'
      :lvl==='warn'?'<div class="sg-warn" style="background:#fffbeb;border-color:#fde68a;color:#92400e">空间用了一大半，建议压缩一次图片。</div>':''}
    <div class="muted" style="font-size:12px;margin:10px 0 4px">

    <div class="sg-list">${rows}</div>
    ${st.count?`<div class="pv-field" style="margin-top:14px"><label>一键重新压缩全部图片</label>
      <div class="muted" style="font-size:12px;margin-bottom:7px">${CMP_LEVELS.mid.desc}；只有压得更小才会替换，不会越压越大。<b>不可撤销</b>，建议先导出备份。</div>
      <div class="row" style="gap:8px;flex-wrap:wrap">${lvlBtns}</div></div>`:''}
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="exportData()">⬇️ 先导出备份</button>
      <button class="btn btn-ghost" onclick="hideModal()">关闭</button>
    </div>`;
  showModal();
}
let __cmp=null;
function compressAll(levelKey){
  const L=CMP_LEVELS[levelKey]||CMP_LEVELS.mid;
  const st=scanImages();
  if(!st.uniq.length){toast('没有可压缩的图片');return;}
  if(!confirm('按「'+L.label+'」重新压缩 '+st.uniq.length+' 张图片？此操作不可撤销。'))return;
  __cmp={list:st.uniq,i:0,before:0,after:0,changed:0,maxW:L.maxW,q:L.q,label:L.label};
  renderCmpProgress();cmpStep();
}
function renderCmpProgress(){
  const s=__cmp;if(!s)return;
  const pct=s.list.length?Math.round(s.i/s.list.length*100):100;
  document.getElementById('modal-body').innerHTML=`
    <div class="modal-title">🗜 正在压缩图片</div>
    <div class="sg-bar ok"><div style="width:${pct}%"></div></div>
    <div class="muted" style="margin-top:8px;font-size:13px">
      ${s.i} / ${s.list.length} 张 · 已替换 ${s.changed} 张<br>
      <span style="font-size:12px">压缩中请勿关闭页面…</span></div>`;
  showModal();
}
function cmpStep(){
  const s=__cmp;if(!s)return;
  if(s.i>=s.list.length){cmpDone();return;}
  const du=s.list[s.i];
  recompress(du,s.maxW,s.q,ndu=>{
    if(!__cmp)return;                       // 面板已关闭
    s.before+=du.length;
    if(ndu&&ndu.length<du.length){replaceImageEverywhere(du,ndu);s.after+=ndu.length;s.changed++;}
    else s.after+=du.length;
    s.i++;renderCmpProgress();
    setTimeout(cmpStep,0);                  // 让出主线程，避免卡死
  });
}
function recompress(du,maxW,q,cb){
  try{
    const img=new Image();
    img.onload=()=>{
      try{
        const scale=Math.min(1,maxW/(img.width||maxW));
        const w=Math.max(1,Math.round((img.width||maxW)*scale)),h=Math.max(1,Math.round((img.height||1)*scale));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        cb(cv.toDataURL('image/jpeg',q));
      }catch(e){cb(null);}
    };
    img.onerror=()=>cb(null);
    img.src=du;
  }catch(e){cb(null);}
}
function cmpDone(){
  const s=__cmp;if(!s)return;
  const saved=s.before-s.after,changed=s.changed;
  __cmp=null;save();
  openStorage();
  toast(saved>0?'压缩完成：'+changed+' 张变小，省出 '+fmtSize(saved):'图片已是最优，无需压缩');
}
function stripDeckImages(id){
  const d=getDeck(id);if(!d)return;
  const n=(d.cards||[]).reduce((a,c)=>a+cardImages(c).length,0);
  if(!n){toast('该卡组没有图片');return;}
  if(!confirm('删除「'+d.name+'」中全部 '+n+' 张图片？文字会保留，图片位置标记为「[图片已清理]」。不可撤销。'))return;
  (d.cards||[]).forEach(c=>{c.front=stripImgTags(c.front);c.back=stripImgTags(c.back);});
  save();openStorage();toast('已删除 '+n+' 张图片');
}

function syncCfg(){try{return JSON.parse(localStorage.getItem('syncCfg'))||null;}catch(e){return null;}}
function setSyncCfg(c){localStorage.setItem('syncCfg',JSON.stringify(c));}
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(s)));}
async function ghGet(owner,repo,path,token){
  const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json'}});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  return {sha:j.sha,text:b64d(j.content.replace(/\s/g,''))};
}
async function ghPut(owner,repo,path,token,text,sha){
  const body={message:'sync: memory-card-data',content:b64e(text)};
  if(sha)body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{method:'PUT',headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();return j.sha;
}
async function syncPush(silent){
  const c=syncCfg();if(!c)return;
  try{
    const remote=await ghGet(c.owner,c.repo,'memory-card-data.json',c.token).catch(()=>null);
    const sha=remote?remote.sha:null;
    await ghPut(c.owner,c.repo,'memory-card-data.json',c.token,JSON.stringify(DB),sha);
    syncStatus('✅ 已上传云端 '+new Date().toLocaleTimeString());
    if(!silent)toast('已上传到云端');
  }catch(e){ if(!silent)toast('上传失败：'+e.message); syncStatus('❌ 上传失败：'+e.message); }
}
async function syncPull(){
  const c=syncCfg();if(!c){toast('请先配置同步');return;}
  try{
    const remote=await ghGet(c.owner,c.repo,'memory-card-data.json',c.token);
    if(!remote){toast('云端还没有数据，先上传');syncStatus('云端暂无数据');return;}
    const data=JSON.parse(remote.text);
    const remoteT=data.meta&&data.meta.savedAt||0;
    const localT=DB.meta&&DB.meta.savedAt||0;
    if(remoteT>=localT){
      DB=data;rawSet(LS_KEY,remote.text);
      syncStatus('✅ 已从云端拉取 '+new Date().toLocaleTimeString());
      toast('已从云端同步');renderHome();
    }else{
      syncStatus('本地更新更新时间更新，跳过拉取（可点上传覆盖云端）');
    }
  }catch(e){ toast('拉取失败：'+e.message); syncStatus('❌ '+e.message); }
}

function onImportFile(input){
  if(!input.files||!input.files[0])return;
  const f=input.files[0];
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data||!Array.isArray(data.decks))throw new Error('文件格式不正确（缺少 decks）');
      const overwrite=confirm('导入将【覆盖】当前全部数据。\n\n点「确定」=覆盖；点「取消」=合并（按卡组ID）');
      if(overwrite){
        DB=data;DB.folders=DB.folders||[];
      }else{
        DB.decks=DB.decks||[];DB.folders=DB.folders||[];
        (data.folders||[]).forEach(nf=>{ if(!DB.folders.find(f=>f.id===nf.id)) DB.folders.push(nf); });
        data.decks.forEach(nd=>{
          const ex=DB.decks.find(d=>d.id===nd.id);
          if(ex)Object.assign(ex,nd); else DB.decks.push(nd);
        });
        if(data.meta&&(data.meta.savedAt||0)>(DB.meta.savedAt||0))DB.meta.savedAt=data.meta.savedAt;
      }
      save();renderHome();
      toast('导入成功（'+(overwrite?'覆盖':'合并')+'）');
    }catch(e){ alert('导入失败：'+e.message); }
    input.value='';
  };
  r.readAsText(f);
}

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function stripHtml(h){return (h==null?'':String(h)).replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();}
/* 空白卡判定：正面与背面（去 HTML/空白后）都为空 → 无效卡片，自动隐藏且不进复习队列 */
function isCardEmpty(c){return !stripHtml(c&&c.front||'').trim() && !stripHtml(c&&c.back||'').trim();}
function hasContent(h){return !!(h&&(/<img/i.test(h)||stripHtml(h)!==''));}
/* 兼容旧纯文本卡片：含富文本标记则原样输出，否则转义并把换行变 <br> */
function isRich(s){s=s||'';
  return /<(img|br|hr)\b[^<>]*>/i.test(s)          /* 自闭合标签 */
      || /<\/(span|div|p|b|i|u|strong|em|font|a)>/i.test(s)  /* 结束标签 */
      || /<(span|div|p)\b[^<>]*>/i.test(s);        /* 富文本容器 */
}
function toRich(s){s=(s==null?'':String(s));const h=isRich(s)?s:esc(s).replace(/\n/g,'<br>');return renderMathHtml(h);}
/* 长答案自动分行排版：把密集成段 / 成条的“答案”拆成多行，提升卡片阅读观感。
   - 富文本原样（交给富文本编辑器，不乱动标签）
   - 含显式换行则尊重用户自己的回车
   - 短答案不分行
   - 长答案：句末标点(。！？；;)后、编号 / 项目符号前自动换行；明显成串的枚举(≥3个、)也分行 */
function fmtAnswer(s){
  s=(s==null?'':String(s));
  if(isRich(s)) return renderMathHtml(s);          // 富文本原样输出（含公式渲染）
  if(s.indexOf('\n')>=0) return renderMathHtml(esc(s).replace(/\n/g,'<br>'));   // 尊重显式换行
  let t=s.replace(/[ \t]+/g,' ').replace(/\s+/g,' ').trim();      // 仅规整空白，保留 < 等原文（结尾统一转义）
  if(!t) return '';
  if(t.length<26) return renderMathHtml(esc(t));                  // 短答案不分行
  /* 含 LaTeX 公式时，自动分行排版很可能切断 $...$，保守处理：只转义 + 渲染公式 */
  if(t.indexOf('$')>=0) return renderMathHtml(esc(t).replace(/\n/g,'<br>'));
  t=t.replace(/([。！？!?；;])(?=\S)/g,'$1\n');   // 句末 / 分号后换行
  t=t.replace(/(\S)(\s*[(（]?\d+[.、)）])/g,'$1\n$2');   // 编号前换行
  t=t.replace(/(\S)(\s*[①②③④⑤⑥⑦⑧⑨⑩])/g,'$1\n$2');    // 项目符号前换行
  if((t.match(/、/g)||[]).length>=3) t=t.replace(/、/g,'\n'); // 长枚举用 、 分行
  t=t.replace(/\n{2,}/g,'\n').trim();
  return renderMathHtml(esc(t).replace(/\n/g,'<br>'));
}
/* =================== LaTeX 公式渲染（KaTeX） =================== */
/* 把文本按 $...$（行内）与 $$...$$（块级）切成 token，支持 \$ 转义。
   用左→右扫描而非正则回溯，避免老旧 WebView 不支持 lookbehind 的问题。 */
function splitMath(text){
  const toks=[];let i=0;const n=text.length;
  while(i<n){
    const ch=text[i];
    if(ch==='\\'){toks.push({t:'text',v:text.slice(i,i+2)});i+=2;continue;}
    if(ch==='$'){
      if(text[i+1]==='$'){                                   // $$...$$ 块级
        const end=text.indexOf('$$',i+2);
        if(end>=0){toks.push({t:'disp',v:text.slice(i+2,end)});i=end+2;continue;}
        toks.push({t:'text',v:'$'});i++;continue;
      }
      let end=text.indexOf('$',i+1);                         // $...$ 行内
      if(end>i+1){
        while(end>i+1 && text[end-1]==='\\'){               // 跳过被转义的 \$
          const e2=text.indexOf('$',end+1);
          if(e2<0){end=-1;break;}
          end=e2;
        }
      }else end=-1;
      if(end>i+1){toks.push({t:'inline',v:text.slice(i+1,end)});i=end+1;continue;}
      toks.push({t:'text',v:'$'});i++;continue;
    }
    let j=i;while(j<n && text[j]!=='\\' && text[j]!=='$')j++;
    toks.push({t:'text',v:text.slice(i,j)});i=j;
  }
  return toks;
}
/* 在已转义 / 富文本 HTML 上渲染公式：解析进 DOM，遍历文本节点替换公式，再序列化。
   若不联网（KaTeX 未加载）或不含 $，原样返回，不破坏任何内容。 */
function renderMathHtml(h){
  if(!h || h.indexOf('$')<0) return h;
  if(typeof katex==='undefined') return h;
  let doc;
  try{doc=new DOMParser().parseFromString('<div>'+h+'</div>','text/html');}catch(e){return h;}
  const root=doc.body&&doc.body.firstChild;
  if(!root) return h;
  walkMath(root);
  return root.innerHTML;
}
function walkMath(node){
  const kids=Array.from(node.childNodes);
  for(const ch of kids){
    if(ch.nodeType===3){                                    // 文本节点
      const txt=ch.nodeValue;
      if(!txt || txt.indexOf('$')<0) continue;
      const toks=splitMath(txt);
      if(toks.length===1 && toks[0].t==='text') continue;  // 无公式则不碰
      const doc=node.ownerDocument, frag=doc.createDocumentFragment();
      for(const tk of toks){
        if(tk.t==='text'){ frag.appendChild(doc.createTextNode(tk.v)); continue; }
        const node2=renderMathNode(tk.v, tk.t==='disp', doc);
        if(node2) frag.appendChild(node2);
        else frag.appendChild(doc.createTextNode((tk.t==='disp'?'$$':'$')+tk.v+(tk.t==='disp'?'$$':'$')));
      }
      node.replaceChild(frag,ch);
    }else if(ch.nodeType===1){                              // 元素节点：递归
      walkMath(ch);
    }
  }
}
function renderMathNode(tex,display,doc){
  try{
    const html=katex.renderToString(tex,{displayMode:display,throwOnError:false,errorColor:'#e11d48'});
    const tmp=doc.createElement('span');tmp.innerHTML=html;return tmp.firstChild;
  }catch(e){ return null; }
}

let __ceFileInput=null;
function imgToDataURL(file,maxW,cb){
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{
    const scale=Math.min(1,maxW/(img.width||maxW));const w=Math.round((img.width||maxW)*scale),h=Math.round((img.height||1)*scale);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    cb(cv.toDataURL('image/jpeg',0.85));
  };img.onerror=()=>toast('图片读取失败');img.src=r.result;};
  r.onerror=()=>toast('图片读取失败');r.readAsDataURL(file);
}
function cePickImage(btn){
  const ed=btn.closest('.ce-field')&&btn.closest('.ce-field').querySelector('.ce-edit');
  if(!ed){toast('未找到编辑区');return;}
  window.__ceEd=ed;
  if(!__ceFileInput){
    __ceFileInput=document.createElement('input');__ceFileInput.type='file';__ceFileInput.accept='image/*';__ceFileInput.style.display='none';
    document.body.appendChild(__ceFileInput);
    __ceFileInput.onchange=()=>{const f=__ceFileInput.files&&__ceFileInput.files[0];if(f)imgToDataURL(f,1000,du=>ceInsertImage(window.__ceEd,du));__ceFileInput.value='';};
  }
  __ceFileInput.click();
}
function ceInsertImage(ed,du){
  ed.focus();
  const sel=window.getSelection&&document.getSelection?document.getSelection():null;
  if(sel&&sel.rangeCount&&ed.contains(sel.anchorNode)){
    const r=sel.getRangeAt(0);r.deleteContents();const im=document.createElement('img');im.src=du;im.className='ce-img';r.insertNode(im);
    try{const nr=document.createRange();nr.setStartAfter(im);nr.setEndAfter(im);sel.removeAllRanges();sel.addRange(nr);}catch(e){}
    return;
  }
  const im=document.createElement('img');im.src=du;im.className='ce-img';ed.appendChild(im);
}
function ceFieldHTML(editId,valHTML,oninput){
  const oi=oninput?` oninput="${oninput}"`:'';
  return `<div class="ce-field"><div class="ce-bar">
    <button type="button" class="btn btn-ghost btn-xs" onclick="cePickImage(this)">🖼 图片</button>
    <button type="button" class="btn btn-ghost btn-xs" onclick="ceInsertLatex(this)" title="插入 LaTeX 公式，如 $\\int_a^b f(x)dx$">Σ 公式</button>
  </div><div class="ce-edit" id="${editId}" contenteditable="true"${oi}>${valHTML||''}</div></div>`;
}
/* 在光标处插入 LaTeX 占位（被 contenteditable 保存为纯文本 $...$，渲染时由 KaTeX 显示） */
function ceInsertLatex(btn){
  const ed=btn.closest('.ce-field')&&btn.closest('.ce-field').querySelector('.ce-edit');
  if(!ed){toast('未找到编辑区');return;}
  ed.focus();
  const tpl='$  $';const L=tpl.length;
  const sel=window.getSelection&&document.getSelection?document.getSelection():null;
  if(sel&&sel.rangeCount&&ed.contains(sel.anchorNode)){
    const r=sel.getRangeAt(0);r.deleteContents();
    const span=document.createElement('span');span.textContent=tpl;
    r.insertNode(span);
    try{const nr=document.createRange();nr.setStart(span.firstChild,1);nr.setEnd(span.firstChild,L-1);sel.removeAllRanges();sel.addRange(nr);}catch(e){}
  }else{ ed.insertAdjacentHTML('beforeend','<span>'+tpl+'</span>'); }
}

function tagField(key,field,val){
  const t=CARD_TAGS.find(x=>x.key===key);if(!t)return;
  t[field]=val;syncTags();save();
  if(cur.deckId&&document.getElementById('view-detail'))renderDetail();
  if(window.__sc)renderStudyConfig();
  if(window.__ct)renderCardTags();
  if(window.__bt)renderBatchTagModal();
  renderTagManager();
}
function tagAdd(){
  const ic=document.getElementById('tag-new-ic'),lb=document.getElementById('tag-new-lb');
  if(!lb)return;const label=lb.value.trim();if(!label){toast('请输入标签名');return;}
  const icon=ic?ic.value.trim()||'🏷':'🏷';
  CARD_TAGS.push({key:'t'+Date.now().toString(36),icon,label});syncTags();save();
  renderTagManager();toast('已添加标签');
  if(cur.deckId&&document.getElementById('view-detail'))renderDetail();
  if(window.__sc)renderStudyConfig();
  if(window.__ct)renderCardTags();
  if(window.__bt)renderBatchTagModal();
}
function tagDel(key){
  if(CARD_TAGS.length<=1){toast('至少保留一个标签');return;}
  if(!confirm('删除该标签？所有卡片上对应的标签也会一并移除。'))return;
  CARD_TAGS=CARD_TAGS.filter(t=>t.key!==key);syncTags();
  DB.decks.forEach(d=>(d.cards||[]).forEach(c=>{if(c.tags)c.tags=c.tags.filter(x=>x!==key);}));
  if(window.__ct&&window.__ct.tags)window.__ct.tags=window.__ct.tags.filter(x=>x!==key);   // 同步清掉编辑副本中的失效标签
  if(window.__bt&&window.__bt.tags)window.__bt.tags=window.__bt.tags.filter(x=>x!==key);
  if(window.__sc&&window.__sc.tags)window.__sc.tags=window.__sc.tags.filter(x=>x!==key);
  save();renderTagManager();
  if(cur.deckId&&document.getElementById('view-detail'))renderDetail();
  if(window.__sc)renderStudyConfig();
  if(window.__ct)renderCardTags();
  if(window.__bt)renderBatchTagModal();
  toast('已删除标签');
}

function activeView(){const a=document.querySelector('.view.active');return a&&a.id?a.id.replace('view-',''):null;}
function go(view,record=true){
  const leaving=activeView();
  if(leaving)viewScroll[leaving]=window.scrollY||document.documentElement.scrollTop||0;  // 离开前保存当前滚动位置（文档滚动）
  if(record){const cur=activeView();if(cur&&cur!==view){navStack.push(cur);if(navStack.length>30)navStack.shift();}}
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));
  if(view==='home')renderHome();
  if(view==='fav')renderFav();
  if(view==='stats')renderStats();
  if(view==='import')renderImport();
  if(view==='detail')renderDetail();
  if(view==='plan')renderPlan();
  if(view==='diagnosis')renderDiagnosis();
  window.scrollTo(0,viewScroll[view]||0);                // 渲染后恢复目标视图滚动位置
}
function goBack(){const v=navStack.pop();if(v)go(v,false);else go('home',false);}   // 返回进入时的上一页

let _undo=null;          // 最近一次可撤销操作 {label, apply}
function pushUndo(label,applyFn){
  _undo={label,apply:applyFn};
  renderUndoBar();
}
function undoLast(){
  if(!_undo){toast('没有可撤销的操作');return;}
  const fn=_undo.apply;_undo=null;renderUndoBar();
  try{fn();}catch(e){console.error('undo failed',e);}
  toast('已撤销');
}
function dismissUndo(){_undo=null;renderUndoBar();}
function renderUndoBar(){
  const bar=document.getElementById('undo-bar');if(!bar)return;
  if(_undo){
    bar.innerHTML=`<span class="ub-text">已${_undo.label}</span>
      <button class="btn btn-primary btn-sm" onclick="undoLast()">↩ 撤销</button>
      <button class="btn btn-ghost btn-sm" onclick="dismissUndo()">✕</button>`;
    bar.classList.add('show');
  }else{bar.classList.remove('show');bar.innerHTML='';}
}
/* 快照当前卡组某数组（cards/questions），撤销时整体还原，避免逐条还原出错 */
function pushDeckUndo(id,label,key,before){
  pushUndo(label,()=>{
    const d=getDeck(id);
    if(!d){toast('卡组已不存在，无法撤销');return;}
    d[key]=JSON.parse(JSON.stringify(before));
    save();
    if(cur.deckId===id){sel.active=false;sel.ids.clear();renderDetail();}
    else renderHome();
  });
}

function memAccuracy(){
  let t=0,c=0;activeDecks().forEach(d=>(d.cards||[]).forEach(x=>{t+=x.reviews||0;c+=x.correct||0;}));
  return t?Math.round(c/t*100):0;
}
function quizAccuracy(){
  let t=0,c=0;activeDecks().forEach(d=>{const q=d.quiz||{};t+=q.total||0;c+=q.correct||0;});
  return t?Math.round(c/t*100):0;
}
function doneBarHtml(d,prefix){
  const cards=(d.cards||[]).filter(c=>!isCardEmpty(c));
  const cardDone=cards.filter(c=>(c.reviews||0)>0).length;   // 已至少复习过一次的卡片
  const qs=d.questions||[];
  const qDone=qs.filter(q=>q.done).length;                    // 已做题目
  const total=cards.length+qs.length;                         // 基数 = 卡片 + 题目 合计
  const done=cardDone+qDone;
  const pct=total?Math.round(done/total*100):0;
  if(!total)return '';
  return `<div class="q-done"><span class="muted">${prefix||'📊 整体学习进度'} ${done}/${total} · ${pct}%</span>
    <div class="q-bar thin"><div style="width:${pct}%;background:var(--green)"></div></div></div>`;
}
function deckTagStats(d){
  const cards=d.cards||[];
  return CARD_TAGS.map(t=>{
    const tagged=cards.filter(c=>(c.tags||[]).includes(t.key));
    const total=tagged.length;
    const due=tagged.filter(c=>(c.nextReview||0)<=now()).length;
    return {key:t.key,icon:t.icon,label:t.label,total,due};
  }).filter(s=>s.total>0);
}
function startToday(){
  settleBuffer();                                  // 进入复习前先结算配额缓冲
  // 汇总所有卡组的到期卡片 + 错题，直接进入复习，不跳编辑页
  const dueCards=[];const wrongQs=[];
  activeDecks().forEach(d=>{
    (d.cards||[]).forEach(c=>{if((c.nextReview||0)<=now())dueCards.push(c);});
    (d.questions||[]).forEach(q=>{if(q.inWrongBook)wrongQs.push(q);});
  });
  // 次日复习计划：优先把薄弱知识点塞进队列（消费后清空）
  const plan=DB.meta.planTomorrow||{cards:[],questions:[]};
  let planN=0;
  plan.cards.forEach(id=>{const c=findCard(id);if(c&&!dueCards.includes(c)){dueCards.push(c);planN++;}});
  plan.questions.forEach(id=>{const q=findQuestion(id);if(q&&!wrongQs.includes(q)){wrongQs.push(q);planN++;}});
  if(planN){DB.meta.planTomorrow={cards:[],questions:[]};save();}
  dueCards.sort((a,b)=>(a.nextReview||0)-(b.nextReview||0));
  if(!dueCards.length && !wrongQs.length){toast('今天没有待复习内容 🎉');return;}
  updateStreak();
  if(dueCards.length){
    // 先背全部到期卡，背完再刷全部错题
    studyState={deckId:'__all__',queue:dueCards,idx:0,flipped:false,mode:'due',scope:'due',order:'seq',global:true,afterWrong:wrongQs,display:'flip',reveal:0,selfAns:'',selfRes:null,noteOpen:false};
    if(planN)toast('已优先加入 '+planN+' 个薄弱点复习 ✅');
    go('study');renderStudy();
  }else{
    startGlobalQuiz(wrongQs);
  }
}
function startGlobalQuiz(qs){
  qs=qs||(studyState.afterWrong||[]);
  if(!qs||!qs.length){toast('没有错题需要刷');go('home');return;}
  quiz={deckId:'__all__',queue:qs.slice(),idx:0,mode:'sequential',range:'wrong',types:null,sel:[],submitted:false,guess:false,rGuess:0,rLucky:0,shuffle:defaultShuffle(),orders:{},global:true};
  go('quiz');renderQuiz();
}
function findDeckOfQuestion(qid){
  for(const d of DB.decks){if((d.questions||[]).some(x=>x.id===qid))return d;}
  return null;
}

function onFile(input){
  const f=input.files[0];if(!f)return;

  const r=new FileReader();
  r.onload=()=>{
    const text=r.result;
    // 卡组 JSON 导出：与「导入卡组」同入口，直接识别并导入

    const pa=document.getElementById('pasteArea');if(pa)pa.value=text;toast('已读取文件：'+f.name);
  };
  r.readAsText(f,'utf-8');
}
